  - pre_text: 'entergy louisiana , llc and subsidiaries management 2019s financial
      discussion and analysis results of operations net income 2017 compared to 2016
      net income decreased $ 305.7 million primarily due to the effect of the enactment
      of the tax cuts and jobs act , in december 2017 , which resulted in a decrease
      of $ 182.6 million in net income in 2017 , and the effect of a settlement with
      the irs related to the 2010-2011 irs audit , which resulted in a $ 136.1 million
      reduction of income tax expense in 2016 .


      also contributing to the decrease in net income were higher other operation
      and maintenance expenses .


      the decrease was partially offset by higher net revenue and higher other income
      .


      see note 3 to the financial statements for discussion of the effects of the
      tax cuts and jobs act and the irs audit .


      2016 compared to 2015 net income increased $ 175.4 million primarily due to
      the effect of a settlement with the irs related to the 2010-2011 irs audit ,
      which resulted in a $ 136.1 million reduction of income tax expense in 2016
      .


      also contributing to the increase were lower other operation and maintenance
      expenses , higher net revenue , and higher other income .


      the increase was partially offset by higher depreciation and amortization expenses
      , higher interest expense , and higher nuclear refueling outage expenses .


      see note 3 to the financial statements for discussion of the irs audit .


