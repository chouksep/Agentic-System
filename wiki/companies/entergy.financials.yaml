  - pre_text: 'entergy corporation and subsidiaries notes to financial statements
      the ferc proceedings that resulted from rate filings made in 2007 , 2008 , and
      2009 have been resolved by various orders issued by the ferc and appellate courts
      .


      see below for a discussion of rate filings since 2009 and the comprehensive
      recalculation filing directed by the ferc in the proceeding related to the 2010
      rate filing .


      2010 rate filing based on calendar year 2009 production costs in may 2010 ,
      entergy filed with the ferc the 2010 rates in accordance with the ferc 2019s
      orders in the system agreement proceeding , and supplemented the filing in september
      2010 .


      several parties intervened in the proceeding at the ferc , including the lpsc
      and the city council , which also filed protests .


      in july 2010 the ferc accepted entergy 2019s proposed rates for filing , effective
      june 1 , 2010 , subject to refund , and set the proceeding for hearing and settlement
      procedures .


      settlement procedures have been terminated , and the alj scheduled hearings
      to begin in march 2011 .


      subsequently , in january 2011 the alj issued an order directing the parties
      and ferc staff to show cause why this proceeding should not be stayed pending
      the issuance of ferc decisions in the prior production cost proceedings currently
      before the ferc on review .


      in march 2011 the alj issued an order placing this proceeding in abeyance .


      in october 2013 the ferc issued an order granting clarification and denying
      rehearing with respect to its october 2011 rehearing order in this proceeding
      .


      the ferc clarified that in a bandwidth proceeding parties can challenge erroneous
      inputs , implementation errors , or prudence of cost inputs , but challenges
      to the bandwidth formula itself must be raised in a federal power act section
      206 complaint or section 205 filing .


      subsequently in october 2013 the presiding alj lifted the stay order holding
      in abeyance the hearing previously ordered by the ferc and directing that the
      remaining issues proceed to a hearing on the merits .


      the hearing was held in march 2014 and the presiding alj issued an initial decision
      in september 2014 .


      briefs on exception were filed in october 2014 .


      in december 2015 the ferc issued an order affirming the initial decision in
      part and rejecting the initial decision in part .


      among other things , the december 2015 order directs entergy services to submit
      a compliance filing , the results of which may affect the rough production cost
      equalization filings made for the june - december 2005 , 2006 , 2007 , and 2008
      test periods .


      in january 2016 the lpsc , the apsc , and entergy services filed requests for
      rehearing of the ferc 2019s december 2015 order .


      in february 2016 , entergy services submitted the compliance filing ordered
      in the december 2015 order .


      the result of the true-up payments and receipts for the recalculation of production
      costs resulted in the following payments/receipts among the utility operating
      companies : payments ( receipts ) ( in millions ) .'
