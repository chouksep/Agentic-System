      with a net increase in revenue of approximately $ 133 million ; an authorized
      return on common equity of 9.75% ( 9.75 % ) ; and a formula rate plan tariff
      that provides a +/- 50 basis point band around the 9.75% ( 9.75 % ) allowed
      return on common equity .


      a significant portion of the rate increase is related to entergy arkansas 2019s
      acquisition in march 2016 of union power station power block 2 for a base purchase
      price of $ 237 million .


      the settlement agreement also provided for amortization over a 10-year period
      of $ 7.7 million of previously-incurred costs related to ano post-fukushima
      compliance and $ 9.9 million of previously-incurred costs related to ano flood
      barrier compliance .


