      in accordance with the terms of the annual incentive plan , in january 2012
      , the personnel committee certified the 2012 entergy achievement multiplier
      at 128% ( 128 % ) of target .


      under the terms of the management effectiveness program , the entergy achievement
      multiplier is automatically increased by 25 percent for the members of the office
      of the chief executive if the pre- established underlying performance goals
      established by the personnel committee are satisfied at the end of the performance
      period , subject to the personnel committee''s discretion to adjust the automatic
      multiplier downward or eliminate it altogether .


      in accordance with section 162 ( m ) of the internal revenue code , the multiplier
      which entergy refers to as the management effectiveness factor is intended to
      provide the committee a mechanism to take into consideration specific achievement
      factors relating to the overall performance of entergy corporation .


      in january 2012 , the committee eliminated the management effectiveness factor
