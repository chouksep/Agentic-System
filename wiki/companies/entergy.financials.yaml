    post_text: 'see note 4 to the financial statements for a description of the money
      pool .


      nuclear matters system energy owns and operates grand gulf .


      system energy is , therefore , subject to the risks related to owning and operating
      a nuclear plant .


      these include risks from the use , storage , handling and disposal of high-
      level and low-level radioactive materials , regulatory requirement changes ,
      including changes resulting from events at other plants , limitations on the
      amounts and types of insurance commercially available for losses in connection
      with nuclear operations , and technological and financial uncertainties related
      to decommissioning nuclear plants at the end of their licensed lives , including
      the sufficiency of funds in decommissioning trusts .


      in the event of an unanticipated early shutdown of grand gulf , system energy
      may be required to provide additional funds or credit support to satisfy regulatory
      requirements for decommissioning .


      after the nuclear incident in japan resulting from the march 2011 earthquake
      and tsunami , the nrc established a task force to conduct a review of processes
      and regulations relating to nuclear facilities in the united states .


      the task force issued a near term ( 90-day ) report in july 2011 that has made
      recommendations , which are currently being evaluated by the nrc .


      it is anticipated that the nrc will issue certain orders and requests for information
      to nuclear plant licensees by the end of the first quarter 2012 that will begin
      to implement the task force 2019s recommendations .


      these orders may require u.s .


      nuclear operators , including entergy , to undertake plant modifications or
      perform additional analyses that could , among other things , result in increased
      costs and capital requirements associated with operating entergy 2019s nuclear
      plants. .'
