      complaint against system energy in january 2017 the apsc and mpsc filed a complaint
      with the ferc against system energy .


      the complaint seeks a reduction in the return on equity component of the unit
      power sales agreement pursuant to which system energy sells its grand gulf capacity
      and energy to entergy arkansas , entergy louisiana , entergy mississippi , and
      entergy new orleans .


      entergy arkansas also sells some of its grand gulf capacity and energy to entergy
      louisiana , entergy mississippi , and entergy new orleans under separate agreements
      .


      the current return on equity under the unit power sales agreement is 10.94%
      ( 10.94 % ) .


      the complaint alleges that the return on equity is unjust and unreasonable because
      current capital market and other considerations indicate that it is excessive
      .


      the complaint requests the ferc to institute proceedings to investigate the
      return on equity and establish a lower return on equity , and also requests
      that the ferc establish january 23 , 2017 as a refund effective date .


      the complaint includes return on equity analysis that purports to establish
      that the range of reasonable return on equity for system energy is between 8.37%
      ( 8.37 % ) and 8.67% ( 8.67 % ) .


      system energy answered the complaint in february 2017 and disputes that a return
      on equity of 8.37% ( 8.37 % ) to 8.67% ( 8.67 % ) is just and reasonable .


      the lpsc and the city council intervened in the proceeding expressing support
      for the complaint .


      system energy is recording a provision against revenue for the potential outcome
      of this proceeding .


      in september 2017 the ferc established a refund effective date of january 23
      , 2017 , consolidated the return on equity complaint with the proceeding described
      in unit power sales agreement below , and directed the parties to engage in
      settlement .'
