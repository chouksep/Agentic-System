  - pre_text: 'human capital management strategic imperative entergy engaged in a
      strategic imperative intended to optimize the organization through a process
      known as human capital management .


      in july 2013 management completed a comprehensive review of entergy 2019s organization
      design and processes .


      this effort resulted in a new internal organization structure , which resulted
      in the elimination of approximately 800 employee positions .


      entergy incurred approximately $ 110 million in costs in 2013 associated with
      this phase of human capital management , primarily implementation costs , severance
      expenses , pension curtailment losses , special termination benefits expense
      , and corporate property , plant , and equipment impairments .


      in december 2013 , entergy deferred for future recovery approximately $ 45 million
      of these costs , as approved by the apsc and the lpsc .


