    post_text: 'subsequent to the closing , entergy received approximately $ 6 million
      from consumers energy company as part of the post-closing adjustment defined
      in the asset sale agreement .


      the post-closing adjustment amount resulted in an approximately $ 6 million
      reduction in plant and a corresponding reduction in other liabilities .


      for the ppa , which was at below-market prices at the time of the acquisition
      , non-utility nuclear will amortize a liability to revenue over the life of
      the agreement .


      the amount that will be amortized each period is based upon the difference between
      the present value calculated at the date of acquisition of each year''s difference
      between revenue under the agreement and revenue based on estimated market prices
      .


      amounts amortized to revenue were $ 53 million in 2009 , $ 76 million in 2008
      , and $ 50 million in 2007 .


      the amounts to be amortized to revenue for the next five years will be $ 46
      million for 2010 , $ 43 million for 2011 , $ 17 million in 2012 , $ 18 million
      for 2013 , and $ 16 million for 2014 .


      nypa value sharing agreements non-utility nuclear''s purchase of the fitzpatrick
      and indian point 3 plants from nypa included value sharing agreements with nypa
      .


      in october 2007 , non-utility nuclear and nypa amended and restated the value
      sharing agreements to clarify and amend certain provisions of the original terms
      .


      under the amended value sharing agreements , non-utility nuclear will make annual
      payments to nypa based on the generation output of the indian point 3 and fitzpatrick
      plants from january 2007 through december 2014 .


      non-utility nuclear will pay nypa $ 6.59 per mwh for power sold from indian
      point 3 , up to an annual cap of $ 48 million , and $ 3.91 per mwh for power
      sold from fitzpatrick , up to an annual cap of $ 24 million .


      the annual payment for each year''s output is due by january 15 of the following
      year .


      non-utility nuclear will record its liability for payments to nypa as power
      is generated and sold by indian point 3 and fitzpatrick .


      an amount equal to the liability will be recorded to the plant asset account
      as contingent purchase price consideration for the plants .


      in 2009 , 2008 , and 2007 , non-utility nuclear recorded $ 72 million as plant
      for generation during each of those years .


      this amount will be depreciated over the expected remaining useful life of the
      plants .


      in august 2008 , non-utility nuclear entered into a resolution of a dispute
      with nypa over the applicability of the value sharing agreements to its fitzpatrick
      and indian point 3 nuclear power plants after the planned spin-off of the non-utility
      nuclear business .


      under the resolution , non-utility nuclear agreed not to treat the separation
      as a "cessation event" that would terminate its obligation to make the payments
      under the value sharing agreements .


      as a result , after the spin-off transaction , enexus will continue to be obligated
      to make payments to nypa under the amended and restated value sharing agreements.
      .'
    id: etr-2009-table-2
  - pre_text: 'entergy corporation and subsidiaries management''s financial discussion
      and analysis the purchased power capacity variance is primarily due to higher
      capacity charges .


      a portion of the variance is due to the amortization of deferred capacity costs
      and is offset in base revenues due to base rate increases implemented to recover
      incremental deferred and ongoing purchased power capacity charges .


      the volume/weather variance is primarily due to the effect of less favorable
      weather compared to the same period in 2007 and decreased electricity usage
      primarily during the unbilled sales period .


      hurricane gustav and hurricane ike , which hit the utility''s service territories
      in september 2008 , contributed an estimated $ 46 million to the decrease in
      electricity usage .


      industrial sales were also depressed by the continuing effects of the hurricanes
      and , especially in the latter part of the year , because of the overall decline
      of the economy , leading to lower usage in the latter part of the year affecting
      both the large customer industrial segment as well as small and mid-sized industrial
      customers .


      the decreases in electricity usage were partially offset by an increase in residential
      and commercial customer electricity usage that occurred during the periods of
      the year not affected by the hurricanes .


      the retail electric price variance is primarily due to : an increase in the
      attala power plant costs recovered through the power management rider by entergy
      mississippi .


      the net income effect of this recovery is limited to a portion representing
      an allowed return on equity with the remainder offset by attala power plant
      costs in other operation and maintenance expenses , depreciation expenses ,
      and taxes other than income taxes ; a storm damage rider that became effective
      in october 2007 at entergy mississippi ; and an energy efficiency rider that
      became effective in november 2007 at entergy arkansas .


      the establishment of the storm damage rider and the energy efficiency rider
      results in an increase in rider revenue and a corresponding increase in other
