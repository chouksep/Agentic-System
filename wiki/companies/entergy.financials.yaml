    post_text: '( 1 ) 201cowned and leased capability 201d is the dependable load
      carrying capability as demonstrated under actual operating conditions based
      on the primary fuel ( assuming no curtailments ) that each station was designed
      to utilize .


      the entergy system''s load and capacity projections are reviewed periodically
      to assess the need and timing for additional generating capacity and interconnections
      .


      these reviews consider existing and projected demand , the availability and
      price of power , the location of new load , and the economy .


      summer peak load in the entergy system service territory has averaged 21246
      mw from 2002-2011 .


      in the 2002 time period , the entergy system''s long-term capacity resources
      , allowing for an adequate reserve margin , were approximately 3000 mw less
      than the total capacity required for peak period demands .


      in this time period the entergy system met its capacity shortages almost entirely
      through short-term power purchases in the wholesale spot market .


      in the fall of 2002 , the entergy system began a program to add new resources
      to its existing generation portfolio and began a process of issuing requests
      for proposals ( rfp ) to procure supply-side resources from sources other than
      the spot market to meet the unique regional needs of the utility operating companies
      .


      the entergy system has adopted a long-term resource strategy that calls for
      the bulk of capacity needs to be met through long-term resources , whether owned
      or contracted .


      entergy refers to this strategy as the "portfolio transformation strategy" .


      over the past nine years , portfolio transformation has resulted in the addition
      of about 4500 mw of new long-term resources .


      these figures do not include transactions currently pending as a result of the
      summer 2009 rfp .


      when the summer 2009 rfp transactions are included in the entergy system portfolio
      of long-term resources and adjusting for unit deactivations of older generation
      , the entergy system is approximately 500 mw short of its projected 2012 peak
      load plus reserve margin .


      this remaining need is expected to be met through a nuclear uprate at grand
      gulf and limited-term resources .


      the entergy system will continue to access the spot power market to economically
      .'
