  - pre_text: 'operations may be extended up to four additional years for each unit
      by mutual agreement of entergy and new york state based on an exigent reliability
      need for indian point generation .


      in accordance with the ferc-approved tariff of the new york independent system
      operator ( nyiso ) , entergy submitted to the nyiso a notice of generator deactivation
      based on the dates in the settlement ( no later than april 30 , 2020 for indian
      point unit 2 and april 30 , 2021 for indian point unit 3 ) .


      in december 2017 , nyiso issued a report stating there will not be a system
      reliability need following the deactivation of indian point .


      the nyiso also has advised that it will perform an analysis of the potential
      competitive impacts of the proposed retirement under provisions of its tariff
      .


      the deadline for the nyiso to make a withholding determination is in dispute
      and is pending before the ferc .


      in addition to contractually agreeing to cease commercial operations early ,
      in february 2017 entergy filed with the nrc an amendment to its license renewal
      application changing the term of the requested licenses to coincide with the
      latest possible extension by mutual agreement based on exigent reliability needs
      : april 30 , 2024 for indian point 2 and april 30 , 2025 for indian point 3
      .


      if entergy reasonably determines that the nrc will treat the amendment other
      than as a routine amendment , entergy may withdraw the amendment .


      other provisions of the settlement include termination of all then-existing
      investigations of indian point by the agencies signing the agreement , which
      include the new york state department of environmental conservation , the new
      york state department of state , the new york state department of public service
      , the new york state department of health , and the new york state attorney
      general .


      the settlement recognizes the right of new york state agencies to pursue new
      investigations and enforcement actions with respect to new circumstances or
      existing conditions that become materially exacerbated .


      another provision of the settlement obligates entergy to establish a $ 15 million
      fund for environmental projects and community support .


      apportionment and allocation of funds to beneficiaries are to be determined
      by mutual agreement of new york state and entergy .


      the settlement recognizes new york state 2019s right to perform an annual inspection
      of indian point , with scope and timing to be determined by mutual agreement
      .


      in may 2017 a plaintiff filed two parallel state court appeals challenging new
      york state 2019s actions in signing and implementing the indian point settlement
      with entergy on the basis that the state failed to perform sufficient environmental
      analysis of its actions .


      all signatories to the settlement agreement , including the entergy affiliates
      that hold nrc licenses for indian point , were named .


      the appeals were voluntarily dismissed in november 2017 .


      entergy corporation and subsidiaries management 2019s financial discussion and
      analysis liquidity and capital resources this section discusses entergy 2019s
      capital structure , capital spending plans and other uses of capital , sources
      of capital , and the cash flow activity presented in the cash flow statement
      .


