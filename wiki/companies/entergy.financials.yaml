  - pre_text: 'entergy corporation and subsidiaries notes to financial statements
      entergy new orleans securitization bonds - hurricane isaac in may 2015 the city
      council issued a financing order authorizing the issuance of securitization
      bonds to recover entergy new orleans 2019s hurricane isaac storm restoration
      costs of $ 31.8 million , including carrying costs , the costs of funding and
      replenishing the storm recovery reserve in the amount of $ 63.9 million , and
      approximately $ 3 million of up-front financing costs associated with the securitization
      .


      in july 2015 , entergy new orleans storm recovery funding i , l.l.c. , a company
      wholly owned and consolidated by entergy new orleans , issued $ 98.7 million
      of storm cost recovery bonds .


      the bonds have a coupon of 2.67% ( 2.67 % ) and an expected maturity date of
      june 2024 .


      although the principal amount is not due until the date given above , entergy
      new orleans storm recovery funding expects to make principal payments on the
      bonds over the next five years in the amounts of $ 11.4 million for 2016 , $
      10.6 million for 2017 , $ 11 million for 2018 , $ 11.2 million for 2019 , and
      $ 11.6 million for 2020 .


      with the proceeds , entergy new orleans storm recovery funding purchased from
      entergy new orleans the storm recovery property , which is the right to recover
      from customers through a storm recovery charge amounts sufficient to service
      the securitization bonds .


      the storm recovery property is reflected as a regulatory asset on the consolidated
      entergy new orleans balance sheet .


      the creditors of entergy new orleans do not have recourse to the assets or revenues
      of entergy new orleans storm recovery funding , including the storm recovery
      property , and the creditors of entergy new orleans storm recovery funding do
      not have recourse to the assets or revenues of entergy new orleans .


      entergy new orleans has no payment obligations to entergy new orleans storm
      recovery funding except to remit storm recovery charge collections .


      entergy texas securitization bonds - hurricane rita in april 2007 the puct issued
      a financing order authorizing the issuance of securitization bonds to recover
      $ 353 million of entergy texas 2019s hurricane rita reconstruction costs and
