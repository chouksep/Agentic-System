    post_text: '13 .


      financial instruments strategy and risk 2013 we may use derivative financial
      instruments in limited instances for other than trading purposes to assist in
      managing our overall exposure to fluctuations in interest rates and fuel prices
      .


      we are not a party to leveraged derivatives and , by policy , do not use derivative
      financial instruments for speculative purposes .


      derivative financial instruments qualifying for hedge accounting must maintain
      a specified level of effectiveness between the hedging instrument and the item
      being hedged , both at inception and throughout the hedged period .


      we formally document the nature and relationships between the hedging instruments
      and hedged items at inception , as well as our risk- management objectives ,
      strategies for undertaking the various hedge transactions , and method of assessing
      hedge effectiveness .


      changes in the fair market value of derivative financial instruments that do
      not qualify for hedge accounting are charged to earnings .


      we may use swaps , collars , futures , and/or forward contracts to mitigate
      the risk of adverse movements in interest rates and fuel prices ; however ,
      the use of these derivative financial instruments may limit future benefits
      from favorable interest rate and fuel price movements .


      market and credit risk 2013 we address market risk related to derivative financial
      instruments by selecting instruments with value fluctuations that highly correlate
      with the underlying hedged item .


      we manage credit risk related to derivative financial instruments , which is
      minimal , by requiring high credit standards for counterparties and periodic
      settlements .


      at december 31 , 2010 and 2009 , we were not required to provide collateral
      , nor had we received collateral , relating to our hedging activities .


      determination of fair value 2013 we determine the fair values of our derivative
      financial instrument positions based upon current fair values as quoted by recognized
      dealers or the present value of expected future cash flows .


      interest rate fair value hedges 2013 we manage our overall exposure to fluctuations
      in interest rates by adjusting the proportion of fixed and floating rate debt
      instruments within our debt portfolio over a given period .


      we generally manage the mix of fixed and floating rate debt through the issuance
      of targeted amounts of each as debt matures or as we require incremental borrowings
      .


      we employ derivatives , primarily swaps , as one of the tools to obtain the
      targeted mix .


      in addition , we also obtain flexibility in managing interest costs and the
      interest rate mix within our debt portfolio by evaluating the issuance of and
      managing outstanding callable fixed-rate debt securities .


      swaps allow us to convert debt from fixed rates to variable rates and thereby
      hedge the risk of changes in the debt 2019s fair value attributable to the changes
      in interest rates .


      we account for swaps as fair value hedges using the short-cut method ; therefore
      , we do not record any ineffectiveness within our consolidated financial statements.
      .'
