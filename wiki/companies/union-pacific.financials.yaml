    post_text: 'capital plan 2013 in 2014 , we expect our total capital investments
      to be approximately $ 3.9 billion , which may be revised if business conditions
      or the regulatory environment affect our ability to generate sufficient returns
      on these investments .


      while the number of our assets replaced will fluctuate as part of our replacement
      strategy , for 2014 we expect to use over 60% ( 60 % ) of our capital investments
      to replace and improve existing capital assets .


      among our major investment categories are replacing and improving track infrastructure
      and upgrading our locomotive , freight car and container fleets , including
      the acquisition of 200 locomotives .


      additionally , we will continue increasing our network and terminal capacity
      , especially in the southern region , and balancing terminal capacity with more
      mainline capacity .


      construction of a major rail facility at santa teresa , new mexico , will be
      completed in 2014 and will include a run-through and fueling facility as well
      as an intermodal ramp .


      we also plan to make significant investments in technology improvements , including
      approximately $ 450 million for ptc .


      we expect to fund our 2014 cash capital investments by using some or all of
      the following : cash generated from operations , proceeds from the sale or lease
      of various operating and non-operating properties , proceeds from the issuance
      of long-term debt , and cash on hand .


      our annual capital plan is a critical component of our long-term strategic plan
      , which we expect will enhance the long-term value of the corporation for our
      shareholders by providing sufficient resources to ( i ) replace and improve
      our existing track infrastructure to provide safe and fluid operations , ( ii
      ) increase network efficiency by adding or improving facilities and track ,
      and ( iii ) make investments that meet customer demand and take advantage of
      opportunities for long-term growth .


      financing activities cash used in financing activities increased in 2013 versus
      2012 , driven by a $ 744 million increase for the repurchase of shares under
      our common stock repurchase program and higher dividend payments in 2013 of
      $ 1.3 billion compared to $ 1.1 billion in 2012 .


      we increased our debt levels in 2013 , which partially offset the increase in
      cash used in financing activities .


      cash used in financing activities increased in 2012 versus 2011 .


      dividend payments in 2012 increased by $ 309 million , reflecting our higher
      dividend rate , and common stock repurchases increased by $ 56 million .


      our debt levels did not materially change from 2011 after a decline in debt
      levels from 2010 .


      therefore , less cash was used in 2012 for debt activity than in 2011 .


      dividends 2013 on february 6 , 2014 , we increased the quarterly dividend to
      $ 0.91 per share , payable on april 1 , 2014 , to shareholders of record on
      february 28 , 2014 .


      we expect to fund the increase in the quarterly dividend through cash generated
      from operations and cash on hand at december 31 , 2013 .


      credit facilities 2013 on december 31 , 2013 , we had $ 1.8 billion of credit
      available under our revolving credit facility ( the facility ) , which is designated
      for general corporate purposes and supports the issuance of commercial paper
      .


      we did not draw on the facility during 2013 .


      commitment fees and interest rates payable under the facility are similar to
      fees and rates available to comparably rated , investment-grade borrowers .


      the facility allows for borrowings at floating rates based on london interbank
      offered rates , plus a spread , depending upon credit ratings for our senior
      unsecured debt .


      the facility matures in 2015 under a four year term and requires the corporation
      to maintain a debt-to-net-worth coverage ratio as a condition to making a borrowing
      .


      at december 31 , 2013 , and december 31 , 2012 ( and at all times during the
      year ) , we were in compliance with this covenant .


      the definition of debt used for purposes of calculating the debt-to-net-worth
      coverage ratio includes , among other things , certain credit arrangements ,
      capital leases , guarantees and unfunded and vested pension benefits under title
      iv of erisa .


      at december 31 , 2013 , the debt-to-net-worth coverage ratio allowed us to carry
      up to $ 42.4 billion of debt ( as defined in the facility ) , and we had $ 9.9
      billion of debt ( as defined in the facility ) outstanding at that date .


      under our current capital plans , we expect to continue to satisfy the debt-to-net-worth
      coverage ratio ; however , many factors beyond our reasonable control .'
