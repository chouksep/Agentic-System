      interest expense 2013 interest expense increased in 2009 versus 2008 due primarily
      to higher weighted- average debt levels .


      in 2009 , the weighted-average debt level was $ 9.6 billion ( including the
      restructuring of locomotive leases in may of 2009 ) , compared to $ 8.3 billion
      in 2008 .


      our effective interest rate was 6.3% ( 6.3 % ) in 2009 , compared to 6.1% (
      6.1 % ) in 2008 .


      interest expense increased in 2008 versus 2007 due to a higher weighted-average
      debt level of $ 8.3 billion , compared to $ 7.3 billion in 2007 .


      a lower effective interest rate of 6.1% ( 6.1 % ) in 2008 , compared to 6.6%
      ( 6.6 % ) in 2007 , partially offset the effects of the higher weighted-average
      debt level .


      income taxes 2013 income taxes were lower in 2009 compared to 2008 , driven
      by lower pre-tax income .


      our effective tax rate for the year was 36.5% ( 36.5 % ) compared to 36.1% (
      36.1 % ) in 2008 .


      income taxes were higher in 2008 compared to 2007 , driven by higher pre-tax
      income .


      our effective tax rates were 36.1% ( 36.1 % ) and 38.4% ( 38.4 % ) in 2008 and
      2007 , respectively .


      the lower effective tax rate in 2008 resulted from several reductions in tax
      expense related to federal audits and state tax law changes .


      in addition , the effective tax rate in 2007 was increased by illinois legislation
      that increased deferred tax expense in the third quarter of 2007. .'
