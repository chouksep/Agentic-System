  - pre_text: 'liquidity and capital resources as of december 31 , 2011 , our principal
      sources of liquidity included cash , cash equivalents , our receivables securitization
      facility , and our revolving credit facility , as well as the availability of
      commercial paper and other sources of financing through the capital markets
      .


      we had $ 1.8 billion of committed credit available under our credit facility
      , with no borrowings outstanding as of december 31 , 2011 .


      we did not make any borrowings under this facility during 2011 .


      the value of the outstanding undivided interest held by investors under the
      receivables securitization facility was $ 100 million as of december 31 , 2011
      , and is included in our consolidated statements of financial position as debt
      due after one year .


      the receivables securitization facility obligates us to maintain an investment
      grade bond rating .


      if our bond rating were to deteriorate , it could have an adverse impact on
      our liquidity .


      access to commercial paper as well as other capital market financings is dependent
      on market conditions .


      deterioration of our operating results or financial condition due to internal
      or external factors could negatively impact our ability to access capital markets
      as a source of liquidity .


      access to liquidity through the capital markets is also dependent on our financial
      stability .


      we expect that we will continue to have access to liquidity by issuing bonds
      to public or private investors based on our assessment of the current condition
      of the credit markets .


      at december 31 , 2011 and 2010 , we had a working capital surplus .


      this reflects a strong cash position , which provides enhanced liquidity in
      an uncertain economic environment .


      in addition , we believe we have adequate access to capital markets to meet
      cash requirements , and we have sufficient financial capacity to satisfy our
      current liabilities .


