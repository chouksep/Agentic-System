      f0b7 freight revenues 2013 our freight revenues increased 7% ( 7 % ) year-over-year
      to $ 19.8 billion driven by volume growth of 2% ( 2 % ) , higher fuel surcharge
      revenue , and core pricing gains .


      growth in frac sand , coal , and intermodal shipments more than offset declines
      in grain , crude oil , finished vehicles , and rock shipments .


      f0b7 fuel prices 2013 our average price of diesel fuel in 2017 was $ 1.81 per
      gallon , an increase of 22% ( 22 % ) from 2016 , as both crude oil and conversion
      spreads between crude oil and diesel increased in 2017 .


      the higher price resulted in increased operating expenses of $ 334 million (
      excluding any impact from year- over-year volume growth ) .


      gross-ton miles increased 5% ( 5 % ) , which also drove higher fuel expense
      .


      our fuel consumption rate , computed as gallons of fuel consumed divided by
      gross ton-miles in thousands , improved 2% ( 2 % ) .


      f0b7 free cash flow 2013 cash generated by operating activities totaled $ 7.2
      billion , yielding free cash flow of $ 2.2 billion after reductions of $ 3.1
      billion for cash used in investing activities and $ 2 billion in dividends ,
      which included a 10% ( 10 % ) increase in our quarterly dividend per share from
      $ 0.605 to $ 0.665 declared and paid in the fourth quarter of 2017 .


      free cash flow is defined as cash provided by operating activities less cash
      used in investing activities and dividends paid .


      free cash flow is not considered a financial measure under gaap by sec regulation
      g and item 10 of sec regulation s-k and may not be defined and calculated by
      other companies in the same manner .


      we believe free cash flow is important to management and investors in evaluating
      our financial performance and measures our ability to generate cash without
