    post_text: 'operating activities higher net income and lower cash income tax payments
      in 2011 increased cash provided by operating activities compared to 2010 .


      the tax relief , unemployment insurance reauthorization , and job creation act
      of 2010 , enacted in december 2010 , provided for 100% ( 100 % ) bonus depreciation
      for qualified investments made during 2011 , and 50% ( 50 % ) bonus depreciation
      for qualified investments made during 2012 .


      as a result of the act , the company deferred a substantial portion of its 2011
      income tax expense .


      this deferral decreased 2011 income tax payments , thereby contributing to the
      positive operating cash flow .


      in future years , however , additional cash will be used to pay income taxes
      that were previously deferred .


      in addition , the adoption of a new accounting standard in january of 2010 changed
      the accounting treatment for our receivables securitization facility from a
      sale of undivided interests ( recorded as an operating activity ) to a secured
      borrowing ( recorded as a financing activity ) , which decreased cash provided
      by operating activities by $ 400 million in 2010 .


      higher net income in 2010 increased cash provided by operating activities compared
      to 2009 .


      investing activities higher capital investments partially offset by higher proceeds
      from asset sales in 2011 drove the increase in cash used in investing activities
      compared to 2010 .


      higher capital investments and lower proceeds from asset sales in 2010 drove
      the increase in cash used in investing activities compared to 2009. .'
