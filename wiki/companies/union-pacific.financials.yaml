  - pre_text: 'increase in dividends paid .


      free cash flow is defined as cash provided by operating activities less cash
      used in investing activities and dividends paid .


      free cash flow is not considered a financial measure under accounting principles
      generally accepted in the u.s .


      ( gaap ) by sec regulation g and item 10 of sec regulation s-k and may not be
      defined and calculated by other companies in the same manner .


      we believe free cash flow is important to management and investors in evaluating
      our financial performance and measures our ability to generate cash without
      additional external financings .


      free cash flow should be considered in addition to , rather than as a substitute
      for , cash provided by operating activities .


      the following table reconciles cash provided by operating activities ( gaap
      measure ) to free cash flow ( non-gaap measure ) : millions 2013 2012 2011 .'
