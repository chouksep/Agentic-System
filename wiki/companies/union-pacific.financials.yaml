  - pre_text: 'notes to the consolidated financial statements union pacific corporation
      and subsidiary companies for purposes of this report , unless the context otherwise
      requires , all references herein to the 201ccorporation 201d , 201ccompany 201d
      , 201cupc 201d , 201cwe 201d , 201cus 201d , and 201cour 201d mean union pacific
      corporation and its subsidiaries , including union pacific railroad company
      , which will be separately referred to herein as 201cuprr 201d or the 201crailroad
      201d .


      1 .


      nature of operations operations and segmentation 2013 we are a class i railroad
      operating in the u.s .


      our network includes 32236 route miles , linking pacific coast and gulf coast
      ports with the midwest and eastern u.s .


      gateways and providing several corridors to key mexican gateways .


      we own 26039 miles and operate on the remainder pursuant to trackage rights
      or leases .


      we serve the western two-thirds of the country and maintain coordinated schedules
      with other rail carriers for the handling of freight to and from the atlantic
      coast , the pacific coast , the southeast , the southwest , canada , and mexico
      .


      export and import traffic is moved through gulf coast and pacific coast ports
      and across the mexican and canadian borders .


      the railroad , along with its subsidiaries and rail affiliates , is our one
      reportable operating segment .


      although we provide and analyze revenue by commodity group , we treat the financial
      results of the railroad as one segment due to the integrated nature of our rail
      network .


      our operating revenues are primarily derived from contracts with customers for
      the transportation of freight from origin to destination .


      effective january 1 , 2018 , the company reclassified its six commodity groups
      into four : agricultural products , energy , industrial , and premium .


      the following table represents a disaggregation of our freight and other revenues:
      .'
