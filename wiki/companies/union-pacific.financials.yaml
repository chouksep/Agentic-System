      the use of newer , more fuel efficient locomotives ; increased use of distributed
      locomotive power ( the practice of distributing locomotives throughout a train
      rather than positioning them all in the lead resulting in safer and more efficient
      train operations ) ; fuel conservation programs ; and efficient network operations
