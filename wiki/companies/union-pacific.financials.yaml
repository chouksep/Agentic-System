    post_text: '[a] effective january 1 , 2010 , a new accounting standard required
      us to account for receivables transferred under our receivables securitization
      facility as secured borrowings in our consolidated statements of financial position
      and as financing activities in our consolidated statements of cash flows .


      the receivables securitization facility is included in our free cash flow calculation
      to adjust cash provided by operating activities as though our receivables securitization
      facility had been accounted for under the new accounting standard for all periods
      presented .


      2013 outlook f0b7 safety 2013 operating a safe railroad benefits our employees
      , our customers , our shareholders , and the communities we serve .


      we will continue using a multi-faceted approach to safety , utilizing technology
      , risk assessment , quality control , training and employee engagement , and
      targeted capital investments .


      we will continue using and expanding the deployment of total safety culture
      throughout our operations , which allows us to identify and implement best practices
      for employee and operational safety .


      derailment prevention and the reduction of grade crossing incidents are critical
      aspects of our safety programs .


      we will continue our efforts to increase rail defect detection ; improve or
      close crossings ; and educate the public and law enforcement agencies about
      crossing safety through a combination of our own programs ( including risk assessment
      strategies ) , various industry programs and local community activities across
      our network .


      f0b7 network operations 2013 we will continue focusing on our six critical initiatives
      to improve safety , service and productivity during 2013 .


      we are seeing solid contributions from reducing variability , continuous improvements
      , and standard work .


      resource agility allows us to respond quickly to changing market conditions
      and network disruptions from weather or other events .


      the railroad continues to benefit from capital investments that allow us to
      build capacity for growth and harden our infrastructure to reduce failure .


      f0b7 fuel prices 2013 uncertainty about the economy makes projections of fuel
      prices difficult .


      we again could see volatile fuel prices during the year , as they are sensitive
      to global and u.s .


      domestic demand , refining capacity , geopolitical events , weather conditions
      and other factors .


      to reduce the impact of fuel price on earnings , we will continue seeking cost
      recovery from our customers through our fuel surcharge programs and expanding
      our fuel conservation efforts .


      f0b7 capital plan 2013 in 2013 , we plan to make total capital investments of
      approximately $ 3.6 billion , including expenditures for positive train control
      ( ptc ) , which may be revised if business conditions warrant or if new laws
      or regulations affect our ability to generate sufficient returns on these investments
      .


      ( see further discussion in this item 7 under liquidity and capital resources
      2013 capital plan. ) .'
