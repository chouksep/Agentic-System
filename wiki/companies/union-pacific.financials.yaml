      nature of operations operations and segmentation 2013 we are a class i railroad
      that operates in the united states .


      we have 32094 route miles , linking pacific coast and gulf coast ports with
      the midwest and eastern united states gateways and providing several corridors
      to key mexican gateways .


      we serve the western two- thirds of the country and maintain coordinated schedules
