      basis of presentation 2013 the consolidated financial statements are presented
      in accordance with accounting principles generally accepted in the u.s .


      ( gaap ) as codified in the financial accounting standards board ( fasb ) accounting
      standards codification ( asc ) .


      2 .


      significant accounting policies principles of consolidation 2013 the consolidated
      financial statements include the accounts of union pacific corporation and all
      of its subsidiaries .


      investments in affiliated companies ( 20% ( 20 % ) to 50% ( 50 % ) owned ) are
      accounted for using the equity method of accounting .


      all intercompany transactions are eliminated .


      we currently have no less than majority-owned investments that require consolidation
      under variable interest entity requirements .


      cash , cash equivalents and restricted cash 2013 cash equivalents consist of
      investments with original maturities of three months or less .


      amounts included in restricted cash represent those required to be set aside
      by contractual agreement. .'
