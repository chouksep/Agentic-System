      repairs , mitigation and improvements .


      volume-related crew transportation and lodging costs , as well as expenses associated
      with jointly owned operating facilities , also increased costs compared to 2010
      .


      in addition , an increase in locomotive maintenance materials used to prepare
      a portion of our locomotive fleet for return to active service due to increased
      volume and additional capacity for weather related issues and warranty expirations
      increased expenses in 2011 .


      depreciation 2013 the majority of depreciation relates to road property , including
      rail , ties , ballast , and other track material .


      a higher depreciable asset base , reflecting ongoing capital spending , increased
      depreciation expense in 2012 compared to 2011 .


      a higher depreciable asset base , reflecting ongoing capital spending , increased
      depreciation expense in 2011 compared to 2010 .


      higher depreciation rates for rail and other track material also contributed
      to the increase .


      the higher rates , which became effective january 1 , 2011 , resulted primarily
      from increased track usage ( based on higher gross ton-miles in 2010 ) .


      equipment and other rents 2013 equipment and other rents expense primarily includes
      rental expense that the railroad pays for freight cars owned by other railroads
      or private companies ; freight car , intermodal , and locomotive leases ; and
      office and other rent expenses .


      increased automotive and intermodal shipments , partially offset by improved
      car-cycle times , drove an increase in our short-term freight car rental expense
      in 2012 .


      conversely , lower locomotive lease expense partially offset the higher freight
      car rental expense .


      costs increased in 2011 versus 2010 as higher short-term freight car rental
      expense and container lease expense offset lower freight car and locomotive
      lease expense .


      other 2013 other expenses include personal injury , freight and property damage
      , destruction of equipment , insurance , environmental , bad debt , state and
      local taxes , utilities , telephone and cellular , employee travel , computer
      software , and other general expenses .


      other costs in 2012 were slightly higher than 2011 primarily due to higher property
      taxes .


      despite continual improvement in our safety experience and lower estimated annual
      costs , personal injury expense increased in 2012 compared to 2011 , as the
      liability reduction resulting from historical claim experience was less than
      the reduction in 2011 .


      higher property taxes , casualty costs associated with destroyed equipment ,
      damaged freight and property and environmental costs increased other costs in
      2011 compared to 2010 .


      a one-time payment of $ 45 million in the first quarter of 2010 related to a
      transaction with csxi and continued improvement in our safety performance and
      lower estimated liability for personal injury , which reduced our personal injury
      expense year-over-year , partially offset increases in other costs .


