      ) .


      these vies were created solely for the purpose of doing lease transactions (
      principally involving railroad equipment and facilities ) and have no other
      activities , assets or liabilities outside of the lease transactions .


      within these lease arrangements , we have the right to purchase some or all
      of the assets at fixed prices .


      depending on market conditions , fixed-price purchase options available in the
      leases could potentially provide benefits to us ; however , these benefits are
      not expected to be significant .


      we maintain and operate the assets based on contractual obligations within the
      lease arrangements , which set specific guidelines consistent within the railroad
      industry .


      as such , we have no control over activities that could materially impact the
      fair value of the leased assets .


      we do not hold the power to direct the activities of the vies and , therefore
      , do not control the ongoing activities that have a significant impact on the
      economic performance of the vies .


      additionally , we do not have the obligation to absorb losses of the vies or
