    post_text: 'average train speed 2013 average train speed is calculated by dividing
      train miles by hours operated on our main lines between terminals .


      average train speed , as reported to the association of american railroads (
      aar ) , increased 4% ( 4 % ) in 2012 versus 2011 .


      efficient operations and relatively mild weather conditions during the year
      compared favorably to 2011 , during which severe winter weather , flooding ,
      and extreme heat and drought affected various parts of our network .


      we continued operating a fluid and efficient network while handling essentially
      the same volume and adjusting operations to accommodate increased capital project
      work on our network compared to 2011 .


      the extreme weather challenges in addition to increased carloadings and traffic
      mix changes , led to a 2% ( 2 % ) decrease in average train speed in 2011 compared
      to 2010 .


      average terminal dwell time 2013 average terminal dwell time is the average
      time that a rail car spends at our terminals .


      lower average terminal dwell time improves asset utilization and service .


      average terminal dwell time remained flat in 2012 compared to 2011 , despite
      a shift in traffic mix to more manifest shipments , which require more switching
      at terminals .


      average terminal dwell time increased 3% ( 3 % ) in 2011 compared to 2010 .


      additional volume , weather challenges , track replacement programs , and a
      shift of traffic mix to more manifest shipments , which require additional terminal
      processing , all contributed to the increase .


      average rail car inventory 2013 average rail car inventory is the daily average
      number of rail cars on our lines , including rail cars in storage .


      lower average rail car inventory reduces congestion in our yards and sidings
      , which increases train speed , reduces average terminal dwell time , and improves
      rail car utilization .


      despite a shift in traffic mix from coal to shale-related and automotive shipments
      with longer .'
