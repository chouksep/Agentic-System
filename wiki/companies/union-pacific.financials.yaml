  - pre_text: 'on december 19 , 2011 , we redeemed the remaining $ 175 million of
      our 6.5% ( 6.5 % ) notes due april 15 , 2012 , and all $ 300 million of our
      outstanding 6.125% ( 6.125 % ) notes due january 15 , 2012 .


      the redemptions resulted in an early extinguishment charge of $ 5 million in
      the fourth quarter of 2011 .


      receivables securitization facility 2013 as of december 31 , 2013 and 2012 ,
      we recorded $ 0 and $ 100 million , respectively , as secured debt under our
      receivables securitization facility .


      ( see further discussion of our receivables securitization facility in note
      10 ) .


      15 .


      variable interest entities we have entered into various lease transactions in
      which the structure of the leases contain variable interest entities ( vies
      ) .


      these vies were created solely for the purpose of doing lease transactions (
      principally involving railroad equipment and facilities , including our headquarters
      building ) and have no other activities , assets or liabilities outside of the
      lease transactions .


      within these lease arrangements , we have the right to purchase some or all
      of the assets at fixed prices .


      depending on market conditions , fixed-price purchase options available in the
      leases could potentially provide benefits to us ; however , these benefits are
      not expected to be significant .


      we maintain and operate the assets based on contractual obligations within the
      lease arrangements , which set specific guidelines consistent within the railroad
      industry .


      as such , we have no control over activities that could materially impact the
      fair value of the leased assets .


      we do not hold the power to direct the activities of the vies and , therefore
      , do not control the ongoing activities that have a significant impact on the
      economic performance of the vies .


      additionally , we do not have the obligation to absorb losses of the vies or
      the right to receive benefits of the vies that could potentially be significant
      to the we are not considered to be the primary beneficiary and do not consolidate
      these vies because our actions and decisions do not have the most significant
      effect on the vie 2019s performance and our fixed-price purchase price options
      are not considered to be potentially significant to the vies .


      the future minimum lease payments associated with the vie leases totaled $ 3.3
      billion as of december 31 , 2013 .


      16 .


      leases we lease certain locomotives , freight cars , and other property .


      the consolidated statements of financial position as of december 31 , 2013 and
      2012 included $ 2486 million , net of $ 1092 million of accumulated depreciation
      , and $ 2467 million , net of $ 966 million of accumulated depreciation , respectively
      , for properties held under capital leases .


      a charge to income resulting from the depreciation for assets held under capital
      leases is included within depreciation expense in our consolidated statements
      of income .


      future minimum lease payments for operating and capital leases with initial
      or remaining non-cancelable lease terms in excess of one year as of december
      31 , 2013 , were as follows : millions operating leases capital leases .'
