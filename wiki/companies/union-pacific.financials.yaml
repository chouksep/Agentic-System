      and operational safety .


      reducing grade-crossing incidents is a critical aspect of our safety programs
      , and we will continue our efforts to maintain , upgrade , and close crossings
      ; install video cameras on locomotives ; and educate the public about crossing
      safety through our own programs , various industry programs , and other activities
