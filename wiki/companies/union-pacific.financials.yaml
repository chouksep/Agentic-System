  - pre_text: 'us in a position to handle demand changes .


      we will also continue utilizing industrial engineering techniques to improve
      productivity .


      2022 fuel prices 2013 uncertainty about the economy makes fuel price projections
      difficult , and we could see volatile fuel prices during the year , as they
      are sensitive to global and u.s .


      domestic demand , refining capacity , geopolitical events , weather conditions
      and other factors .


      to reduce the impact of fuel price on earnings , we will continue to seek recovery
      from our customers through our fuel surcharge programs and to expand our fuel
      conservation efforts .


      2022 capital plan 2013 in 2011 , we plan to make total capital investments of
      approximately $ 3.2 billion , including expenditures for positive train control
      ( ptc ) , which may be revised if business conditions warrant or if new laws
      or regulations affect our ability to generate sufficient returns on these investments
      .


      ( see further discussion in this item 7 under liquidity and capital resources
      2013 capital plan. ) 2022 positive train control 2013 in response to a legislative
      mandate to implement ptc by the end of 2015 , we expect to spend approximately
      $ 250 million during 2011 on developing ptc .


      we currently estimate that ptc will cost us approximately $ 1.4 billion to implement
      by the end of 2015 , in accordance with rules issued by the federal railroad
      administration ( fra ) .


      this includes costs for installing the new system along our tracks , upgrading
      locomotives to work with the new system , and adding digital data communication
      equipment so all the parts of the system can communicate with each other .


      during 2011 , we plan to begin testing the technology to evaluate its effectiveness
      .


      2022 financial expectations 2013 we remain cautious about economic conditions
      , but anticipate volume to increase from 2010 levels .


      in addition , we expect volume , price , and productivity gains to offset expected
      higher costs for fuel , labor inflation , depreciation , casualty costs , and
      property taxes to drive operating ratio improvement .


