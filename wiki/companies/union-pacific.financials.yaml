      a gain or loss is recognized in other income when we sell land or dispose of
      assets that are not part of our railroad operations .


      when we purchase an asset , we capitalize all costs necessary to make the asset
      ready for its intended use .


      however , many of our assets are self-constructed .


      a large portion of our capital expenditures is for replacement of existing road
      infrastructure assets ( program projects ) , which is typically performed by
      our employees , and for track line expansion ( capacity projects ) .


      costs that are directly attributable or overhead costs that relate directly
      to capital projects are capitalized .


      direct costs that are capitalized as part of self-constructed assets include
      material , labor , and work equipment .


      indirect costs are capitalized if they clearly relate to the construction of
      the asset .


      these costs are allocated using appropriate statistical bases .


      general and administrative expenditures are expensed as incurred .


      normal repairs and maintenance are also expensed as incurred , while costs incurred
      that extend the useful life of an asset , improve the safety of our operations
      or improve operating efficiency are capitalized .


      assets held under capital leases are recorded at the lower of the net present
      value of the minimum lease payments or the fair value of the leased asset at
      the inception of the lease .


      amortization expense is computed using the straight-line method over the shorter
      of the estimated useful lives of the assets or the period of the related lease
      .


