    post_text: '2018 outlook f0b7 safety 2013 operating a safe railroad benefits all
      our constituents : our employees , customers , shareholders and the communities
      we serve .


      we will continue using a multi-faceted approach to safety , utilizing technology
      , risk assessment , training and employee engagement , quality control , and
      targeted capital investments .


      we will continue using and expanding the deployment of total safety culture
      and courage to care throughout our operations , which allows us to identify
      and implement best practices for employee and operational safety .


      we will continue our efforts to increase detection of rail defects ; improve
      or close crossings ; and educate the public and law enforcement agencies about
      crossing safety through a combination of our own programs ( including risk assessment
      strategies ) , industry programs and local community activities across our network
      .


      f0b7 network operations 2013 in 2018 , we will continue to align resources with
      customer demand , maintain an efficient network , and ensure surge capability
      of our assets .


      f0b7 fuel prices 2013 fuel price projections for crude oil and natural gas continue
      to fluctuate in the current environment .


      we again could see volatile fuel prices during the year , as they are sensitive
      to global and u.s .


      domestic demand , refining capacity , geopolitical events , weather conditions
      and other factors .


      as prices fluctuate , there will be a timing impact on earnings , as our fuel
      surcharge programs trail increases or decreases in fuel price by approximately
      two months .


      lower fuel prices could have a positive impact on the economy by increasing
      consumer discretionary spending that potentially could increase demand for various
      consumer products that we transport .


      alternatively , lower fuel prices could likely have a negative impact on other
      commodities such as coal and domestic drilling-related shipments. .'
