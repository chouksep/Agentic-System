      logistics subsidiaries for their customers and additional costs for repair and
      maintenance of locomotives and freight cars .


      depreciation 2013 the majority of depreciation relates to road property , including
      rail , ties , ballast , and other track material .


      depreciation was up 1% ( 1 % ) compared to 2012 .


      recent depreciation studies allowed us to use longer estimated service lives
      for certain equipment , which partially offset the impact of a higher depreciable
      asset base resulting from larger capital spending in recent years .


      a higher depreciable asset base , reflecting ongoing capital spending , increased
