      for certain equipment , which partially offset the impact of a higher depreciable
      asset base resulting from larger capital spending in recent years .


      equipment and other rents 2013 equipment and other rents expense primarily includes
      rental expense that the railroad pays for freight cars owned by other railroads
      or private companies ; freight car , intermodal , and locomotive leases ; and
      office and other rent expenses .


      higher intermodal volumes and longer cycle times increased short-term freight
      car rental expense in 2014 compared to 2013 .


      lower equipment leases essentially offset the higher freight car rental expense
      , as we exercised purchase options on some of our leased equipment .


      additional container costs resulting from the logistics management arrangement
      , and increased automotive shipments , partially offset by lower cycle times
      drove a $ 51 million increase in our short-term freight car rental expense in
      2013 versus 2012 .


      conversely , lower locomotive and freight car lease expenses partially offset
      the higher freight car rental expense .


      other 2013 other expenses include state and local taxes , freight , equipment
      and property damage , utilities , insurance , personal injury , environmental
      , employee travel , telephone and cellular , computer software , bad debt ,
      and other general expenses .


      higher property taxes , personal injury expense and utilities costs partially
