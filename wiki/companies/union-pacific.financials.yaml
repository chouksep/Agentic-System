      of 2010 provided for 100% ( 100 % ) bonus depreciation for qualified investments
      made during 2011 , and 50% ( 50 % ) bonus depreciation for qualified investments
      made during 2012 .


      as a result of the act , the company deferred a substantial portion of its 2011
      income tax expense .


      this deferral decreased 2011 income tax payments , thereby contributing to the
      positive operating cash flow .


      in future years , however , additional cash will be used to pay income taxes
      that were previously deferred .


      in addition , the adoption of a new accounting standard in january of 2010 changed
      the accounting treatment for our receivables securitization facility from a
