    post_text: 'at december 31 , 2009 , there was $ 22 million of total unrecognized
      compensation expense related to nonvested performance retention awards , which
      is expected to be recognized over a weighted-average period of 1.3 years .


      a portion of this expense is subject to achievement of the roic levels established
      for the performance stock unit grants .


      5 .


      retirement plans pension and other postretirement benefits pension plans 2013
      we provide defined benefit retirement income to eligible non-union employees
      through qualified and non-qualified ( supplemental ) pension plans .


      qualified and non-qualified pension benefits are based on years of service and
      the highest compensation during the latest years of employment , with specific
      reductions made for early retirements .


      other postretirement benefits ( opeb ) 2013 we provide defined contribution
      medical and life insurance benefits for eligible retirees .


      these benefits are funded as medical claims and life insurance premiums are
      plan amendment effective january 1 , 2010 , medicare-eligible retirees who are
      enrolled in the union pacific retiree medical program will receive a contribution
      to a health reimbursement account , which can be used to pay eligible out-of-pocket
      medical expenses .


      the impact of the plan amendment is reflected in the projected benefit obligation
      ( pbo ) at december 31 , 2009 .


      funded status we are required by gaap to separately recognize the overfunded
      or underfunded status of our pension and opeb plans as an asset or liability
      .


      the funded status represents the difference between the pbo and the fair value
      of the plan assets .


      the pbo is the present value of benefits earned to date by plan participants
      , including the effect of assumed future salary increases .


      the pbo of the opeb plan is equal to the accumulated benefit obligation , as
      the present value of the opeb liabilities is not affected by salary increases
      .


      plan assets are measured at fair value .


      we use a december 31 measurement date for plan assets and obligations for all
      our retirement plans. .'
