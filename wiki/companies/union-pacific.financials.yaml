      2022 transportation plan 2013 to build upon our success in recent years , we
      will continue evaluating traffic flows and network logistic patterns , which
      can be quite dynamic from year-to-year , to identify additional opportunities
      to simplify operations , remove network variability and improve network efficiency
      and asset utilization .


