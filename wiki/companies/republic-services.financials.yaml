      2006 incentive stock plan ( the 2006 plan ) ) .


      allied 2019s shareholders approved the 2006 plan in may 2006 .


      the 2006 plan was amended and restated in december 2008 to reflect republic
      as the new sponsor of the plan , and that any references to shares of common
      stock are to shares of common stock of republic , and to adjust outstanding
      awards and the number of shares available under the plan to reflect the allied
      acquisition .


