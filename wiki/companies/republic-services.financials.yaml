  - pre_text: 'fleet automation approximately 66% ( 66 % ) of our residential routes
      have been converted to automated single driver trucks .


      by converting our residential routes to automated service , we reduce labor
      costs , improve driver productivity and create a safer work environment for
      our employees .


      additionally , communities using automated vehicles have higher participation
      rates in recycling programs , thereby complementing our initiative to expand
      our recycling capabilities .


      fleet conversion to compressed natural gas ( cng ) approximately 12% ( 12 %
      ) of our fleet operates on natural gas .


      we expect to continue our gradual fleet conversion to cng , our preferred alternative
      fuel technology , as part of our ordinary annual fleet replacement process .


      we believe a gradual fleet conversion is most prudent to realize the full value
      of our previous fleet investments .


      approximately 50% ( 50 % ) of our replacement vehicle purchases during 2013
      were cng vehicles .


      we believe using cng vehicles provides us a competitive advantage in communities
      with strict clean emission objectives or initiatives that focus on protecting
      the environment .


      although upfront costs are higher , we expect that using natural gas will reduce
      our overall fleet operating costs through lower fuel expenses .


      standardized maintenance based on an industry trade publication , we operate
      the eighth largest vocational fleet in the united states .


      as of december 31 , 2013 , our average fleet age in years , by line of business
      , was as follows : approximate number of vehicles average age .'
