    post_text: 'for 2015 , the investment strategy for pension plan assets is to maintain
      a broadly diversified portfolio designed to achieve our target of an average
      long-term rate of return of 6.35% ( 6.35 % ) .


      while we believe we can achieve a long- term average return of 6.35% ( 6.35
