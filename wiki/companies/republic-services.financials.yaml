    post_text: 'new accounting guidance for business combinations became effective
      for our 2009 financial statements .


      this new guidance changed the treatment of acquired uncertain tax liabilities
      .


      under previous guidance , changes in acquired uncertain tax liabilities were
      recognized through goodwill .


      under the new guidance , subsequent changes in acquired unrecognized tax liabilities
      are recognized through the income tax provision .


      as of december 31 , 2010 , $ 206.5 million of the $ 222.8 million of unrecognized
      tax benefits related to tax positions taken by allied prior to the 2008 acquisition
      .


      included in the balance at december 31 , 2010 and 2009 are approximately $ 209.1
      million and $ 217.6 million of unrecognized tax benefits ( net of the federal
      benefit on state issues ) that , if recognized , would affect the effective
      income tax rate in future periods .


      during 2010 , the irs concluded its examination of our 2005 and 2007 tax years
      .


      the conclusion of this examination reduced our gross unrecognized tax benefits
      by approximately $ 1.9 million .


      we also resolved various state matters during 2010 that , in the aggregate ,
      reduced our gross unrecognized tax benefits by approximately $ 10.0 million
      .


      during 2009 , we settled our outstanding tax dispute related to allied 2019s
      risk management companies ( see 2013 risk management companies ) with both the
      department of justice ( doj ) and the internal revenue service ( irs ) .


      this settlement reduced our gross unrecognized tax benefits by approximately
      $ 299.6 million .


      during 2009 , we also settled with the irs , through an accounting method change
      , our outstanding tax dispute related to intercompany insurance premiums paid
      to allied 2019s captive insurance company .


      this settlement reduced our gross unrecognized tax benefits by approximately
      $ 62.6 million .


      in addition to these federal matters , we also resolved various state matters
      that , in the aggregate , reduced our gross unrecognized tax benefits during
      2009 by approximately $ 5.8 million .


