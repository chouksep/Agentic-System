      activities , issues financial surety bonds to secure capping , closure and post-closure
      obligations for companies operating in the solid waste industry .


      we account for this investment under the cost method of accounting .


      there have been no identified events or changes in circumstances that may have
      a significant adverse effect on the recoverability of the investment .


      this investee company and the parent company of the investee had written surety
      bonds for us relating primarily to our landfill operations for capping , closure
      and post-closure , of which $ 1152.1 million was outstanding as of december
      31 , 2012 .


