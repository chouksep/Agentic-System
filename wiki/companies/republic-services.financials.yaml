      of $ 92.3 million .


      during 2008 , we accrued penalties of $ 0.2 million and interest of $ 5.2 million
      and , in total at december 31 , 2008 , had recognized a liability for penalties
      of $ 88.1 million and interest of $ 180.0 million .


