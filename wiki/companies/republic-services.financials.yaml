      financial statements based on our best estimate of required future payments
      .


      certain of these indemnifications relate to contingent events or occurrences
      , such as the imposition of additional taxes due to a change in the tax law
      or adverse interpretation of the tax law , and indemnifications made in divestiture
      agreements where we indemnify the buyer for liabilities that relate to our activities
      prior to the divestiture and that may become known in the future .


