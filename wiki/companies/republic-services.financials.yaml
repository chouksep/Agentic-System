      gaap .


      the amount of the financial assurance requirements related to contract performance
      varies by contract .


      additionally , we must provide financial assurance for our insurance program
      and collateral for certain performance obligations .


      we do not expect a material increase in financial assurance requirements during
      2018 , although the mix of financial assurance instruments may change .


      these financial assurance instruments are issued in the normal course of business
      and are not considered indebtedness .


      because we currently have no liability for the financial assurance instruments
      , they are not reflected in our consolidated balance sheets ; however , we record
      capping , closure and post-closure liabilities and insurance liabilities as
      they are incurred .


      off-balance sheet arrangements we have no off-balance sheet debt or similar
      obligations , other than operating leases and financial assurances , which are
      not classified as debt .


      we have no transactions or obligations with related parties that are not disclosed
      , consolidated into or reflected in our reported financial position or results
      of operations .


      we have not guaranteed any third-party debt .


      free cash flow we define free cash flow , which is not a measure determined
      in accordance with u.s .


      gaap , as cash provided by operating activities less purchases of property and
      equipment , plus proceeds from sales of property and equipment , as presented
      in our consolidated statements of cash flows .


