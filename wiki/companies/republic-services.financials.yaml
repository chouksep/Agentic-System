    post_text: 'changes in price are restricted on approximately 50% ( 50 % ) of our
      annual service revenue .


      the majority of these restricted pricing arrangements are tied to fluctuations
      in a specific index ( primarily a consumer price index ) as defined in the contract
      .


      the consumer price index varies from a single historical stated period of time
      or an average of trailing historical rates over a stated period of time .


      in addition , the initial effect of pricing resets typically lags 6 to 12 months
      from the end of the index measurement period to the date the revised pricing
      goes into effect .


      as a result , current changes in a specific index may not manifest themselves
      in our reported pricing for several quarters into the future. .'
