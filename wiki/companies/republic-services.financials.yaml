      the excess of cost over par value as a deduction from additional paid-in capital
      .


      the change in unissued shares resulted in a reduction of $ 2295.3 million in
      treasury stock , $ 0.6 million in common stock , and $ 2294.7 million in additional
      paid-in capital .


      there was no effect on our total stockholders 2019 equity position as a result
