    post_text: 'through standardization of core functions , we believe we can minimize
      variability in our maintenance processes resulting in higher vehicle quality
      while extending the service life of our fleet .


      we believe operating a more reliable , safer and efficient fleet will lower
      our operating costs .


      we have completed implementation of standardized maintenance programs for approximately
      45% ( 45 % ) of our fleet maintenance operations as of december 31 , 2013 .


      cash utilization strategy key components of our cash utilization strategy include
      increasing free cash flow and improving our return on invested capital .


      our definition of free cash flow , which is not a measure determined in accordance
      with united states generally accepted accounting principles ( u.s .


      gaap ) , is cash provided by operating activities less purchases of property
      and equipment , plus proceeds from sales of property and equipment as presented
      in our consolidated statements of cash flows .


      for a discussion and reconciliation of free cash flow , you should read the
      201cfree cash flow 201d section of our management 2019s discussion and analysis
      of financial condition and results of operations contained in item 7 of this
      form 10-k .


      we believe free cash flow drives shareholder value and provides useful information
      regarding the recurring cash provided by our operations .


      free cash flow also demonstrates our ability to execute our cash utilization
      strategy , which includes investments in acquisitions and returning a majority
      of free cash flow to our shareholders through dividends and share repurchases
      .


      we are committed to an efficient capital structure and maintaining our investment
      grade rating .


      we manage our free cash flow by ensuring that capital expenditures and operating
      asset levels are appropriate in light of our existing business and growth opportunities
      , as well as by closely managing our working capital , which consists primarily
      of accounts receivable , accounts payable , and accrued landfill and environmental
      costs. .'
