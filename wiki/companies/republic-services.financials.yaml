  - pre_text: 'the intangible assets identified that were determined to have value
      as a result of our analysis of allied 2019s projected revenue streams and their
      related profits include customer relationships , franchise agreements , other
      municipal agreements , non-compete agreements and trade names .


      the fair values for these intangible assets are reflected in the previous table
      .


      other intangible assets were identified that are considered to be components
      of either property and equipment or goodwill under u.s .


      gaap , including the value of the permitted and probable airspace at allied
      2019s landfills ( property and equipment ) , the going concern element of allied
      2019s business ( goodwill ) and its assembled workforce ( goodwill ) .


      the going concern element represents the ability of an established business
      to earn a higher rate of return on an assembled collection of net assets than
      would be expected if those assets had to be acquired separately .


      a substantial portion of this going concern element acquired is represented
      by allied 2019s infrastructure of market-based collection routes and its related
      integrated waste transfer and disposal channels , whose value has been included
      in goodwill .


      all of the goodwill and other intangible assets resulting from the acquisition
      of allied will not be deductible for income tax purposes .


