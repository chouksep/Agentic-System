      certain tax liabilities regarding bfi risk management companies .


      we and our subsidiaries are subject to income tax in the u.s .


      and puerto rico , as well as income tax in multiple state jurisdictions .


      our compliance with income tax rules and regulations is periodically audited
      by tax authorities .


      these authorities may challenge the positions taken in our tax filings .


      thus , to provide for certain potential tax exposures , we maintain liabilities
      for uncertain tax positions for our estimate of the final outcome of the examinations.
