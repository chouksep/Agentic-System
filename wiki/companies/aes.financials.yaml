      the company establishes its estimated long-term return on plan assets considering
      various factors , which include the targeted asset allocation percentages ,
      historic returns and expected future returns .


      the measurement of pension obligations , costs and liabilities is dependent
      on a variety of assumptions .


      these assumptions include estimates of the present value of projected future
      pension payments to all plan participants , taking into consideration the likelihood
      of potential future events such as salary increases and demographic experience
      .


      these assumptions may have an effect on the amount and timing of future contributions
      .


      the assumptions used in developing the required estimates include the following
      key factors : 2022 discount rates ; 2022 salary growth ; 2022 retirement rates
      ; 2022 inflation ; 2022 expected return on plan assets ; and 2022 mortality
      rates .


      the effects of actual results differing from the company 2019s assumptions are
      accumulated and amortized over future periods and , therefore , generally affect
      the company 2019s recognized expense in such future periods .


      sensitivity of the company 2019s pension funded status to the indicated increase
