  - pre_text: 'the net decrease in the 2016 effective tax rate was due , in part ,
      to the 2016 asset impairments in the u.s .


      and to the current year benefit related to a restructuring of one of our brazilian
      businesses that increases tax basis in long-term assets .


      further , the 2015 rate was impacted by the items described below .


      see note 20 2014asset impairment expense for additional information regarding
      the 2016 u.s .


      asset impairments .


      income tax expense increased $ 101 million , or 27% ( 27 % ) , to $ 472 million
      in 2015 .


      the company''s effective tax rates were 41% ( 41 % ) and 26% ( 26 % ) for the
      years ended december 31 , 2015 and 2014 , respectively .


      the net increase in the 2015 effective tax rate was due , in part , to the nondeductible
      2015 impairment of goodwill at our u.s .


      utility , dp&l and chilean withholding taxes offset by the release of valuation
      allowance at certain of our businesses in brazil , vietnam and the u.s .


      further , the 2014 rate was impacted by the sale of approximately 45% ( 45 %
      ) of the company 2019s interest in masin aes pte ltd. , which owns the company
      2019s business interests in the philippines and the 2014 sale of the company
      2019s interests in four u.k .


      wind operating projects .


      neither of these transactions gave rise to income tax expense .


      see note 15 2014equity for additional information regarding the sale of approximately
      45% ( 45 % ) of the company 2019s interest in masin-aes pte ltd .


      see note 23 2014dispositions for additional information regarding the sale of
      the company 2019s interests in four u.k .


      wind operating projects .


      our effective tax rate reflects the tax effect of significant operations outside
      the u.s. , which are generally taxed at rates lower than the u.s .


      statutory rate of 35% ( 35 % ) .


      a future proportionate change in the composition of income before income taxes
      from foreign and domestic tax jurisdictions could impact our periodic effective
      tax rate .


      the company also benefits from reduced tax rates in certain countries as a result
      of satisfying specific commitments regarding employment and capital investment
      .


      see note 21 2014income taxes for additional information regarding these reduced
      rates .


