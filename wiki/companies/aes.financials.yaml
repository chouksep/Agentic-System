    post_text: 'as of december 31 , 2010 , aes subsidiaries with facilities under
      construction had a total of approximately $ 432 million of committed but unused
      credit facilities available to fund construction and other related costs .


      excluding these facilities under construction , aes subsidiaries had approximately
      $ 893 million in a number of available but unused committed revolving credit
      lines to support their working capital , debt service reserves and other business
      needs .


      these credit lines can be used in one or more of the following ways : solely
      for borrowings ; solely for letters of credit ; or a combination of these uses
      .


      the weighted average interest rate on borrowings from these facilities was 3.24%
      ( 3.24 % ) at december 31 , 2010 .


      non-recourse debt covenants , restrictions and defaults the terms of the company
      2019s non-recourse debt include certain financial and non-financial covenants
      .


      these covenants are limited to subsidiary activity and vary among the subsidiaries
      .


      these covenants may include but are not limited to maintenance of certain reserves
      , minimum levels of working capital and limitations on incurring additional
      indebtedness .


      compliance with certain covenants may not be objectively determinable .


      as of december 31 , 2010 and 2009 , approximately $ 803 million and $ 653 million
      , respectively , of restricted cash was maintained in accordance with certain
      covenants of the non-recourse debt agreements , and these amounts were included
      within 201crestricted cash 201d and 201cdebt service reserves and other deposits
      201d in the accompanying consolidated balance sheets .


      various lender and governmental provisions restrict the ability of certain of
      the company 2019s subsidiaries to transfer their net assets to the parent company
      .


      such restricted net assets of subsidiaries amounted to approximately $ 5.4 billion
      at december 31 , 2010. .'
