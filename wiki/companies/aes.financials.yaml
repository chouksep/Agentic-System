      credit facilities available to fund construction and other related costs .


      excluding these facilities under construction , aes subsidiaries had approximately
      $ 1.2 billion in a number of available but unused committed revolving credit
      lines to support their working capital , debt service reserves and other business
      needs .


      these credit lines can be used in one or more of the following ways : solely
      for borrowings ; solely for letters of credit ; or a combination of these uses
      .


      the weighted average interest rate on borrowings from these facilities was 14.75%
      ( 14.75 % ) at december 31 , 2011 .


      on october 3 , 2011 , dolphin subsidiary ii , inc .


      ( 201cdolphin ii 201d ) , a newly formed , wholly-owned special purpose indirect
      subsidiary of aes , entered into an indenture ( the 201cindenture 201d ) with
      wells fargo bank , n.a .


      ( the 201ctrustee 201d ) as part of its issuance of $ 450 million aggregate
      principal amount of 6.50% ( 6.50 % ) senior notes due 2016 ( the 201c2016 notes
      201d ) and $ 800 million aggregate principal amount of 7.25% ( 7.25 % ) senior
      notes due 2021 ( the 201c7.25% ( 201c7.25 % ) 2021 notes 201d , together with
      the 2016 notes , the 201cnotes 201d ) to finance the acquisition ( the 201cacquisition
      201d ) of dpl .


      upon closing of the acquisition on november 28 , 2011 , dolphin ii was merged
      into dpl with dpl being the surviving entity and obligor .


      the 2016 notes and the 7.25% ( 7.25 % ) 2021 notes are included under 201cnotes
      and bonds 201d in the non-recourse detail table above .


      see note 23 2014acquisitions and dispositions for further information .


      interest on the 2016 notes and the 7.25% ( 7.25 % ) 2021 notes accrues at a
      rate of 6.50% ( 6.50 % ) and 7.25% ( 7.25 % ) per year , respectively , and
      is payable on april 15 and october 15 of each year , beginning april 15 , 2012
      .


      prior to september 15 , 2016 with respect to the 2016 notes and july 15 , 2021
