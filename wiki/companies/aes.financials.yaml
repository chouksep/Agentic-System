      ) includes gains of $ 17 million , $ 247 million and $ 172 million on foreign
      currency derivative contracts for the years ended december 31 , 2016 , 2015
      and 2014 , respectively .


      the company recognized a net foreign currency transaction loss of $ 15 million
      for the year ended december 31 , 2016 primarily due to losses of $ 50 million
      at the aes corporation mainly due to remeasurement losses on intercompany notes
