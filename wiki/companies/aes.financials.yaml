    post_text: 'wind turbines & deposits 2014during the third quarter of 2011 , the
      company evaluated the future use of certain wind turbines held in storage pending
      their installation .


      due to reduced wind turbine market pricing and advances in turbine technology
      , the company determined it was more likely than not that the turbines would
      be sold significantly before the end of their previously estimated useful lives
      .


      in addition , the company has concluded that more likely than not non-refundable
      deposits it had made in prior years to a turbine manufacturer for the purchase
      of wind turbines are not recoverable .


      the company determined it was more likely than not that it would not proceed
      with the purchase of turbines due to the availability of more advanced and lower
      cost turbines in the market .


      these developments were more likely than not as of september 30 , 2011 and as
      a result were considered impairment indicators and the company determined that
      an impairment had occurred as of september 30 , 2011 as the aggregate carrying
      amount of $ 161 million of these assets was not recoverable and was reduced
      to their estimated fair value of $ 45 million determined under the market approach
      .


      this resulted in asset impairment expense of $ 116 million .


      wind generation is reported in the corporate and other segment .


      in january 2012 , the company forfeited the deposits for which a full impairment
      charge was recognized in the third quarter of 2011 , and there is no obligation
      for further payments under the related turbine supply agreement .


      additionally , the company sold some of the turbines held in storage during
      the fourth quarter of 2011 and is continuing to evaluate the future use of the
      turbines held in storage .


      the company determined it is more likely than not that they will be sold , however
      they are not being actively marketed for sale at this time as the company is
      reconsidering the potential use of the turbines in light of recent development
      activity at one of its advance stage development projects .


      it is reasonably possible that the turbines could incur further loss in value
      due to changing market conditions and advances in technology .


