  - pre_text: 'we define past-due loans as loans on which contractual principal or
      interest payments are over 90 days delinquent , but for which interest continues
      to be accrued .


      no institutional loans were 90 days or more contractually past due as of december
      31 , 2011 , 2010 , 2009 , 2008 or 2007 .


      although a portion of the cre loans was 90 days or more contractually past due
      as of december 31 , 2011 , 2010 , 2009 and 2008 , we do not report them as past-due
      loans , because in accordance with gaap , the interest earned on these loans
      is based on an accretable yield resulting from management 2019s expectations
      with respect to the future cash flows for each loan relative to both the timing
      and collection of principal and interest as of the reporting date , not the
      loans 2019 contractual payment terms .


      these cash flow estimates are updated quarterly to reflect changes in management
      2019s expectations , which consider market conditions .


      we generally place loans on non-accrual status once principal or interest payments
      are 60 days past due , or earlier if management determines that full collection
      is not probable .


      loans 60 days past due , but considered both well-secured and in the process
      of collection , may be excluded from non-accrual status .


      for loans placed on non-accrual status , revenue recognition is suspended .


      as of december 31 , 2011 and 2010 , approximately $ 5 million and $ 158 million
      , respectively , of the aforementioned cre loans had been placed by management
      on non-accrual status , as the yield associated with these loans , determined
      when the loans were acquired , was deemed to be non-accretable .


      this determination was based on management 2019s expectations of the future
      collection of principal and interest from the loans .


      the decline in loans on non-accrual status at december 31 , 2011 compared to
      december 31 , 2010 resulted mainly from the transfer of certain cre loans to
      other real estate owned in 2011 in connection with foreclosure or similar transactions
      .


      these transactions had no impact on our 2011 consolidated statement of income
      .


