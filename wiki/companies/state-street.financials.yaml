    post_text: '( 1 ) amount for 2009 excludes agreements related to the commercial
      paper conduits , which were consolidated in may 2009 ; see note 11 .


      approximately 81% ( 81 % ) of the unfunded commitments to extend credit expire
      within one year from the date of issue .


      since many of these commitments are expected to expire or renew without being
      drawn upon , the total commitment amount does not necessarily represent future
      cash requirements .


      securities finance : on behalf of our customers , we lend their securities to
      creditworthy brokers and other institutions .


      we generally indemnify our customers for the fair market value of those securities
      against a failure of the borrower to return such securities .


      collateral funds received in connection with our securities finance services
      are held by us as agent and are not recorded in our consolidated statement of
      condition .


      we require the borrowers to provide collateral in an amount equal to or in excess
      of 100% ( 100 % ) of the fair market value of the securities borrowed .


      the borrowed securities are revalued daily to determine if additional collateral
      is necessary .


      in this regard , we held , as agent , cash and u.s .


      government securities with an aggregate fair value of $ 375.92 billion and $
      333.07 billion as collateral for indemnified securities on loan at december
      31 , 2009 and 2008 , respectively , presented in the table above .


      the collateral held by us is invested on behalf of our customers in accordance
      with their guidelines .


      in certain cases , the collateral is invested in third-party repurchase agreements
      , for which we indemnify the customer against loss of the principal invested
      .


      we require the repurchase agreement counterparty to provide collateral in an
      amount equal to or in excess of 100% ( 100 % ) of the amount of the repurchase
      agreement .


      the indemnified repurchase agreements and the related collateral are not recorded
      in our consolidated statement of condition .


      of the collateral of $ 375.92 billion at december 31 , 2009 and $ 333.07 billion
      at december 31 , 2008 referenced above , $ 77.73 billion at december 31 , 2009
      and $ 68.37 billion at december 31 , 2008 was invested in indemnified repurchase
      agreements .


      we held , as agent , cash and securities with an aggregate fair value of $ 82.62
      billion and $ 71.87 billion as collateral for indemnified investments in repurchase
      agreements at december 31 , 2009 and december 31 , 2008 , respectively .


      legal proceedings : in the ordinary course of business , we and our subsidiaries
      are involved in disputes , litigation and regulatory inquiries and investigations
      , both pending and threatened .


      these matters , if resolved adversely against us , may result in monetary damages
      , fines and penalties or require changes in our business practices .


      the resolution of these proceedings is inherently difficult to predict .


      however , we do not believe that the amount of any judgment , settlement or
      other action arising from any pending proceeding will have a material adverse
      effect on our consolidated financial condition , although the outcome of certain
      of the matters described below may have a material adverse effect on our consolidated
      results of operations for the period in which such matter is resolved .'
    id: stt-2009-table-0
  - pre_text: 'in connection with our assessment of impairment we recorded gross other-than-temporary
      impairment of $ 1.15 billion for 2009 , compared to $ 122 million for 2008 .


      of the total recorded , $ 227 million related to credit and was recognized in
      our consolidated statement of income .


      the remaining $ 928 million related to factors other than credit , more fully
      discussed below , and was recognized , net of related taxes , in oci in our
      consolidated statement of condition .


      the $ 227 million was composed of $ 151 million associated with expected credit
      losses , $ 54 million related to management 2019s decision to sell the impaired
      securities prior to their recovery in value , and $ 22 million related to adverse
      changes in the timing of expected future cash flows from the securities .


      the majority of the impairment losses related to non-agency securities collateralized
      by mortgages , for which management concluded had experienced credit losses
      based on the present value of the securities 2019 expected future cash flows
      .


      these securities are classified as asset-backed securities in the foregoing
      investment securities tables .


      as described in note 1 , management periodically reviews the fair values of
      investment securities to determine if other-than-temporary impairment has occurred
      .


      this review encompasses all investment securities and includes such quantitative
      factors as current and expected future interest rates and the length of time
      that a security 2019s cost basis has exceeded its fair value , and includes
      investment securities for which we have issuer- specific concerns regardless
      of quantitative factors .


      gains and losses related to investment securities were as follows for the years
      ended december 31: .'
