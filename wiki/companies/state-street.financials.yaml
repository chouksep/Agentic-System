    post_text: 'although average short-duration advances for the year ended december
      31 , 2013 increased compared to the year ended december 31 , 2012 , such average
      advances remained low relative to historical levels , mainly the result of clients
      continuing to hold higher levels of liquidity .


      average other interest-earning assets increased to $ 11.16 billion for the year
      ended december 31 , 2013 from $ 7.38 billion for the year ended december 31
      , 2012 .


      the increased levels were primarily the result of higher levels of cash collateral
      provided in connection with our participation in principal securities finance
      transactions .


      aggregate average interest-bearing deposits increased to $ 109.25 billion for
      the year ended december 31 , 2013 from $ 98.39 billion for the year ended december
      31 , 2012 .


      this increase was mainly due to higher levels of non-u.s .


      transaction accounts associated with the growth of new and existing business
      in assets under custody and administration .


      future transaction account levels will be influenced by the underlying asset
      servicing business , as well as market conditions , including the general levels
      of u.s .


      and non-u.s .


      interest rates .


      average other short-term borrowings declined to $ 3.79 billion for the year
      ended december 31 , 2013 from $ 4.68 billion for the year ended december 31
      , 2012 , as higher levels of client deposits provided additional liquidity .


      average long-term debt increased to $ 8.42 billion for the year ended december
      31 , 2013 from $ 7.01 billion for the year ended december 31 , 2012 .


      the increase primarily reflected the issuance of $ 1.0 billion of extendible
      notes by state street bank in december 2012 , the issuance of $ 1.5 billion
      of senior and subordinated debt in may 2013 , and the issuance of $ 1.0 billion
      of senior debt in november 2013 .


      this increase was partly offset by maturities of $ 1.75 billion of senior debt
      in the second quarter of 2012 .


      average other interest-bearing liabilities increased to $ 6.46 billion for the
      year ended december 31 , 2013 from $ 5.90 billion for the year ended december
      31 , 2012 , primarily the result of higher levels of cash collateral received
      from clients in connection with our participation in principal securities finance
      transactions .


      several factors could affect future levels of our net interest revenue and margin
      , including the mix of client liabilities ; actions of various central banks
      ; changes in u.s .


      and non-u.s .


      interest rates ; changes in the various yield curves around the world ; revised
      or proposed regulatory capital or liquidity standards , or interpretations of
      those standards ; the amount of discount accretion generated by the former conduit
      securities that remain in our investment securities portfolio ; and the yields
      earned on securities purchased compared to the yields earned on securities sold
      or matured .


      based on market conditions and other factors , we continue to reinvest the majority
      of the proceeds from pay- downs and maturities of investment securities in highly-rated
      securities , such as u.s .


      treasury and agency securities , federal agency mortgage-backed securities and
      u.s .


      and non-u.s .


      mortgage- and asset-backed securities .


      the pace at which we continue to reinvest and the types of investment securities
