      subordinated debt in may 2013 , $ 1.0 billion of senior debt issued in november
      2013 , and $ 1.0 billion of senior debt issued in december 2014 .


      this is partially offset by the maturities of $ 500 million of senior debt in
      may 2014 and $ 250 million of senior debt in march 2014 .


      average other interest-bearing liabilities increased to $ 7.35 billion for the
      year ended december 31 , 2014 from $ 6.46 billion for the year ended december
      31 , 2013 , primarily the result of higher levels of cash collateral received
      from clients in connection with our enhanced custody business .


      several factors could affect future levels of our net interest revenue and margin
      , including the mix of client liabilities ; actions of various central banks
      ; changes in u.s .


      and non-u.s .


      interest rates ; changes in the various yield curves around the world ; revised
      or proposed regulatory capital or liquidity standards , or interpretations of
      those standards ; the amount of discount accretion generated by the former conduit
      securities that remain in our investment securities portfolio ; and the yields
      earned on securities purchased compared to the yields earned on securities sold
