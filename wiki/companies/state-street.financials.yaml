  tables:
  - pre_text: 'we maintain an effective universal shelf registration that allows for
      the public offering and sale of debt securities , capital securities , common
      stock , depositary shares and preferred stock , and warrants to purchase such
      securities , including any shares into which the preferred stock and depositary
      shares may be convertible , or any combination thereof .


      we have , as discussed previously , issued in the past , and we may issue in
      the future , securities pursuant to the shelf registration .


      the issuance of debt or equity securities will depend on future market conditions
      , funding needs and other factors .


      additional information about debt and equity securities issued pursuant to this
      shelf registration is provided in notes 9 and 12 to the consolidated financial
      statements included under item 8 .


      we currently maintain a corporate commercial paper program , under which we
      can issue up to $ 3 billion with original maturities of up to 270 days from
      the date of issue .


      at december 31 , 2011 , we had $ 2.38 billion of commercial paper outstanding
      , compared to $ 2.80 billion at december 31 , 2010 .


      additional information about our corporate commercial paper program is provided
      in note 8 to the consolidated financial statements included under item 8 .


      state street bank had initial board authority to issue bank notes up to an aggregate
      of $ 5 billion , including up to $ 1 billion of subordinated bank notes .


      approximately $ 2.05 billion was available under this board authority as of
      december 31 , 2011 .


      in 2011 , $ 2.45 billion of senior notes , which were outstanding at december
      31 , 2010 , matured .


      state street bank currently maintains a line of credit with a financial institution
      of cad $ 800 million , or approximately $ 787 million as of december 31 , 2011
      , to support its canadian securities processing operations .


      the line of credit has no stated termination date and is cancelable by either
      party with prior notice .


      as of december 31 , 2011 , no balance was outstanding on this line of credit
      .


      contractual cash obligations .'
