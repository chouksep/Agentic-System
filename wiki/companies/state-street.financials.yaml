      commitments and contingencies credit-related commitments and contingencies :
      credit-related financial instruments , which are off-balance sheet , include
      indemnified securities financing , unfunded commitments to extend credit or
      purchase assets , and standby letters of credit .


      the potential loss associated with indemnified securities financing , unfunded
      commitments and standby letters of credit is equal to the total gross contractual
      amount , which does not consider the value of any collateral .


      the following table summarizes the total gross contractual amounts of credit-related
      off-balance sheet financial instruments at december 31 .


      amounts reported do not reflect participations to independent third parties.
      .'
