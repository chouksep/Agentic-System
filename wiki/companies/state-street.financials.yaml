      the obligations presented in the table above are recorded in our consolidated
      statement of condition at december 31 , 2009 , except for interest on long-term
      debt .


      the table does not include obligations which will be settled in cash , primarily
      in less than one year , such as deposits , federal funds purchased , securities
      sold under repurchase agreements and other short-term borrowings .


      additional information about deposits , federal funds purchased , securities
      sold under repurchase agreements and other short-term borrowings is provided
      in notes 7 and 8 of the notes to consolidated financial statements included
