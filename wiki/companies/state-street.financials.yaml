  - pre_text: 'management 2019s discussion and analysis of financial condition and
      results of operations ( continued ) the npr is generally consistent with the
      basel committee 2019s lcr .


      however , it includes certain more stringent requirements , including an accelerated
      implementation time line and modifications to the definition of high-quality
      liquid assets and expected outflow assumptions .


      we continue to analyze the proposed rules and analyze their impact as well as
      develop strategies for compliance .


      the principles of the lcr are consistent with our liquidity management framework
      ; however , the specific calibrations of various elements within the final lcr
      rule , such as the eligibility of assets as hqla , operational deposit requirements
      and net outflow requirements could have a material effect on our liquidity ,
      funding and business activities , including the management and composition of
      our investment securities portfolio and our ability to extend committed contingent
      credit facilities to our clients .


      in january 2014 , the basel committee released a revised proposal with respect
      to the net stable funding ratio , or nsfr , which will establish a one-year
      liquidity standard representing the proportion of long-term assets funded by
      long-term stable funding , scheduled for global implementation in 2018 .


      the revised nsfr has made some favorable changes regarding the treatment of
      operationally linked deposits and a reduction in the funding required for certain
      securities .


      however , we continue to review the specifics of the basel committee''s release
      and will be evaluating the u.s .


      implementation of this standard to analyze the impact and develop strategies
      for compliance .


      u.s .


      banking regulators have not yet issued a proposal to implement the nsfr .


