  - pre_text: 'management 2019s discussion and analysis of financial condition and
      results of operations ( continued ) funding deposits : we provide products and
      services including custody , accounting , administration , daily pricing , foreign
      exchange services , cash management , financial asset management , securities
      finance and investment advisory services .


      as a provider of these products and services , we generate client deposits ,
      which have generally provided a stable , low-cost source of funds .


      as a global custodian , clients place deposits with state street entities in
      various currencies .


      we invest these client deposits in a combination of investment securities and
      short- duration financial instruments whose mix is determined by the characteristics
      of the deposits .


      for the past several years , we have experienced higher client deposit inflows
      toward the end of the quarter or the end of the year .


      as a result , we believe average client deposit balances are more reflective
      of ongoing funding than period-end balances .


      table 33 : client deposits average balance december 31 , year ended december
      31 .'
