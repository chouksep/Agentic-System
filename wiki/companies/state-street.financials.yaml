    post_text: 'indemnified securities financing on behalf of our clients , we lend
      their securities , as agent , to brokers and other institutions .


      in most circumstances , we indemnify our clients for the fair market value of
      those securities against a failure of the borrower to return such securities
      .


      we require the borrowers to maintain collateral in an amount equal to or in
      excess of 100% ( 100 % ) of the fair market value of the securities borrowed
      .


      securities on loan and the collateral are revalued daily to determine if additional
      collateral is necessary or if excess collateral is required to be returned to
      the borrower .


      collateral received in connection with our securities lending services is held
      by us as agent and is not recorded in our consolidated statement of condition
      .


      the cash collateral held by us as agent is invested on behalf of our clients
      .


      in certain cases , the cash collateral is invested in third-party repurchase
      agreements , for which we indemnify the client against loss of the principal
      invested .


      we require the counterparty to the indemnified repurchase agreement to provide
      collateral in an amount equal to or in excess of 100% ( 100 % ) of the amount
      of the repurchase agreement .


      in our role as agent , the indemnified repurchase agreements and the related
      collateral held by us are not recorded in our consolidated statement of condition.
      .'
