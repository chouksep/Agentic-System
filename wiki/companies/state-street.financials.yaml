    post_text: '( 1 ) these losses were recognized as a component of oci ; see note
      12 .


      we conduct periodic reviews to evaluate each security that is impaired .


      impairment exists when the current fair value of an individual security is below
      its amortized cost basis .


      for debt securities available for sale and held to maturity , other-than-temporary
      impairment is recorded in our consolidated statement of income when management
      intends to sell ( or may be required to sell ) securities before they recover
      in value , or when management expects the present value of cash flows expected
      to be collected to be less than the amortized cost of the impaired security
      ( a credit loss ) .


      our review of impaired securities generally includes : 2022 the identification
      and evaluation of securities that have indications of possible other-than-temporary
      impairment , such as issuer-specific concerns including deteriorating financial
      condition or bankruptcy ; 2022 the analysis of expected future cash flows of
      securities , based on quantitative and qualitative factors ; 2022 the analysis
      of the collectability of those future cash flows , including information about
      past events , current conditions and reasonable and supportable forecasts ;
      2022 the analysis of individual impaired securities , including consideration
      of the length of time the security has been in an unrealized loss position and
      the anticipated recovery period ; 2022 the discussion of evidential matter ,
      including an evaluation of factors or triggers that could cause individual securities
      to be deemed other-than-temporarily impaired and those that would not support
      other-than-temporary impairment ; and 2022 documentation of the results of these
      analyses .


      factors considered in determining whether impairment is other than temporary
      include : 2022 the length of time the security has been impaired; .'
    id: stt-2009-table-1
  - pre_text: 'we currently maintain a corporate commercial paper program , unrelated
      to the conduits 2019 asset-backed commercial paper program , under which we
      can issue up to $ 3 billion with original maturities of up to 270 days from
      the date of issue .


      at december 31 , 2009 , we had $ 2.78 billion of commercial paper outstanding
      , compared to $ 2.59 billion at december 31 , 2008 .


      additional information about our corporate commercial paper program is provided
      in note 8 of the notes to consolidated financial statements included under item
      8 .


      in connection with our participation in the fdic 2019s temporary liquidity guarantee
      program , or tlgp , in which we elected to participate in december 2008 , the
      parent company was eligible to issue up to approximately $ 1.67 billion of unsecured
      senior debt during 2009 , backed by the full faith and credit of the united
      states .


      as of december 31 , 2009 , the parent company 2019s outstanding unsecured senior
      debt issued under the tlgp was $ 1.5 billion .


      additional information with respect to this outstanding debt is provided in
      note 9 of the notes to consolidated financial statements included under item
      8 .


      the guarantee of this outstanding debt under the tlgp expires on april 30 ,
      2012 , the maturity date of the debt .


      state street bank currently has board authority to issue bank notes up to an
      aggregate of $ 5 billion , and up to $ 1 billion of subordinated bank notes
      .


      in connection with state street bank 2019s participation in the tlgp , in which
      state street bank elected to participate in december 2008 , state street bank
      was eligible to issue up to approximately $ 2.48 billion of unsecured senior
      notes during 2009 , backed by the full faith and credit of the united states
      .


      as of december 31 , 2009 , state street bank 2019s outstanding unsecured senior
      notes issued under the tlgp , and pursuant to the aforementioned board authority
      , totaled $ 2.45 billion .


      additional information with respect to these outstanding bank notes is provided
      in note 9 of the notes to consolidated financial statements included under item
      8 .


      the guarantee of state street bank 2019s outstanding debt under the tlgp expires
      on the maturity date of each respective debt issuance , as follows 2014$ 1 billion
      on march 15 , 2011 , and $ 1.45 billion on september 15 , 2011 .


      state street bank currently maintains a line of credit with a financial institution
      of cad $ 800 million , or approximately $ 761 million as of december 31 , 2009
      , to support its canadian securities processing operations .


      the line of credit has no stated termination date and is cancelable by either
      party with prior notice .


      as of december 31 , 2009 , no balance was outstanding on this line of credit
      .


      contractual cash obligations .'
