  - pre_text: 'management 2019s discussion and analysis 118 jpmorgan chase & co./2018
      form 10-k equivalent to the risk of loan exposures .


      dre is a less extreme measure of potential credit loss than peak and is used
      as an input for aggregating derivative credit risk exposures with loans and
      other credit risk .


      finally , avg is a measure of the expected fair value of the firm 2019s derivative
      receivables at future time periods , including the benefit of collateral .


      avg over the total life of the derivative contract is used as the primary metric
      for pricing purposes and is used to calculate credit risk capital and the cva
      , as further described below .


      the fair value of the firm 2019s derivative receivables incorporates cva to
      reflect the credit quality of counterparties .


      cva is based on the firm 2019s avg to a counterparty and the counterparty 2019s
      credit spread in the credit derivatives market .


      the firm believes that active risk management is essential to controlling the
      dynamic credit risk in the derivatives portfolio .


      in addition , the firm 2019s risk management process takes into consideration
      the potential impact of wrong-way risk , which is broadly defined as the potential
      for increased correlation between the firm 2019s exposure to a counterparty
      ( avg ) and the counterparty 2019s credit quality .


      many factors may influence the nature and magnitude of these correlations over
      time .


      to the extent that these correlations are identified , the firm may adjust the
      cva associated with that counterparty 2019s avg .


      the firm risk manages exposure to changes in cva by entering into credit derivative
      contracts , as well as interest rate , foreign exchange , equity and commodity
      derivative contracts .


      the accompanying graph shows exposure profiles to the firm 2019s current derivatives
      portfolio over the next 10 years as calculated by the peak , dre and avg metrics
      .


      the three measures generally show that exposure will decline after the first
      year , if no new trades are added to the portfolio .


