    post_text: 'loss advisories and drawdowns loss advisories and drawdowns are tools
      used to highlight to senior management trading losses above certain levels and
      initiate discus- sion of remedies .


      economic value stress testing while var reflects the risk of loss due to adverse
      changes in normal markets , stress testing captures the firm 2019s exposure
      to unlikely but plausible events in abnormal markets .


      the firm conducts economic- value stress tests using multiple scenarios that
      assume credit spreads widen significantly , equity prices decline and significant
      changes in interest rates across the major currencies .


      other scenar- ios focus on the risks predominant in individual business segments
      and include scenarios that focus on the potential for adverse movements in complex
      portfolios .


      scenarios were updated more frequently in 2009 and , in some cases , redefined
      to reflect the signifi- cant market volatility which began in late 2008 .


      along with var , stress testing is important in measuring and controlling risk
      .


      stress testing enhances the understanding of the firm 2019s risk profile and
      loss potential , and stress losses are monitored against limits .


      stress testing is also utilized in one-off approvals and cross-business risk
      measurement , as well as an input to economic capital allocation .


      stress-test results , trends and explanations based on current market risk positions
      are reported to the firm 2019s senior management and to the lines of business
      to help them better measure and manage risks and to understand event risk 2013sensitive
      positions. .'
