    post_text: '2009 compared with 2008 total net revenue was $ 100.4 billion , up
      by $ 33.2 billion , or 49% ( 49 % ) , from the prior year .


      the increase was driven by higher principal transactions revenue , primarily
      related to improved performance across most fixed income and equity products
      , and the absence of net markdowns on legacy leveraged lending and mortgage
      positions in ib , as well as higher levels of trading gains and investment securities
      income in corporate/private equity .


      results also benefited from the impact of the washington mutual transaction
      , which contributed to increases in net interest income , lending- and deposit-related
      fees , and mortgage fees and related income .


      lastly , higher investment banking fees also contributed to revenue growth .


      these increases in revenue were offset partially by reduced fees and commissions
      from the effect of lower market levels on assets under management and custody
      , and the absence of proceeds from the sale of visa shares in its initial public
      offering in the first quarter of 2008 .


      investment banking fees increased from the prior year , due to higher equity
      and debt underwriting fees .


      for a further discussion of invest- ment banking fees , which are primarily
      recorded in ib , see ib segment results on pages 63 201365 of this annual report
      .


      principal transactions revenue , which consists of revenue from trading and
      private equity investing activities , was significantly higher com- pared with
      the prior year .


      trading revenue increased , driven by improved performance across most fixed
      income and equity products ; modest net gains on legacy leveraged lending and
      mortgage-related positions , compared with net markdowns of $ 10.6 billion in
      the prior year ; and gains on trading positions in corporate/private equity
      , compared with losses in the prior year of $ 1.1 billion on markdowns of federal
      national mortgage association ( 201cfannie mae 201d ) and fed- eral home loan
      mortgage corporation ( 201cfreddie mac 201d ) preferred securities .


      these increases in revenue were offset partially by an aggregate loss of $ 2.3
      billion from the tightening of the firm 2019s credit spread on certain structured
      liabilities and derivatives , compared with gains of $ 2.0 billion in the prior
      year from widening spreads on these liabilities and derivatives .


      the firm 2019s private equity investments pro- duced a slight net loss in 2009
      , a significant improvement from a larger net loss in 2008 .


      for a further discussion of principal transac- tions revenue , see ib and corporate/private
      equity segment results on pages 63 201365 and 82 201383 , respectively , and
      note 3 on pages 156 2013 173 of this annual report .


      lending- and deposit-related fees rose from the prior year , predomi- nantly
      reflecting the impact of the washington mutual transaction and organic growth
      in both lending- and deposit-related fees in rfs , cb , ib and tss .


      for a further discussion of lending- and deposit- related fees , which are mostly
      recorded in rfs , tss and cb , see the rfs segment results on pages 66 201371
      , the tss segment results on pages 77 201378 , and the cb segment results on
      pages 75 201376 of this annual report .


      the decline in asset management , administration and commissions revenue compared
      with the prior year was largely due to lower asset management fees in am from
      the effect of lower market levels .


      also contributing to the decrease were lower administration fees in tss , driven
      by the effect of market depreciation on certain custody assets and lower securities
      lending balances ; and lower brokerage commis- sions revenue in ib , predominantly
      related to lower transaction vol- ume .


      for additional information on these fees and commissions , see the segment discussions
      for tss on pages 77 201378 , and am on pages 79 201381 of this annual report
      .


      securities gains were lower in 2009 and included credit losses related to other-than-temporary
      impairment and lower gains on the sale of mastercard shares of $ 241 million
      in 2009 , compared with $ 668 million in 2008 .


      these decreases were offset partially by higher gains from repositioning the
      corporate investment securities portfolio in connection with managing the firm
      2019s structural interest rate risk .


      for a further discussion of securities gains , which are mostly recorded in
      corporate/private equity , see the corpo- rate/private equity segment discussion
      on pages 82 201383 of this annual report .


      mortgage fees and related income increased slightly from the prior year , as
      higher net mortgage servicing revenue was largely offset by lower production
      revenue .


      the increase in net mortgage servicing revenue was driven by growth in average
      third-party loans serviced as a result of the washington mutual transaction
      .


      mortgage production revenue declined from the prior year , reflecting an increase
      in esti- mated losses from the repurchase of previously-sold loans , offset
      partially by wider margins on new originations .


      for a discussion of mortgage fees and related income , which is recorded primarily
      in rfs 2019s consumer lending business , see the consumer lending discus- sion
      on pages 68 201371 of this annual report .


      credit card income , which includes the impact of the washington mutual transaction
      , decreased slightly compared with the prior year .'
