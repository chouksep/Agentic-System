      rates , loss severities , the amounts and timing of prepayments and other factors
      that are reflective of current market conditions .


      probable decreases in expected loan principal cash flows trigger the recognition
      of impairment , which is then measured as the present value of the expected
      principal loss plus any related foregone interest cash flows discounted at the
      pool 2019s effective interest rate .


      impairments that occur after the acquisition date are recognized through the
      provision and allow- ance for loan losses .


      probable and significant increases in expected principal cash flows would first
      reverse any previously recorded allowance for loan losses ; any remaining increases
      are recognized prospectively as interest income .


      the impacts of ( i ) prepayments , ( ii ) changes in variable interest rates
      , and ( iii ) any other changes in the timing of expected cash flows are recognized
      prospectively as adjustments to interest income .


      disposals of loans , which may include sales of loans , receipt of payments
      in full by the borrower , or foreclosure , result in removal of the loan from
      the purchased credit-impaired portfolio .


      if the timing and/or amounts of expected cash flows on these purchased credit-impaired
      loans were determined not to be rea- sonably estimable , no interest would be
      accreted and the loans would be reported as nonperforming loans ; however ,
      since the timing and amounts of expected cash flows for these purchased credit-impaired
      loans are reasonably estimable , interest is being accreted and the loans are
      being reported as performing loans .


      charge-offs are not recorded on purchased credit-impaired loans until actual
      losses exceed the estimated losses that were recorded as purchase accounting
