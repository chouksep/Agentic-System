    post_text: '( a ) reflects additional capital required , in the firm 2019s view
      , to meet its regulatory and debt rating objectives .


      credit risk capital credit risk capital is estimated separately for the wholesale
      businesses ( cib , cb and am ) and consumer business ( ccb ) .


      credit risk capital for the wholesale credit portfolio is defined in terms of
      unexpected credit losses , both from defaults and from declines in the value
      of the portfolio due to credit deterioration , measured over a one-year period
      at a confidence level consistent with an 201caa 201d credit rating standard
      .


      unexpected losses are losses in excess of those for which the allowance for
      credit losses is maintained .


      the capital methodology is based on several principal drivers of credit risk
      : exposure at default ( or loan-equivalent amount ) , default likelihood , credit
      spreads , loss severity and portfolio correlation .


      credit risk capital for the consumer portfolio is based on product and other
      relevant risk segmentation .


      actual segment-level default and severity experience are used to estimate unexpected
      losses for a one-year horizon at a confidence level consistent with an 201caa
      201d credit rating standard .


      the decrease in credit risk capital in 2012 was driven by consumer portfolio
      runoff and continued model enhancements to better estimate future stress credit
      losses in the consumer portfolio .


      see credit risk management on pages 134 2013135 of this annual report for more
      information about these credit risk measures .


      market risk capital the firm calculates market risk capital guided by the principle
      that capital should reflect the risk of loss in the value of the portfolios
      and financial instruments caused by adverse movements in market variables ,
      such as interest and foreign exchange rates , credit spreads , and securities
      and commodities prices , taking into account the liquidity of the financial
      instruments .


      results from daily var , weekly stress tests , issuer credit spreads and default
      risk calculations , as well as other factors , are used to determine appropriate
      capital levels .


      market risk capital is allocated to each business segment based on its risk
      assessment .


      the increase in market risk capital in 2012 was driven by increased risk in
      the synthetic credit portfolio .


      see market risk management on pages 163 2013169 of this annual report for more
      information about these market risk measures .


      operational risk capital operational risk is the risk of loss resulting from
      inadequate or failed processes or systems , human factors or external events
      .


      the operational risk capital model is based on actual losses and potential scenario-based
      losses , with adjustments to the capital calculation to reflect changes in the
      quality of the control environment .


      the increase in operational risk capital in 2012 was primarily due to continued
      model enhancements to better capture large historical loss events , including
      mortgage-related litigation costs .


      the increases that occurred during 2012 will be fully reflected in average operational
      risk capital in 2013 .


      see operational risk management on pages 175 2013176 of this annual report for
      more information about operational risk .


      private equity risk capital capital is allocated to privately- and publicly-held
      securities , third-party fund investments , and commitments in the private equity
      portfolio , within the corporate/private equity segment , to cover the potential
      loss associated with a decline in equity markets and related asset devaluations
      .


      in addition to negative market fluctuations , potential losses in private equity
      investment portfolios can be magnified by liquidity risk. .'
