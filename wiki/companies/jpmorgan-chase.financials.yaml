  - pre_text: 'jpmorgan chase & co./2012 annual report 119 implementing further revisions
      to the capital accord in the u.s .


      ( such further revisions are commonly referred to as 201cbasel iii 201d ) .


      basel iii revised basel ii by , among other things , narrowing the definition
      of capital , and increasing capital requirements for specific exposures .


      basel iii also includes higher capital ratio requirements and provides that
      the tier 1 common capital requirement will be increased to 7% ( 7 % ) , comprised
      of a minimum ratio of 4.5% ( 4.5 % ) plus a 2.5% ( 2.5 % ) capital conservation
      buffer .


      implementation of the 7% ( 7 % ) tier 1 common capital requirement is required
      by january 1 , in addition , global systemically important banks ( 201cgsibs
      201d ) will be required to maintain tier 1 common requirements above the 7%
      ( 7 % ) minimum in amounts ranging from an additional 1% ( 1 % ) to an additional
      2.5% ( 2.5 % ) .


      in november 2012 , the financial stability board ( 201cfsb 201d ) indicated
      that it would require the firm , as well as three other banks , to hold the
      additional 2.5% ( 2.5 % ) of tier 1 common ; the requirement will be phased
      in beginning in 2016 .


      the basel committee also stated it intended to require certain gsibs to hold
      an additional 1% ( 1 % ) of tier 1 common under certain circumstances , to act
      as a disincentive for the gsib from taking actions that would further increase
      its systemic importance .


      currently , no gsib ( including the firm ) is required to hold this additional
      1% ( 1 % ) of tier 1 common .


      in addition , pursuant to the requirements of the dodd-frank act , u.s .


      federal banking agencies have proposed certain permanent basel i floors under
      basel ii and basel iii capital calculations .


      the following table presents a comparison of the firm 2019s tier 1 common under
      basel i rules to its estimated tier 1 common under basel iii rules , along with
      the firm 2019s estimated risk-weighted assets .


      tier 1 common under basel iii includes additional adjustments and deductions
      not included in basel i tier 1 common , such as the inclusion of aoci related
      to afs securities and defined benefit pension and other postretirement employee
      benefit ( 201copeb 201d ) plans .


      the firm estimates that its tier 1 common ratio under basel iii rules would
      be 8.7% ( 8.7 % ) as of december 31 , 2012 .


      the tier 1 common ratio under both basel i and basel iii are non- gaap financial
      measures .


      however , such measures are used by bank regulators , investors and analysts
      as a key measure to assess the firm 2019s capital position and to compare the
      firm 2019s capital to that of other financial services companies .


      december 31 , 2012 ( in millions , except ratios ) .'
