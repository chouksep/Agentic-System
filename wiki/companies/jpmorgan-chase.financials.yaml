      in measuring and controlling risk .


      while var reflects the risk of loss due to adverse changes in markets using
      recent historical market behavior as an indicator of losses , stress testing
      captures the firm 2019s exposure to unlikely but plausible events in abnormal
      markets .


      the firm runs weekly stress tests on market-related risks across the lines of
      business using multiple scenarios that assume significant changes in risk factors
      such as credit spreads , equity prices , interest rates , currency rates or
      commodity prices .


      the framework uses a grid-based approach , which calculates multiple magnitudes
      of stress for both market rallies and market sell-offs for .'
