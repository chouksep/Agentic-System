  - pre_text: 'management 2019s discussion and analysis 74 jpmorgan chase & co./2017
      annual report treasury and cio overview treasury and cio is predominantly responsible
      for measuring , monitoring , reporting and managing the firm 2019s liquidity
      , funding and structural interest rate and foreign exchange risks , as well
      as executing the firm 2019s capital plan .


      the risks managed by treasury and cio arise from the activities undertaken by
      the firm 2019s four major reportable business segments to serve their respective
      client bases , which generate both on- and off-balance sheet assets and liabilities
      .


      treasury and cio seek to achieve the firm 2019s asset-liability management objectives
      generally by investing in high- quality securities that are managed for the
      longer-term as part of the firm 2019s investment securities portfolio .


      treasury and cio also use derivatives to meet the firm 2019s asset- liability
      management objectives .


      for further information on derivatives , see note 5 .


