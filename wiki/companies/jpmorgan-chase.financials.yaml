  - pre_text: 'management 2019s discussion and analysis 164 jpmorgan chase & co./2013
      annual report firm ) is required to hold more than the additional 2.5% ( 2.5
      % ) of tier 1 common .


      in addition , basel iii establishes a 6.5% ( 6.5 % ) tier i common equity standard
      for the definition of 201cwell capitalized 201d under the prompt corrective
      action ( 201cpca 201d ) requirements of the fdic improvement act ( 201cfdicia
      201d ) .


      the tier i common equity standard is effective from the first quarter of 2015
      .


      the following chart presents the basel iii minimum risk-based capital ratios
      during the transitional periods and on a fully phased-in basis .


      the chart also includes management 2019s target for the firm 2019s tier 1 common
      ratio .


      it is the firm 2019s current expectation that its basel iii tier 1 common ratio
      will exceed the regulatory minimums , both during the transition period and
      upon full implementation in 2019 and thereafter .


      the firm estimates that its tier 1 common ratio under the basel iii advanced
      approach on a fully phased-in basis would be 9.5% ( 9.5 % ) as of december 31
      , 2013 , achieving management 2019s previously stated objectives .


      the tier 1 common ratio as calculated under the basel iii standardized approach
      is estimated at 9.4% ( 9.4 % ) as of december 31 , 2013 .


      the tier 1 common ratio under both basel i and basel iii are non-gaap financial
      measures .


      however , such measures are used by bank regulators , investors and analysts
      to assess the firm 2019s capital position and to compare the firm 2019s capital
      to that of other financial services companies .


      the following table presents a comparison of the firm 2019s tier 1 common under
      basel i rules to its estimated tier 1 common under the advanced approach of
      the basel iii rules , along with the firm 2019s estimated risk-weighted assets
      .


      key differences in the calculation of rwa between basel i and basel iii advanced
      approach include : ( 1 ) basel iii credit risk rwa is based on risk-sensitive
      approaches which largely rely on the use of internal credit models and parameters
      , whereas basel i rwa is based on fixed supervisory risk- weightings which vary
      only by counterparty type and asset class ; and ( 2 ) basel iii includes rwa
      for operational risk , whereas basel i does not .


      operational risk capital takes into consideration operational losses in the
      quarter following the period in which those losses were realized , and the calculation
      generally incorporates such losses irrespective of whether the issues or business
      activity giving rise to the losses have been remediated or reduced .


      the firm 2019s operational risk capital model continues to be refined in conjunction
      with the firm 2019s basel iii advanced approach parallel run .


      as a result of model enhancements in 2013 , as well as taking into consideration
      the legal expenses incurred by the firm in 2013 , the firm 2019s operational
      risk capital increased substantially in 2013 over 2012 .


      tier 1 common under basel iii includes additional adjustments and deductions
      not included in basel i tier 1 common , such as the inclusion of accumulated
      other comprehensive income ( 201caoci 201d ) related to afs securities and defined
      benefit pension and other postretirement employee benefit ( 201copeb 201d )
      plans .


