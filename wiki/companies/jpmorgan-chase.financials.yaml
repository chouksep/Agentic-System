      annual report wholesale credit portfolio the firm 2019s wholesale businesses
      are exposed to credit risk through underwriting , lending , market-making ,
      and hedging activities with and for clients and counterparties , as well as
      through various operating services such as cash management and clearing activities
      .


      a portion of the loans originated or acquired by the firm 2019s wholesale businesses
      is generally retained on the balance sheet .


      the firm distributes a significant percentage of the loans it originates into
      the market as part of its syndicated loan business and to manage portfolio concentrations
      and credit risk .


      the wholesale credit portfolio , excluding oil & gas , continued to be generally
      stable throughout 2015 , characterized by low levels of criticized exposure
      , nonaccrual loans and charge-offs .


      growth in loans retained was driven by increased client activity , notably in
      commercial real estate .


      discipline in underwriting across all areas of lending continues to remain a
      key point of focus .


      the wholesale portfolio is actively managed , in part by conducting ongoing
      , in-depth reviews of client credit quality and transaction structure , inclusive
      of collateral where applicable ; and of industry , product and client concentrations
      .


