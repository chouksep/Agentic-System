  - pre_text: 'jpmorgan chase & co./2015 annual report 73 in advisory fees was driven
      by the combined impact of a greater share of fees for completed transactions
      , and growth in industry-wide fees .


      the increase in equity underwriting fees was driven by higher industry-wide
      issuance .


      the decrease in debt underwriting fees was primarily related to lower bond underwriting
      fees compared with the prior year , and lower loan syndication fees on lower
      industry-wide fees .


      principal transactions revenue increased as the prior year included a $ 1.5
      billion loss related to the implementation of the funding valuation adjustment
      ( 201cfva 201d ) framework for over-the-counter ( 201cotc 201d ) derivatives
      and structured notes .


      private equity gains increased as a result of higher net gains on sales .


      these increases were partially offset by lower fixed income markets revenue
      in cib , primarily driven by credit-related and rates products , as well as
      the impact of business simplification initiatives .


      lending- and deposit-related fees decreased compared with the prior year , reflecting
      the impact of business simplification initiatives and lower trade finance revenue
      in cib .


      asset management , administration and commissions revenue increased compared
      with the prior year , reflecting higher asset management fees driven by net
      client inflows and higher market levels in am and ccb .


      the increase was offset partially by lower commissions and other fee revenue
      in ccb as a result of the exit of a non-core product in 2013 .


      securities gains decreased compared with the prior year , reflecting lower repositioning
      activity related to the firm 2019s investment securities portfolio .


      mortgage fees and related income decreased compared with the prior year , predominantly
      due to lower net production revenue driven by lower volumes due to higher mortgage
      interest rates , and tighter margins .


      the decline in net production revenue was partially offset by a lower loss on
      the risk management of mortgage servicing rights ( 201cmsrs 201d ) .


      card income was relatively flat compared with the prior year , but included
      higher net interchange income due to growth in credit and debit card sales volume
      , offset by higher amortization of new account origination costs .


      other income decreased from the prior year , predominantly from the absence
      of two significant items recorded in corporate in 2013 : gains of $ 1.3 billion
      and $ 493 million from sales of visa shares and one chase manhattan plaza ,
      respectively .


      lower valuations of seed capital investments in am and losses related to the
      exit of non-core portfolios in card also contributed to the decrease .


      these items were partially offset by higher auto lease income as a result of
      growth in auto lease volume , and a benefit from a tax settlement .


      net interest income increased slightly from the prior year , predominantly reflecting
      higher yields on investment securities , the impact of lower interest expense
      from lower rates , and higher average loan balances .


      the increase was partially offset by lower yields on loans due to the run-off
      of higher-yielding loans and new originations of lower-yielding loans , and
      lower average interest-earning trading asset balances .


      the firm 2019s average interest-earning assets were $ 2.0 trillion , and the
      net interest yield on these assets , on a fte basis , was 2.18% ( 2.18 % ) ,
      a decrease of 5 basis points from the prior year .


