  - pre_text: 'notes to consolidated financial statements 196 jpmorgan chase & co./2014
      annual report credit and funding adjustments when determining the fair value
      of an instrument , it may be necessary to record adjustments to the firm 2019s
      estimates of fair value in order to reflect counterparty credit quality , the
      firm 2019s own creditworthiness , and the impact of funding : 2022 credit valuation
      adjustments ( 201ccva 201d ) are taken to reflect the credit quality of a counterparty
      in the valuation of derivatives .


      cva are necessary when the market price ( or parameter ) is not indicative of
      the credit quality of the counterparty .


      as few classes of derivative contracts are listed on an exchange , derivative
      positions are predominantly valued using models that use as their basis observable
      market parameters .


      an adjustment therefore may be necessary to reflect the credit quality of each
      derivative counterparty to arrive at fair value .


      the firm estimates derivatives cva using a scenario analysis to estimate the
      expected credit exposure across all of the firm 2019s positions with each counterparty
      , and then estimates losses as a result of a counterparty credit event .


      the key inputs to this methodology are ( i ) the expected positive exposure
      to each counterparty based on a simulation that assumes the current population
      of existing derivatives with each counterparty remains unchanged and considers
      contractual factors designed to mitigate the firm 2019s credit exposure , such
      as collateral and legal rights of offset ; ( ii ) the probability of a default
      event occurring for each counterparty , as derived from observed or estimated
      cds spreads ; and ( iii ) estimated recovery rates implied by cds , adjusted
      to consider the differences in recovery rates as a derivative creditor relative
      to those reflected in cds spreads , which generally reflect senior unsecured
      creditor risk .


      as such , the firm estimates derivatives cva relative to the relevant benchmark
      interest rate .


      2022 dva is taken to reflect the credit quality of the firm in the valuation
      of liabilities measured at fair value .


      the dva calculation methodology is generally consistent with the cva methodology
      described above and incorporates jpmorgan chase 2019s credit spread as observed
      through the cds market to estimate the probability of default and loss given
      default as a result of a systemic event affecting the firm .


      structured notes dva is estimated using the current fair value of the structured
      note as the exposure amount , and is otherwise consistent with the derivative
      dva methodology .


      2022 the firm incorporates the impact of funding in its valuation estimates
      where there is evidence that a market participant in the principal market would
      incorporate it in a transfer of the instrument .


      as a result , the fair value of collateralized derivatives is estimated by discounting
      expected future cash flows at the relevant overnight indexed swap ( 201cois
      201d ) rate given the underlying collateral agreement with the counterparty
      .


      effective in 2013 , the firm implemented a fva framework to incorporate the
      impact of funding into its valuation estimates for uncollateralized ( including
      partially collateralized ) over- the-counter ( 201cotc 201d ) derivatives and
      structured notes .


      the firm 2019s fva framework leverages its existing cva and dva calculation
      methodologies , and considers the fact that the firm 2019s own credit risk is
      a significant component of funding costs .


      the key inputs are : ( i ) the expected funding requirements arising from the
      firm 2019s positions with each counterparty and collateral arrangements ; (
      ii ) for assets , the estimated market funding cost in the principal market
      ; and ( iii ) for liabilities , the hypothetical market funding cost for a transfer
      to a market participant with a similar credit standing as the firm .


      upon the implementation of the fva framework in 2013 , the firm recorded a one
      time $ 1.5 billion loss in principal transactions revenue that was recorded
      in the cib .


      while the fva framework applies to both assets and liabilities , the loss on
      implementation largely related to uncollateralized derivative receivables given
      that the impact of the firm 2019s own credit risk , which is a significant component
      of funding costs , was already incorporated in the valuation of liabilities
      through the application of dva .


      the following table provides the credit and funding adjustments , excluding
      the effect of any associated hedging activities , reflected within the consolidated
      balance sheets as of the dates indicated. .'
