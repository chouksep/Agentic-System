  - pre_text: 'jpmorgan chase & co./2018 form 10-k 117 lending-related commitments
      the firm uses lending-related financial instruments , such as commitments (
      including revolving credit facilities ) and guarantees , to address the financing
      needs of its clients .


      the contractual amounts of these financial instruments represent the maximum
      possible credit risk should the clients draw down on these commitments or the
      firm fulfill its obligations under these guarantees , and the clients subsequently
      fail to perform according to the terms of these contracts .


      most of these commitments and guarantees are refinanced , extended , cancelled
      , or expire without being drawn upon or a default occurring .


      in the firm 2019s view , the total contractual amount of these wholesale lending-related
      commitments is not representative of the firm 2019s expected future credit exposure
      or funding requirements .


      for further information on wholesale lending-related commitments , refer to
      note 27 .


      clearing services the firm provides clearing services for clients entering into
      certain securities and derivative contracts .


      through the provision of these services the firm is exposed to the risk of non-performance
      by its clients and may be required to share in losses incurred by ccps .


      where possible , the firm seeks to mitigate its credit risk to its clients through
      the collection of adequate margin at inception and throughout the life of the
      transactions and can also cease provision of clearing services if clients do
      not adhere to their obligations under the clearing agreement .


      for further discussion of clearing services , refer to note 27 .


      derivative contracts derivatives enable clients and counterparties to manage
      risks including credit risk and risks arising from fluctuations in interest
      rates , foreign exchange , equities , and commodities .


      the firm makes markets in derivatives in order to meet these needs and uses
      derivatives to manage certain risks associated with net open risk positions
      from its market-making activities , including the counterparty credit risk arising
      from derivative receivables .


      the firm also uses derivative instruments to manage its own credit and other
      market risk exposure .


      the nature of the counterparty and the settlement mechanism of the derivative
      affect the credit risk to which the firm is exposed .


      for otc derivatives the firm is exposed to the credit risk of the derivative
      counterparty .


      for exchange-traded derivatives ( 201cetd 201d ) , such as futures and options
      , and 201ccleared 201d over-the-counter ( 201cotc-cleared 201d ) derivatives
      , the firm is generally exposed to the credit risk of the relevant ccp .


      where possible , the firm seeks to mitigate its credit risk exposures arising
      from derivative contracts through the use of legally enforceable master netting
      arrangements and collateral agreements .


      for a further discussion of derivative contracts , counterparties and settlement
      types , refer to note 5 .


      the following table summarizes the net derivative receivables for the periods
      presented .


      derivative receivables .'
