      as previously noted , the firm uses collateral agreements to mitigate counterparty
      credit risk .


      the percentage of the firm 2019s derivatives transactions subject to collateral
      agreements 2014 excluding foreign exchange spot trades , which are not typically
      covered by collateral agreements due to their short maturity 2014 was 90% (
      90 % ) as of december 31 , 2016 , largely unchanged compared with 87% ( 87 %
      ) as of december 31 , 2015 .


      credit derivatives the firm uses credit derivatives for two primary purposes
      : first , in its capacity as a market-maker , and second , as an end-user to
      manage the firm 2019s own credit risk associated with various exposures .


      for a detailed description of credit derivatives , see credit derivatives in
      note 6 .


      credit portfolio management activities included in the firm 2019s end-user activities
      are credit derivatives used to mitigate the credit risk associated with traditional
      lending activities ( loans and unfunded commitments ) and derivatives counterparty
      exposure in the firm 2019s wholesale businesses ( collectively , 201ccredit
      portfolio management 201d activities ) .


      information on credit portfolio management activities is provided in the table
      below .


      for further information on derivatives used in credit portfolio management activities
      , see credit derivatives in note 6 .


      the firm also uses credit derivatives as an end-user to manage other exposures
      , including credit risk arising from certain securities held in the firm 2019s
      market-making businesses .


