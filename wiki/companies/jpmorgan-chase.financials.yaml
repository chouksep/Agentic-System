      yield percentage .


      the factors that most significantly affect estimates of gross cash flows expected
      to be collected , and accordingly the accretable yield balance , include : (
      i ) changes in the benchmark interest rate indices for variable rate products
      such as option arm and home equity loans ; and ( ii ) changes in prepayment
      assump- tions .


      to date , the decrease in the accretable yield percentage has been primarily
      related to a decrease in interest rates on vari- able-rate loans and , to a
      lesser extent , extended loan liquida- tion periods .


      certain events , such as extended loan liquidation periods , affect the timing
      of expected cash flows but not the amount of cash expected to be received (
      i.e. , the accretable yield balance ) .


      extended loan liquidation periods reduce the accretable yield percentage because
      the same accretable yield balance is recognized against a higher-than-expected
      loan balance over a longer-than-expected period of time. .'
