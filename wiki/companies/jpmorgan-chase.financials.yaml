  - pre_text: 'management 2019s discussion and analysis 110 jpmorgan chase & co./2013
      annual report 2012 compared with 2011 net loss was $ 2.0 billion , compared
      with a net income of $ 919 million in the prior year .


      private equity reported net income of $ 292 million , compared with net income
      of $ 391 million in the prior year .


      net revenue was $ 601 million , compared with $ 836 million in the prior year
      , due to lower unrealized and realized gains on private investments , partially
      offset by higher unrealized gains on public securities .


      noninterest expense was $ 145 million , down from $ 238 million in the prior
      year .


      treasury and cio reported a net loss of $ 2.1 billion , compared with net income
      of $ 1.3 billion in the prior year .


