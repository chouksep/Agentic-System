  - pre_text: 'management 2019s discussion and analysis jpmorgan chase & co./2009
      annual report 130 the following histogram illustrates the daily market risk
      2013related gains and losses for ib and consumer/cio positions for 2009 .


      the chart shows that the firm posted market risk 2013related gains on 227 out
      of 261 days in this period , with 69 days exceeding $ 160 million .


      the inset graph looks at those days on which the firm experienced losses and
      depicts the amount by which the 95% ( 95 % ) confidence level var exceeded the
      actual loss on each of those days .


      losses were sustained on 34 days during 2009 and exceeded the var measure on
      one day due to high market volatility in the first quarter of 2009 .


      under the 95% ( 95 % ) confidence interval , the firm would expect to incur
      daily losses greater than that pre- dicted by var estimates about twelve times
      a year .


      the following table provides information about the gross sensitivity of dva
      to a one-basis-point increase in jpmorgan chase 2019s credit spreads .


      this sensitivity represents the impact from a one-basis-point parallel shift
      in jpmorgan chase 2019s entire credit curve .


      as credit curves do not typically move in a parallel fashion , the sensitivity
      multiplied by the change in spreads at a single maturity point may not be representative
      of the actual revenue recognized .


      debit valuation adjustment sensitivity 1 basis point increase in ( in millions
      ) jpmorgan chase credit spread .'
