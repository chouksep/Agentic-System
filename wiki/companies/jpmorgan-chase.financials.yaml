      billion in the prior year .


      the current year loss reflected $ 5.8 billion of losses incurred by cio from
      the synthetic credit portfolio for the six months ended june 30 , 2012 , and
      $ 449 million of losses from the retained index credit derivative positions
      for the three months ended september 30 , 2012 .


      these losses were partially offset by securities gains of $ 2.0 billion .


      the current year revenue reflected $ 888 million of extinguishment gains related
      to the redemption of trust preferred securities , which are included in all
      other income in the above table .


      the extinguishment gains were related to adjustments applied to the cost basis
      of the trust preferred securities during the period they were in a qualified
      hedge accounting relationship .


      net interest income was negative $ 683 million , compared with $ 1.4 billion
      in the prior year , primarily reflecting the impact of lower portfolio yields
      and higher deposit balances across the firm .


      other corporate reported a net loss of $ 221 million , compared with a net loss
      of $ 821 million in the prior year .


      noninterest revenue of $ 1.8 billion was driven by a $ 1.1 billion benefit for
      the washington mutual bankruptcy settlement , which is included in all other
      income in the above table , and a $ 665 million gain from the recovery on a
      bear stearns-related subordinated loan .


      noninterest expense of $ 3.8 billion was up $ 1.0 billion compared with the
      prior year .


      the current year included expense of $ 3.7 billion for additional litigation
      reserves , largely for mortgage-related matters .


      the prior year included expense of $ 3.2 billion for additional litigation reserves
      .


      treasury and cio overview treasury and cio are predominantly responsible for
      measuring , monitoring , reporting and managing the firm 2019s liquidity , funding
      and structural interest rate and foreign exchange risks , as well as executing
      the firm 2019s capital plan .


      the risks managed by treasury and cio arise from the activities undertaken by
      the firm 2019s four major reportable business segments to serve their respective
      client bases , which generate both on- and off-balance sheet assets and liabilities
      .


      cio achieves the firm 2019s asset-liability management objectives generally
      by investing in high-quality securities that are managed for the longer-term
      as part of the firm 2019s afs and htm investment securities portfolios ( the
      201cinvestment securities portfolio 201d ) .


      cio also uses derivatives , as well as securities that are not classified as
      afs or htm , to meet the firm 2019s asset-liability management objectives .


      for further information on derivatives , see note 6 on pages 220 2013233 of
      this annual report .


      for further information about securities not classified within the afs or htm
      portfolio , see note 3 on pages 195 2013215 of this annual report .


      the treasury and cio investment securities portfolio primarily consists of u.s
      .


      and non-u.s .


      government securities , agency and non-agency mortgage-backed securities , other
