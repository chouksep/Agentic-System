      annual report the credit derivatives used in credit portfolio management activities
      do not qualify for hedge accounting under u.s .


      gaap ; these derivatives are reported at fair value , with gains and losses
      recognized in principal transactions revenue .


      in contrast , the loans and lending-related commitments being risk-managed are
      accounted for on an accrual basis .


      this asymmetry in accounting treatment , between loans and lending-related commitments
      and the credit derivatives used in credit portfolio management activities ,
      causes earnings volatility that is not representative , in the firm 2019s view
      , of the true changes in value of the firm 2019s overall credit exposure .


      the effectiveness of the firm 2019s credit default swap ( 201ccds 201d ) protection
      as a hedge of the firm 2019s exposures may vary depending on a number of factors
      , including the named reference entity ( i.e. , the firm may experience losses
      on specific exposures that are different than the named reference entities in
      the purchased cds ) , and the contractual terms of the cds ( which may have
      a defined credit event that does not align with an actual loss realized by the
      firm ) and the maturity of the firm 2019s cds protection ( which in some cases
      may be shorter than the firm 2019s exposures ) .


      however , the firm generally seeks to purchase credit protection with a maturity
      date that is the same or similar to the maturity date of the exposure for which
      the protection was purchased , and remaining differences in maturity are actively
      monitored and managed by the firm .


