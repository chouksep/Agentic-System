      note 14 2013 allowance for credit losses the allowance for loan losses includes
      an asset-specific component , a formula-based component and a component related
      to purchased credit-impaired loans .


      the asset-specific component relates to loans considered to be impaired , which
      includes any loans that have been modified in a troubled debt restructuring
      as well as risk-rated loans that have been placed on nonaccrual status .


      an asset-specific allowance for impaired loans is established when the loan
      2019s discounted cash flows ( or , when available , the loan 2019s observable
      market price ) is lower than the recorded investment in the loan .


      to compute the asset-specific component of the allowance , larger loans are
      evaluated individually , while smaller loans are evaluated as pools using historical
      loss experience for the respective class of assets .


      risk-rated loans ( primarily wholesale loans ) are pooled by risk rating , while
      scored loans ( i.e. , consumer loans ) are pooled by product type .


      the firm generally measures the asset-specific allowance as the difference between
      the recorded investment in the loan and the present value of the cash flows
      expected to be collected , dis- counted at the loan 2019s original effective
      interest rate .


      subsequent changes in measured impairment due to the impact of discounting are
      reported as an adjustment to the provision for loan losses , not as an adjustment
      to interest income .


      an asset-specific allowance for an impaired loan with an observable market price
      is measured as the difference between the recorded investment in the loan and
      the loan 2019s fair value .


      certain impaired loans that are determined to be collateral- dependent are charged-off
      to the fair value of the collateral less costs to sell .


      when collateral-dependent commercial real-estate loans are determined to be
      impaired , updated appraisals are typi- cally obtained and updated every six
