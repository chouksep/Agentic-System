      other risk measures debit valuation adjustment sensitivity the following table
      provides information about the gross sensitivity of dva to a one-basis-point
      increase in jpmorgan chase 2019s credit spreads .


      this sensitivity represents the impact from a one-basis-point parallel shift
      in jpmorgan chase 2019s entire credit curve .


      however , the sensitivity at a single point in time multiplied by the change
      in credit spread at a single maturity point may not be representative of the
      actual dva gain or loss realized within a period .


      the actual results reflect the movement in credit spreads across various maturities
      , which typically do not move in a parallel fashion , and is the product of
      a constantly changing exposure profile , among other factors .


