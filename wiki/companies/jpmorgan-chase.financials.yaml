  - pre_text: 'jpmorgan chase & co./2014 annual report 125 lending-related commitments
      the firm uses lending-related financial instruments , such as commitments (
      including revolving credit facilities ) and guarantees , to meet the financing
      needs of its customers .


      the contractual amounts of these financial instruments represent the maximum
      possible credit risk should the counterparties draw down on these commitments
      or the firm fulfills its obligations under these guarantees , and the counterparties
      subsequently fail to perform according to the terms of these contracts .


      in the firm 2019s view , the total contractual amount of these wholesale lending-related
      commitments is not representative of the firm 2019s actual future credit exposure
      or funding requirements .


      in determining the amount of credit risk exposure the firm has to wholesale
      lending-related commitments , which is used as the basis for allocating credit
      risk capital to these commitments , the firm has established a 201cloan-equivalent
      201d amount for each commitment ; this amount represents the portion of the
      unused commitment or other contingent exposure that is expected , based on average
      portfolio historical experience , to become drawn upon in an event of a default
      by an obligor .


      the loan-equivalent amount of the firm 2019s lending- related commitments was
      $ 229.6 billion and $ 218.9 billion as of december 31 , 2014 and 2013 , respectively
      .


      clearing services the firm provides clearing services for clients entering into
      securities and derivative transactions .


      through the provision of these services the firm is exposed to the risk of non-performance
      by its clients and may be required to share in losses incurred by central counterparties
      ( 201cccps 201d ) .


      where possible , the firm seeks to mitigate its credit risk to its clients through
      the collection of adequate margin at inception and throughout the life of the
      transactions and can also cease provision of clearing services if clients do
      not adhere to their obligations under the clearing agreement .


      for further discussion of clearing services , see note 29 .


      derivative contracts in the normal course of business , the firm uses derivative
      instruments predominantly for market-making activities .


      derivatives enable customers to manage exposures to fluctuations in interest
      rates , currencies and other markets .


      the firm also uses derivative instruments to manage its own credit exposure
      .


      the nature of the counterparty and the settlement mechanism of the derivative
      affect the credit risk to which the firm is exposed .


      for otc derivatives the firm is exposed to the credit risk of the derivative
      counterparty .


      for exchange-traded derivatives ( 201cetd 201d ) such as futures and options
      , and 201ccleared 201d over-the-counter ( 201cotc-cleared 201d ) derivatives
      , the firm is generally exposed to the credit risk of the relevant ccp .


      where possible , the firm seeks to mitigate its credit risk exposures arising
      from derivative transactions through the use of legally enforceable master netting
      arrangements and collateral agreements .


      for further discussion of derivative contracts , counterparties and settlement
      types , see note 6 .


      the following table summarizes the net derivative receivables for the periods
      presented .


