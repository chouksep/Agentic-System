      loans sold with recourse the firm provides servicing for mortgages and certain
      commercial lending products on both a recourse and nonrecourse basis .


      in nonrecourse servicing , the principal credit risk to the firm is the cost
      of temporary servicing advances of funds ( i.e. , normal servicing advances
      ) .


      in recourse servicing , the servicer agrees to share credit risk with the owner
      of the mortgage loans , such as fannie mae or freddie mac or a private investor
      , insurer or guarantor .


      losses on recourse servicing predominantly occur when foreclosure sales proceeds
      of the property underlying a defaulted loan are less than the sum of the outstanding
      principal balance , plus accrued interest on the loan and the cost of holding
      and disposing of the underlying property .


      the firm 2019s securitizations are predominantly nonrecourse , thereby effectively
      transferring the risk of future credit losses to the purchaser of the mortgage-backed
      securities issued by the trust .


