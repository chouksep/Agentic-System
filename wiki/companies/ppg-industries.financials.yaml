    post_text: 'total $ 214 $ 178 $ 165 21 .


      stock-based compensation the company 2019s stock-based compensation includes
      stock options , restricted stock units ( 201crsus 201d ) and grants of contingent
      shares that are earned based on achieving targeted levels of total shareholder
      return .


      all current grants of stock options , rsus and contingent shares are made under
      the ppg industries , inc .


      omnibus incentive plan ( 201cppg omnibus plan 201d ) .


      shares available for future grants under the ppg omnibus plan were 4.1 million
      as of december 31 , 2010 .


      total stock-based compensation cost was $ 52 million , $ 34 million and $ 33
      million in 2010 , 2009 and 2008 , respectively .


      the total income tax benefit recognized in the accompanying consolidated statement
      of income related to the stock-based compensation was $ 18 million , $ 12 million
      and $ 12 million in 2010 , 2009 and 2008 , respectively .


      stock options ppg has outstanding stock option awards that have been granted
      under two stock option plans : the ppg industries , inc .


      stock plan ( 201cppg stock plan 201d ) and the ppg omnibus plan .


      under the ppg omnibus plan and the ppg stock plan , certain employees of the
      company have been granted options to purchase shares of common stock at prices
      equal to the fair market value of the shares on the date the options were granted
      .


      the options are generally exercisable beginning from six to 48 months after
      being granted and have a maximum term of 10 years .


      upon exercise of a stock option , shares of company stock are issued from treasury
      stock .


      the ppg stock plan includes a restored option provision for options originally
      granted prior to january 1 , 2003 that allows an optionee to exercise options
      and satisfy the option price by certifying ownership of mature shares of ppg
      common stock with equivalent market value .


      the fair value of stock options issued to employees is measured on the date
      of grant and is recognized as expense over the requisite service period .


      ppg estimates the fair value of stock options using the black-scholes option
      pricing model .


      the risk-free interest rate is determined by using the u.s .


      treasury yield curve at the date of the grant and using a maturity equal to
      the expected life of the option .


      the expected life of options is calculated using the average of the vesting
      term and the maximum term , as prescribed by accounting guidance on the use
      of the simplified method for determining the expected term of an employee share
      option .


      this method is used as the vesting term of stock options was changed to three
      years in 2004 and , as a result , the historical exercise data does not provide
      a reasonable basis upon which to estimate the expected life of options .


      the expected dividend yield and volatility are based on historical stock prices
      and dividend amounts over past time periods equal in length to the expected
      life of the options .


      66 2010 ppg annual report and form 10-k .'
