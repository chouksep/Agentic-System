      agreement ranging from 0.080% ( 0.080 % ) to 0.225% ( 0.225 % ) per annum .


      the average commitment fee in 2016 was 0.09% ( 0.09 % ) , and ppg is committed
      to pay 0.09% ( 0.09 % ) in 2017 .


      the credit agreement also supports the company 2019s commercial paper borrowings
      .


      as a result , the commercial paper borrowings as of december 31 , 2015 were
      classified as long- term debt based on ppg 2019s intent and ability to refinance
      these borrowings on a long-term basis .


      there were no commercial paper borrowings outstanding as of december 31 , 2016
      .


      the credit agreement contains usual and customary restrictive covenants for
      facilities of its type , which include , with specified exceptions , limitations
      on the company 2019s ability to create liens or other encumbrances , to enter
      into sale and leaseback transactions and to enter into consolidations , mergers
      or transfers of all or substantially all of its assets .


      the credit agreement maintains the same restrictive covenant as the prior credit
      agreement whereby the company must maintain a ratio of total indebtedness to
      total capitalization , as defined in the credit agreement , of 60% ( 60 % )
      or less .


      as of december 31 , 2016 , total indebtedness was 45% ( 45 % ) of the company
      2019s total capitalization .


      the credit agreement also contains customary events of default , including the
      failure to make timely payments when due under the credit agreement or other
      material indebtedness , the failure to satisfy covenants contained in the credit
      agreement , a change in control of the company and specified events of bankruptcy
      and insolvency that would permit the lenders to accelerate the repayment of
      any loans .


      in june 2015 , ppg 2019s 20ac300 million 3.875% ( 3.875 % ) notes matured ,
