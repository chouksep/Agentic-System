      plan assets each ppg sponsored defined benefit pension plan is managed in accordance
      with the requirements of local laws and regulations governing defined benefit
      pension plans for the exclusive purpose of providing pension benefits to participants
      and their beneficiaries .


      investment committees comprised of ppg managers have fiduciary responsibility
      to oversee the management of pension plan assets by third party asset managers
      .


      pension plan assets are held in trust by financial institutions and managed
      on a day-to-day basis by the asset managers .


      the asset managers receive a mandate from each investment committee that is
      aligned with the asset allocation targets established by each investment committee
      to achieve the plan 2019s investment strategies .


      the performance of the asset managers is monitored and evaluated by the investment
      committees throughout the year .


      pension plan assets are invested to generate investment earnings over an extended
      time horizon to help fund the cost of benefits promised under the plans while
      mitigating investment risk .


      the asset allocation targets established for each pension plan are intended
      to diversify the investments among a variety of asset categories and among a
      variety of individual securities within each asset category to mitigate investment
      risk and provide each plan with sufficient liquidity to fund the payment of
      pension benefits to retirees .


