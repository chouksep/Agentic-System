      19 .


      employee savings plan ppg 2019s employee savings plan ( 201csavings plan 201d
      ) covers substantially all u.s .


      employees .


      the company makes matching contributions to the savings plan based upon participants
      2019 savings , subject to certain limitations .


      for most participants not covered by a collective bargaining agreement , company-matching
      contributions are established each year at the discretion of the company and
      are applied to a maximum of 6% ( 6 % ) of eligible participant compensation
      .


      for those participants whose employment is covered by a collective bargaining
      agreement , the level of company- matching contribution , if any , is determined
      by the collective bargaining agreement .


      the company-matching contribution was 100% ( 100 % ) for 2008 and for the first
      two months of 2009 .


      the company- matching contribution was suspended from march 2009 through june
      2010 as a cost savings measure in recognition of the adverse impact of the global
      recession .


      effective july 1 , 2010 , the company match was reinstated at 50% ( 50 % ) on
      the first 6% ( 6 % ) contributed for most employees eligible for the company-matching
      contribution feature .


      this would have included the bargained employees in accordance with their collective
      bargaining agreements .


      on january 1 , 2011 , the company match was increased to 75% ( 75 % ) on the
      first 6% ( 6 % ) contributed by these eligible employees .


      compensation expense and cash contributions related to the company match of
      participant contributions to the savings plan for 2010 , 2009 and 2008 totaled
      $ 9 million , $ 7 million and $ 42 million , respectively .


      a portion of the savings plan qualifies under the internal revenue code as an
      employee stock ownership plan .


      as a result , the tax deductible dividends on ppg shares held by the savings
      plan were $ 24 million , $ 28 million and $ 29 million for 2010 , 2009 and 2008
      , respectively .


