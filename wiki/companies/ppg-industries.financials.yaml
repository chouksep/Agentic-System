  - pre_text: 'notes to the consolidated financial statements the credit agreement
      provides that loans will bear interest at rates based , at the company 2019s
      option , on one of two specified base rates plus a margin based on certain formulas
      defined in the credit agreement .


      additionally , the credit agreement contains a commitment fee on the amount
      of unused commitment under the credit agreement ranging from 0.125% ( 0.125
      % ) to 0.625% ( 0.625 % ) per annum .


      the applicable interest rate and the commitment fee will vary depending on the
      ratings established by standard & poor 2019s financial services llc and moody
      2019s investor service inc .


      for the company 2019s non-credit enhanced , long- term , senior , unsecured
      debt .


      the credit agreement contains usual and customary restrictive covenants for
      facilities of its type , which include , with specified exceptions , limitations
      on the company 2019s ability to create liens or other encumbrances , to enter
      into sale and leaseback transactions and to enter into consolidations , mergers
      or transfers of all or substantially all of its assets .


      the credit agreement also requires the company to maintain a ratio of total
      indebtedness to total capitalization , as defined in the credit agreement ,
      of sixty percent or less .


      the credit agreement contains customary events of default that would permit
      the lenders to accelerate the repayment of any loans , including the failure
      to make timely payments when due under the credit agreement or other material
      indebtedness , the failure to satisfy covenants contained in the credit agreement
      , a change in control of the company and specified events of bankruptcy and
      insolvency .


      there were no amounts outstanding under the credit agreement at december 31
      , on november 12 , 2010 , ppg completed a public offering of $ 250 million in
      aggregate principal amount of its 1.900% ( 1.900 % ) notes due 2016 ( the 201c2016
      notes 201d ) , $ 500 million in aggregate principal amount of its 3.600% ( 3.600
      % ) notes due 2020 ( the 201c2020 notes 201d ) and $ 250 million in aggregate
      principal amount of its 5.500% ( 5.500 % ) notes due 2040 ( the 201c2040 notes
      201d ) .


      these notes were issued pursuant to an indenture dated as of march 18 , 2008
      ( the 201coriginal indenture 201d ) between the company and the bank of new
      york mellon trust company , n.a. , as trustee ( the 201ctrustee 201d ) , as
      supplemented by a first supplemental indenture dated as of march 18 , 2008 between
      the company and the trustee ( the 201cfirst supplemental indenture 201d ) and
      a second supplemental indenture dated as of november 12 , 2010 between the company
      and the trustee ( the 201csecond supplemental indenture 201d and , together
      with the original indenture and the first supplemental indenture , the 201cindenture
      201d ) .


      the company may issue additional debt from time to time pursuant to the original
      indenture .


      the indenture governing these notes contains covenants that limit the company
      2019s ability to , among other things , incur certain liens securing indebtedness
      , engage in certain sale-leaseback transactions , and enter into certain consolidations
      , mergers , conveyances , transfers or leases of all or substantially all the
      company 2019s assets .


      the terms of these notes also require the company to make an offer to repurchase
      notes upon a change of control triggering event ( as defined in the second supplemental
      indenture ) at a price equal to 101% ( 101 % ) of their principal amount plus
      accrued and unpaid interest .


      cash proceeds from this notes offering was $ 983 million ( net of discount and
      issuance costs ) .


      the discount and issuance costs related to these notes , which totaled $ 17
      million , will be amortized to interest expense over the respective terms of
      the notes .


      ppg 2019s non-u.s .


      operations have uncommitted lines of credit totaling $ 791 million of which
      $ 31 million was used as of december 31 , 2010 .


      these uncommitted lines of credit are subject to cancellation at any time and
      are generally not subject to any commitment fees .


      short-term debt outstanding as of december 31 , 2010 and 2009 , was as follows
      : ( millions ) 2010 2009 20ac650 million revolving credit facility , 0.8% (
      0.8 % ) as of dec .


      31 , 2009 $ 2014 $ 110 other , weighted average 3.39% ( 3.39 % ) as of dec .


      31 , 2010 and 2.2% ( 2.2 % ) as of december 31 , 2009 24 158 total $ 24 $ 268
      ppg is in compliance with the restrictive covenants under its various credit
      agreements , loan agreements and indentures .


      the company 2019s revolving credit agreements include a financial ratio covenant
      .


      the covenant requires that the amount of total indebtedness not exceed 60% (
      60 % ) of the company 2019s total capitalization excluding the portion of accumulated
      other comprehensive income ( loss ) related to pensions and other postretirement
      benefit adjustments .


      as of december 31 , 2010 , total indebtedness was 45% ( 45 % ) of the company
      2019s total capitalization excluding the portion of accumulated other comprehensive
      income ( loss ) related to pensions and other postretirement benefit adjustments
      .


      additionally , substantially all of the company 2019s debt agreements contain
      customary cross- default provisions .


      those provisions generally provide that a default on a debt service payment
      of $ 10 million or more for longer than the grace period provided ( usually
      10 days ) under one agreement may result in an event of default under other
      agreements .


      none of the company 2019s primary debt obligations are secured or guaranteed
      by the company 2019s affiliates .


      interest payments in 2010 , 2009 and 2008 totaled $ 189 million , $ 201 million
      and $ 228 million , respectively .


      2010 ppg annual report and form 10-k 43 .'
