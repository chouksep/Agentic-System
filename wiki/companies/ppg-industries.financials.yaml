  - pre_text: '2018 ppg annual report and form 10-k 59 other acquisitions in 2018
      , 2017 , and 2016 , the company completed several smaller business acquisitions
      .


      the total consideration paid for these acquisitions , net of cash acquired ,
      debt assumed and other post closing adjustments , was $ 108 million , $ 74 million
      and $ 43 million , respectively .


      in january 2018 , ppg acquired procoatings , a leading architectural paint and
      coatings wholesaler located in the netherlands .


      procoatings , established in 2001 , distributes a large portfolio of well-known
      professional paint brands through its network of 23 multi-brand stores .


      the company employs nearly 100 people .


      the results of this business since the date of acquisition have been reported
      within the architectural coatings americas and asia pacific business within
      the performance coatings reportable segment .


      in january 2017 , ppg acquired certain assets of automotive refinish coatings
      company futian xinshi ( 201cfutian 201d ) , based in the guangdong province
      of china .


      futian distributes its products in china through a network of more than 200
      distributors .


      in january 2017 , ppg completed the acquisition of deutek s.a. , a leading romanian
      paint and architectural coatings manufacturer , from the emerging europe accession
      fund .


      deutek , established in 1993 , manufactures and markets a large portfolio of
      well-known professional and consumer paint brands , including oskar and danke!
      .


      the company 2019s products are sold in more than 120 do-it-yourself stores and
      3500 independent retail outlets in romania .


      divestitures glass segment in 2017 , ppg completed a multi-year strategic shift
      in the company''s business portfolio , resulting in the exit of all glass operations
      which consisted of the global fiber glass business , ppg''s ownership interest
      in two asian fiber glass joint ventures and the flat glass business .


      accordingly , the results of operations , including the gains on the divestitures
      , and cash flows have been recast as discontinued operations for all periods
      presented .


      ppg now has two reportable business segments .


      the net sales and income from discontinued operations related to the former
      glass segment for the three years ended december 31 , 2018 , 2017 , and 2016
      were as follows: .'
