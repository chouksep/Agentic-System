      to the united states in the foreseeable future .


      because those earnings are considered to be indefinitely reinvested , no domestic
      federal or state deferred income taxes have been provided thereon .


      if we were to make a distribution of any portion of those earnings in the form
      of dividends or otherwise , we would be subject to both u.s .


      income taxes ( subject to an adjustment for foreign tax credits ) and withholding
      taxes payable to the various foreign jurisdictions .


      because of the availability of u.s .


      foreign tax credit carryforwards , it is not practicable to determine the domestic
      federal income tax liability that would be payable if such earnings were no
      longer considered to be reinvested indefinitely .


