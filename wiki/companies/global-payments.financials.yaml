  - pre_text: 'cash and a commitment to fund the capital needs of the business until
      such time as its cumulative funding is equal to funding that we have provided
      from inception through the effective date of the transaction .


      the transaction created a new joint venture which does business as comercia
      global payments brazil .


      as a result of the transaction , we deconsolidated global payments brazil ,
      and we apply the equity method of accounting to our retained interest in comercia
      global payments brazil .


      we recorded a gain on the transaction of $ 2.1 million which is included in
      interest and other income in the consolidated statement of income for the fiscal
      year ended may 31 , 2014 .


      the results of the brazil operation from inception until the restructuring into
      a joint venture on september 30 , 2013 were not material to our consolidated
      results of operations , and the assets and liabilities that we derecognized
      were not material to our consolidated balance sheet .


      american express portfolio on october 24 , 2013 , we acquired a merchant portfolio
      in the czech republic from american express limited for $ 1.9 million .


      the acquired assets have been classified as customer-related intangible assets
      and contract-based intangible assets with estimated amortization periods of
      10 years .


      paypros on march 4 , 2014 , we completed the acquisition of 100% ( 100 % ) of
      the outstanding stock of payment processing , inc .


      ( 201cpaypros 201d ) for $ 420.0 million in cash plus $ 7.7 million in cash
      for working capital , subject to adjustment based on a final determination of
      working capital .


      we funded the acquisition with a combination of cash on hand and proceeds from
      our new term loan .


      paypros , based in california , is a provider of fully-integrated payment solutions
      for small-to-medium sized merchants in the united states .


      paypros delivers its products and services through a network of technology-based
      enterprise software partners to vertical markets that are complementary to the
      markets served by accelerated payment technologies ( 201capt 201d ) , which
      we acquired in october 2012 .


      we acquired paypros to expand our direct distribution capabilities in the united
      states and to further enhance our existing integrated solutions offerings .


      this acquisition was recorded as a business combination , and the purchase price
      was allocated to the assets acquired and liabilities assumed based on their
