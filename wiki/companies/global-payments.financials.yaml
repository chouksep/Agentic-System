      valuation of identified intangible assets for the acquisitions discussed above
      , the estimated fair values of customer-related intangible assets were determined
      using the income approach , which was based on projected cash flows discounted
      to their present value using discount rates that consider the timing and risk
      of the forecasted cash flows .


      the discount rates used represented the average estimated value of a market
      participant 2019s cost of capital and debt , derived using customary market
      metrics .


      acquired technologies were valued using the replacement cost method , which
      required us to estimate the costs to construct an asset of equivalent utility
      at prices available at the time of the valuation analysis , with adjustments
      in value for physical deterioration and functional and economic obsolescence
      .


      trademarks and trade names were valued using the 201crelief-from-royalty 201d
      approach .


      this method assumes that trademarks and trade names have value to the extent
      that their owner is relieved of the obligation to pay royalties for the benefits
      received from them .


      this method required us to estimate the future revenues for the related brands
      , the appropriate royalty rate and the weighted-average cost of capital .


