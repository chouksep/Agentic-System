      the asu became effective for us on january 1 , 2018 .


      these amendments will be applied prospectively from the date of adoption .


      the effect of asu 2017-01 will be dependent upon the nature of future acquisitions
      or dispositions that we make , if any .


      in october 2016 , the fasb issued asu 2016-16 , 201cincome taxes ( topic 740
      ) : intra-entity transfers of assets other than inventory . 201d the amendments
      in this update state that an entity should recognize the income tax consequences
      of an intra-entity transfer of an asset other than inventory , such as intellectual
      property and property and equipment , when the transfer occurs .


      we will adopt asu 2016-16 effective january 1 , 2018 with no expected effect
      on our consolidated financial statements .


      in june 2016 , the fasb issued asu 2016-13 , 201cfinancial instruments - credit
      losses ( topic 326 ) : measurement of credit losses on financial instruments
      . 201d the amendments in this update change how companies measure and recognize
      credit impairment for many financial assets .


      the new expected credit loss model will require companies to immediately recognize
      an estimate of credit losses expected to occur over the remaining life of the
      financial assets ( including trade receivables ) that are in the scope of the
      update .


      the update also made amendments to the current impairment model for held-to-maturity
      and available-for-sale debt securities and certain guarantees .


      the guidance will become effective for us on january 1 , 2020 .


      early adoption is permitted for periods beginning on or after january 1 , 2019
      .


      we are evaluating the effect of asu 2016-13 on our consolidated financial statements
      .


      in january 2016 , the fasb issued asu 2016-01 , 201cfinancial instruments -
      overall ( subtopic 825-10 ) : recognition and measurement of financial assets
      and financial liabilities . 201d the amendments in this update address certain
      aspects of recognition , measurement , presentation and disclosure of financial
      instruments .


      the amendments in this update supersede the guidance to classify equity securities
      with readily determinable fair values into different categories ( that is ,
      trading or available-for-sale ) and require equity securities ( including other
      ownership interests , such as partnerships , unincorporated joint ventures and
      limited liability companies ) to be measured at fair value with changes in the
      fair value recognized through earnings .


      equity investments that are accounted for under the equity method of accounting
      or result in consolidation of an investee are not included within the scope
      of this update .


      the amendments allow equity investments that do not have readily determinable
      fair values to be remeasured at fair value either upon the occurrence of an
      observable price change or upon identification of an impairment .


      the amendments also require enhanced disclosures about those investments .


      we will adopt asu 2016-01 effective january 1 , 2018 with no expected effect
      on our consolidated financial statements .


