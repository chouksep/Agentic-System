      of america , n.a. , as administrative agent , and a syndicate of financial institutions
      as lenders and other agents ( as amended from time to time , the 201ccredit
      facility 201d ) .


      as of december 31 , 2018 , the credit facility provided for secured financing
      comprised of ( i ) a $ 1.5 billion revolving credit facility ( the 201crevolving
      credit facility 201d ) ; ( ii ) a $ 1.5 billion term loan ( the 201cterm a loan
      201d ) , ( iii ) a $ 1.37 billion term loan ( the 201cterm a-2 loan 201d ) ,
      ( iv ) a $ 1.14 billion term loan facility ( the 201cterm b-2 loan 201d ) and
      ( v ) a $ 500 million term loan ( the 201cterm b-4 loan 201d ) .


      substantially all of the assets of our domestic subsidiaries are pledged as
      collateral under the credit facility .


      the borrowings outstanding under our credit facility as of december 31 , 2018
      reflect amounts borrowed for acquisitions and other activities we completed
      in 2018 , including a reduction to the interest rate margins applicable to our
      term a loan , term a-2 loan , term b-2 loan and the revolving credit facility
      , an extension of the maturity dates of the term a loan , term a-2 loan and
      the revolving credit facility , and an increase in the total financing capacity
      under the credit facility to approximately $ 5.5 billion in june 2018 .


      in october 2018 , we entered into an additional term loan under the credit facility
      in the amount of $ 500 million ( the 201cterm b-4 loan 201d ) .


      we used the proceeds from the term b-4 loan to pay down a portion of the balance
      outstanding under our revolving credit facility .


      the credit facility provides for an interest rate , at our election , of either
      libor or a base rate , in each case plus a margin .


      as of december 31 , 2018 , the interest rates on the term a loan , the term
      a-2 loan , the term b-2 loan and the term b-4 loan were 4.02% ( 4.02 % ) , 4.01%
      ( 4.01 % ) , 4.27% ( 4.27 % ) and 4.27% ( 4.27 % ) , respectively , and the
      interest rate on the revolving credit facility was 3.92% ( 3.92 % ) .


      in addition , we are required to pay a quarterly commitment fee with respect
      to the unused portion of the revolving credit facility at an applicable rate
      per annum ranging from 0.20% ( 0.20 % ) to 0.30% ( 0.30 % ) depending on our
      leverage ratio .


      the term a loan and the term a-2 loan mature , and the revolving credit facility
      expires , on january 20 , 2023 .


      the term b-2 loan matures on april 22 , 2023 .


      the term b-4 loan matures on october 18 , 2025 .


