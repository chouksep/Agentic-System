      we conduct business globally and file income tax returns in the u.s .


      federal jurisdiction and various state and foreign jurisdictions .


      in the normal course of business , we are subject to examination by taxing authorities
      around the world .


      as a result of events that occurred in the fourth quarter of the year ended
      may 31 , 2015 , management concluded that it was more likely than not that the
      tax positions in a foreign jurisdiction , for which we had recorded estimated
      liabilities of $ 65.6 million in other noncurrent liabilities on our consolidated
      balance sheet , would be sustained on their technical merits based on information
      available as of may 31 , 2015 .


      therefore , the liability and corresponding deferred tax assets were eliminated
      as of may 31 , 2015 .


      the uncertain tax positions have been subject to an ongoing examination in that
      foreign jurisdiction by the tax authority .


      discussions and correspondence between the tax authority and us during the fourth
      quarter indicated that the likelihood of the positions being sustained had increased
      .


      subsequent to may 31 , 2015 , we received a final closure notice regarding the
      examination resulting in no adjustments to taxable income related to this matter
      for the tax returns filed for the periods ended may 31 , 2010 through may 31
      , 2013 .


      the unrecognized tax benefits were effectively settled with this final closure
      notice .


