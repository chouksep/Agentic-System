  - pre_text: 'our initial estimate of fraud losses , fines and other charges on our
      understanding of the rules and operating regulations published by the networks
      and preliminary communications with the networks .


      we have now reached resolution with and made payments to the networks , resulting
      in charges that were less than our initial estimates .


      the primary difference between our initial estimates and the final charges relates
      to lower fraud related costs attributed to this event than previously expected
      .


      the following table reflects the activity in our accrual for fraud losses ,
      fines and other charges for the twelve months ended may 31 , 2013 ( in thousands
      ) : .'
