    post_text: 'software development costs capitalization of software development
      costs for software to be sold , leased , or otherwise marketed begins upon the
      establishment of technological feasibility , which is generally the completion
      of a working prototype that has been certified as having no critical bugs and
      is a release candidate .


      amortization begins once the software is ready for its intended use , generally
      based on the pattern in which the economic benefits will be consumed .


      to date , software development costs incurred between completion of a working
      prototype and general availability of the related product have not been material
      .


      internal use software we capitalize costs associated with customized internal-use
      software systems that have reached the application development stage .


      such capitalized costs include external direct costs utilized in developing
      or obtaining the applications and payroll and payroll-related expenses for employees
      , who are directly associated with the development of the applications .


      capitalization of such costs begins when the preliminary project stage is complete
      and ceases at the point in which the project is substantially complete and is
      ready for its intended purpose .


      income taxes we use the asset and liability method of accounting for income
      taxes .


      under this method , income tax expense is recognized for the amount of taxes
      payable or refundable for the current year .


      in addition , deferred tax assets and liabilities are recognized for expected
      future tax consequences of temporary differences between the financial reporting
      and tax bases of assets and liabilities , and for operating losses and tax credit
      carryforwards .


      we record a valuation allowance to reduce deferred tax assets to an amount for
      which realization is more likely than not .


      taxes collected from customers we net taxes collected from customers against
      those remitted to government authorities in our financial statements .


      accordingly , taxes collected from customers are not reported as revenue. .'
