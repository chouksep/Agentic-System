      at this time , we do not hedge these long-term investment exposures .


      we do not use foreign exchange contracts for speculative trading purposes ,
      nor do we hedge our foreign currency exposure in a manner that entirely offsets
      the effects of changes in foreign exchange rates .


      we regularly review our hedging program and assess the need to utilize financial
      instruments to hedge currency exposures on an ongoing basis .


      cash flow hedging 2014hedges of forecasted foreign currency revenue we may use
      foreign exchange purchased options or forward contracts to hedge foreign currency
      revenue denominated in euros , british pounds and japanese yen .


      we hedge these cash flow exposures to reduce the risk that our earnings and
      cash flows will be adversely affected by changes in exchange rates .


      these foreign exchange contracts , carried at fair value , may have maturities
      between one and twelve months .


      we enter into these foreign exchange contracts to hedge forecasted revenue in
      the normal course of business and accordingly , they are not speculative in
      nature .


      we record changes in the intrinsic value of these cash flow hedges in accumulated
      other comprehensive income ( loss ) until the forecasted transaction occurs
      .


      when the forecasted transaction occurs , we reclassify the related gain or loss
      on the cash flow hedge to revenue .


      in the event the underlying forecasted transaction does not occur , or it becomes
      probable that it will not occur , we reclassify the gain or loss on the related
      cash flow hedge from accumulated other comprehensive income ( loss ) to interest
      and other income , net on our consolidated statements of income at that time
      .


      for the fiscal year ended november 30 , 2018 , there were no net gains or losses
      recognized in other income relating to hedges of forecasted transactions that
      did not occur .


      balance sheet hedging 2014hedging of foreign currency assets and liabilities
      we hedge exposures related to our net recognized foreign currency assets and
      liabilities with foreign exchange forward contracts to reduce the risk that
      our earnings and cash flows will be adversely affected by changes in foreign
      currency exchange rates .


      these foreign exchange contracts are carried at fair value with changes in the
      fair value recorded as interest and other income , net .


      these foreign exchange contracts do not subject us to material balance sheet
      risk due to exchange rate movements because gains and losses on these contracts
      are intended to offset gains and losses on the assets and liabilities being
      hedged .


      at november 30 , 2018 , the outstanding balance sheet hedging derivatives had
      maturities of 180 days or less .


      see note 5 of our notes to consolidated financial statements for information
      regarding our hedging activities .


