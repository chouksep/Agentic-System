  - pre_text: 'a valuation allowance has been established for certain deferred tax
      assets related to the impairment of investments .


      accounting for uncertainty in income taxes during fiscal 2011 and 2010 , our
      aggregate changes in our total gross amount of unrecognized tax benefits are
      summarized as follows ( in thousands ) : beginning balance gross increases in
      unrecognized tax benefits 2013 prior year tax positions gross decreases in unrecognized
      tax benefits 2013 prior year tax positions gross increases in unrecognized tax
      benefits 2013 current year tax positions settlements with taxing authorities
      lapse of statute of limitations foreign exchange gains and losses ending balance
      $ 156925 11901 ( 4154 ) 32420 ( 29101 ) ( 3825 ) $ 163607 $ 218040 ( 7104 )
      15108 ( 70484 ) ( 7896 ) $ 156925 as of december 2 , 2011 , the combined amount
      of accrued interest and penalties related to tax positions taken on our tax
      returns and included in non-current income taxes payable was approximately $
      12.3 million .


      we file income tax returns in the u.s .


      on a federal basis and in many u.s .


      state and foreign jurisdictions .


      we are subject to the continual examination of our income tax returns by the
      irs and other domestic and foreign tax authorities .


      our major tax jurisdictions are the u.s. , ireland and california .


      for california , ireland and the u.s. , the earliest fiscal years open for examination
      are 2005 , 2006 and 2008 , respectively .


      we regularly assess the likelihood of outcomes resulting from these examinations
      to determine the adequacy of our provision for income taxes and have reserved
      for potential adjustments that may result from the current examination .


      we believe such estimates to be reasonable ; however , there can be no assurance
      that the final determination of any of these examinations will not have an adverse
      effect on our operating results and financial position .


      in august 2011 , a canadian income tax examination covering our fiscal years
      2005 through 2008 was completed .


      our accrued tax and interest related to these years was approximately $ 35 million
      and was previously reported in long-term income taxes payable .


      we reclassified approximately $ 17 million to short-term income taxes payable
      and decreased deferred tax assets by approximately $ 18 million in conjunction
      with the aforementioned resolution .


      the $ 17 million balance in short-term income taxes payable is partially secured
      by a letter of credit and is expected to be paid by the first quarter of fiscal
      2012 .


      in october 2010 , a u.s .


      income tax examination covering our fiscal years 2005 through 2007 was completed
      .


      our accrued tax and interest related to these years was $ 59 million and was
      previously reported in long-term income taxes payable .


      we paid $ 20 million in conjunction with the aforementioned resolution .


      a net income statement tax benefit in the fourth quarter of fiscal 2010 of $
      39 million resulted .


      the timing of the resolution of income tax examinations is highly uncertain
      as are the amounts and timing of tax payments that are part of any audit settlement
      process .


      these events could cause large fluctuations in the balance sheet classification
      of current and non-current assets and liabilities .


      the company believes that before the end of fiscal 2012 , it is reasonably possible
      that either certain audits will conclude or statutes of limitations on certain
      income tax examination periods will expire , or both .


      given the uncertainties described above , we can only determine a range of estimated
      potential decreases in underlying unrecognized tax benefits ranging from $ 0
      to approximately $ 40 million .


      these amounts would decrease income tax expense under current gaap related to
      income taxes .


      note 11 .


      restructuring fiscal 2011 restructuring plan in the fourth quarter of fiscal
      2011 , in order to better align our resources around our digital media and digital
      marketing strategies , we initiated a restructuring plan consisting of reductions
      of approximately 700 full-time positions worldwide and we recorded restructuring
      charges of approximately $ 78.6 million related to ongoing termination benefits
      for the position eliminated .


