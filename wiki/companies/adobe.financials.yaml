    post_text: 'software development costs capitalization of software development
      costs for software to be sold , leased , or otherwise marketed begins upon the
      establishment of technological feasibility , which is generally the completion
      of a working prototype that has been certified as having no critical bugs and
      is a release candidate .


      amortization begins once the software is ready for its intended use , generally
      based on the pattern in which the economic benefits will be consumed .


      to date , software development costs incurred between completion of a working
      prototype and general availability of the related product have not been material
      .


      revenue recognition our revenue is derived from the licensing of software products
      , consulting , hosting services and maintenance and support .


      primarily , we recognize revenue when persuasive evidence of an arrangement
      exists , we have delivered the product or performed the service , the fee is
      fixed or determinable and collection is probable. .'
