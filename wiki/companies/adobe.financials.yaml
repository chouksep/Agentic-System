    post_text: 'we occupy three office buildings in san jose , california where our
      corporate headquarters are located .


      we reference these office buildings as the almaden tower and the east and west
      towers .


      in august 2014 , we exercised our option to purchase the east and west towers
      for a total purchase price of $ 143.2 million .


      upon purchase , our investment in the lease receivable of $ 126.8 million was
      credited against the total purchase price and we were no longer required to
      maintain a standby letter of credit as stipulated in the east and west towers
      lease agreement .


      we capitalized the east and west towers as property and equipment on our consolidated
      balance sheets at $ 144.1 million , the lesser of cost or fair value , which
      represented the total purchase price plus other direct costs associated with
      the purchase .


      see note 6 for discussion of our east and west towers purchase .


      the lease agreement for the almaden tower is effective through march 2017 .


      we are the investors in the lease receivable related to the almaden tower lease
      in the amount of $ 80.4 million , which is recorded as investment in lease receivable
      on our consolidated balance sheets .


      as of november 28 , 2014 , the carrying value of the lease receivable related
      to the almaden tower approximated fair value .


      under the agreement for the almaden tower , we have the option to purchase the
      building at any time during the lease term for $ 103.6 million .


      if we purchase the building , the investment in the lease receivable may be
      credited against the purchase price .


      the residual value guarantee under the almaden tower obligation is $ 89.4 million
      .


      the almaden tower lease is subject to standard covenants including certain financial
      ratios that are reported to the lessor quarterly .


      as of november 28 , 2014 , we were in compliance with all of the covenants .


      in the case of a default , the lessor may demand we purchase the building for
      an amount equal to the lease balance , or require that we remarket or relinquish
      the building .


      if we choose to remarket or are required to do so upon relinquishing the building
      , we are bound to arrange the sale of the building to an unrelated party and
      will be required to pay the lessor any shortfall between the net remarketing
      proceeds and the lease balance , up to the residual value guarantee amount less
      our investment in lease receivable .


      the almaden tower lease qualifies for operating lease accounting treatment and
      , as such , the building and the related obligation are not included in our
      consolidated balance sheets .


      see note 16 for discussion of our capital lease obligation .


      unconditional purchase obligations our purchase obligations consist of agreements
      to purchase goods and services entered into in the ordinary course of business.
      .'
