      capitalization of software development costs for software to be sold , leased
      , or otherwise marketed begins upon the establishment of technological feasibility
      , which is generally the completion of a working prototype that has been certified
      as having no critical bugs and is a release candidate .


      amortization begins once the software is ready for its intended use , generally
      based on the pattern in which the economic benefits will be consumed .


      to date , software development costs incurred between completion of a working
      prototype and general availability of the related product have not been material
      .


      internal use software we capitalize costs associated with customized internal-use
      software systems that have reached the application development stage .


      such capitalized costs include external direct costs utilized in developing
      or obtaining the applications and payroll and payroll-related expenses for employees
      , who are directly associated with the development of the applications .


      capitalization of such costs begins when the preliminary project stage is complete
      and ceases at the point in which the project is substantially complete and is
      ready for its intended purpose .


