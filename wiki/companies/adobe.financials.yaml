    post_text: '_________________________________________ ( 1 ) non-deductible for
      tax-purposes .


      identifiable intangible assets 2014customer relationships consist of marketo
      2019s contractual relationships and customer loyalty related to their enterprise
      and commercial customers as well as technology partner relationships .


      the estimated fair value of the customer contracts and relationships was determined
      based on projected cash flows attributable to the asset .


      purchased technology acquired primarily consists of marketo 2019s cloud-based
      engagement marketing software platform .


      the estimated fair value of the purchased technology was determined based on
      the expected future cost savings resulting from ownership of the asset .


      backlog relates to subscription contracts and professional services .


      non-compete agreements include agreements with key marketo employees that preclude
      them from competing against marketo for a period of two years from the acquisition
      date .


      trademarks include the marketo trade name , which is well known in the marketing
      ecosystem .


      we amortize the fair value of these intangible assets on a straight-line basis
      over their respective estimated useful lives .


      goodwill 2014approximately $ 3.46 billion has been allocated to goodwill , and
      has been allocated in full to the digital experience reportable segment .


      goodwill represents the excess of the purchase price over the fair value of
      the underlying acquired net tangible and intangible assets .


      the factors that contributed to the recognition of goodwill included securing
      buyer-specific synergies that increase revenue and profits and are not otherwise
      available to a marketplace participant , acquiring a talented workforce and
      cost savings opportunities .


      net liabilities assumed 2014marketo 2019s tangible assets and liabilities as
      of october 31 , 2018 were reviewed and adjusted to their fair value as necessary
      .


      the net liabilities assumed included , among other items , $ 100.1 million in
      accrued expenses , $ 74.8 million in deferred revenue and $ 182.6 million in
      deferred tax liabilities , which were partially offset by $ 54.9 million in
      cash and cash equivalents and $ 72.4 million in trade receivables acquired .


      deferred revenue 2014included in net liabilities assumed is marketo 2019s deferred
      revenue which represents advance payments from customers related to subscription
      contracts and professional services .


      we estimated our obligation related to the deferred revenue using the cost build-up
      approach .


      the cost build-up approach determines fair value by estimating the direct and
      indirect costs related to supporting the obligation plus an assumed operating
      margin .


      the sum of the costs and assumed operating profit approximates , in theory ,
      the amount that marketo would be required to pay a third party to assume the
      obligation .


      the estimated costs to fulfill the obligation were based on the near-term projected
      cost structure for subscription and professional services .


      as a result , we recorded an adjustment to reduce marketo 2019s carrying value
      of deferred revenue to $ 74.8 million , which represents our estimate of the
      fair value of the contractual obligations assumed based on a preliminary valuation.
      .'
