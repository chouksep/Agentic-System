      stock repurchase program to facilitate our stock repurchase program , designed
      to return value to our stockholders and minimize dilution from stock issuances
      , we repurchase shares in the open market and also enter into structured repurchase
      agreements with third-parties .


      authorization to repurchase shares to cover on-going dilution was not subject
      to expiration .


      however , this repurchase program was limited to covering net dilution from
      stock issuances and was subject to business conditions and cash flow requirements
      as determined by our board of directors from time to time .


      during the third quarter of fiscal 2010 , our board of directors approved an
      amendment to our stock repurchase program authorized in april 2007 from a non-expiring
      share-based authority to a time-constrained dollar-based authority .


      as part of this amendment , the board of directors granted authority to repurchase
      up to $ 1.6 billion in common stock through the end of fiscal 2012 .


      this amended program did not affect the $ 250.0 million structured stock repurchase
      agreement entered into during march 2010 .


      as of december 3 , 2010 , no prepayments remain under that agreement .


      during fiscal 2011 , 2010 and 2009 , we entered into several structured repurchase
      agreements with large financial institutions , whereupon we provided the financial
      institutions with prepayments totaling $ 695.0 million , $ 850.0 million and
      $ 350.0 million , respectively .


      of the $ 850.0 million of prepayments during fiscal 2010 , $ 250.0 million was
      under the stock repurchase program prior to the program amendment and the remaining
      $ 600.0 million was under the amended $ 1.6 billion time-constrained dollar-
      based authority .


      we enter into these agreements in order to take advantage of repurchasing shares
      at a guaranteed discount to the volume weighted average price ( 201cvwap 201d
      ) of our common stock over a specified period of time .


      we only enter into such transactions when the discount that we receive is higher
      than the foregone return on our cash prepayments to the financial institutions
      .


      there were no explicit commissions or fees on these structured repurchases .


      under the terms of the agreements , there is no requirement for the financial
      institutions to return any portion of the prepayment to us .


      the financial institutions agree to deliver shares to us at monthly intervals
      during the contract term .


      the parameters used to calculate the number of shares deliverable are : the
      total notional amount of the contract , the number of trading days in the contract
      , the number of trading days in the interval and the average vwap of our stock
      during the interval less the agreed upon discount .


      during fiscal 2011 , we repurchased approximately 21.8 million shares at an
      average price of $ 31.81 through structured repurchase agreements entered into
      during fiscal 2011 .


      during fiscal 2010 , we repurchased approximately 31.2 million shares at an
      average price of $ 29.19 through structured repurchase agreements entered into
      during fiscal 2009 and fiscal 2010 .


      during fiscal 2009 , we repurchased approximately 15.2 million shares at an
      average price per share of $ 27.89 through structured repurchase agreements
      entered into during fiscal 2008 and fiscal 2009 .


      for fiscal 2011 , 2010 and 2009 , the prepayments were classified as treasury
      stock on our consolidated balance sheets at the payment date , though only shares
      physically delivered to us by december 2 , 2011 , december 3 , 2010 and november
      27 , 2009 were excluded from the computation of earnings per share .


      as of december 2 , 2011 and december 3 , 2010 , no prepayments remained under
      these agreements .


      as of november 27 , 2009 , approximately $ 59.9 million of prepayments remained
      under these agreements .


      subsequent to december 2 , 2011 , as part of our $ 1.6 billion stock repurchase
      program , we entered into a structured stock repurchase agreement with a large
      financial institution whereupon we provided them with a prepayment of $ 80.0
      million .


      this amount will be classified as treasury stock on our consolidated balance
      sheets .


