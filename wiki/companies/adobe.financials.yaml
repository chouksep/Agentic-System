    post_text: 'cost of subscription revenue increased during fiscal 2014 as compared
      to fiscal 2013 primarily due to data center costs , compensation cost and related
      benefits , deprecation expense , and royalty cost .


      data center costs increased as compared with the year-ago period primarily due
      to higher transaction volumes in our adobe marketing cloud and creative cloud
      services .


      compensation cost and related benefits increased as compared to the year-ago
      period primarily due to additional headcount in fiscal 2014 , including from
      our acquisition of neolane in the third quarter of fiscal 2013 .


      depreciation expense increased as compared to the year-ago period primarily
      due to higher capital expenditures in recent periods as we continue to invest
      in our network and data center infrastructure to support the growth of our business
      .


      royalty cost increased primarily due to increases in subscriptions and downloads
      of our saas offerings .


      cost of subscription revenue increased during fiscal 2013 as compared to fiscal
      2012 primarily due to increased hosted server costs and amortization of purchased
      intangibles .


      hosted server costs increased primarily due to increases in data center costs
      related to higher transaction volumes in our adobe marketing cloud and creative
      cloud services , depreciation expense from higher capital expenditures in prior
      years and compensation and related benefits driven by additional headcount .


      amortization of purchased intangibles increased primarily due to increased amortization
      of intangible assets purchased associated with our acquisitions of behance and
      neolane in fiscal 2013 .


      services and support cost of services and support revenue is primarily comprised
      of employee-related costs and associated costs incurred to provide consulting
      services , training and product support .


      cost of services and support revenue increased during fiscal 2014 as compared
      to fiscal 2013 primarily due to increases in compensation and related benefits
      driven by additional headcount and third-party fees related to training and
      consulting services provided to our customers .


      cost of services and support revenue increased during fiscal 2013 as compared
      to fiscal 2012 primarily due to increases in third-party fees related to training
      and consulting services provided to our customers and compensation and related
      benefits driven by additional headcount , including headcount from our acquisition
      of neolane in fiscal 2013. .'
