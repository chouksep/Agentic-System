      basis of presentation the accompanying consolidated financial statements and
      notes thereto have been prepared in accordance with u.s .


      generally accepted accounting principles ( "u.s .


      gaap" ) .


      the consolidated financial statements include the accounts of aon plc and all
      of its controlled subsidiaries ( "aon" or the "company" ) .


      all intercompany accounts and transactions have been eliminated .


      the consolidated financial statements include , in the opinion of management
      , all adjustments necessary to present fairly the company''s consolidated financial
      position , results of operations and cash flows for all periods presented .


      reclassification certain amounts in prior years'' consolidated financial statements
      and related notes have been reclassified to conform to the 2015 presentation
      .


      in prior periods , long-term investments were included in investments in the
      consolidated statement of financial position .


      these amounts are now included in other non-current assets in the consolidated
      statement of financial position , as shown in note 3 to these consolidated financial
      statements .


      long-term investments were $ 135 million at december 31 , 2015 and $ 143 million
      at december 31 , 2014 .


      in prior periods , prepaid pensions were included in other non-current assets
      in the consolidated statement of financial position .


      these amounts are now separately disclosed in the consolidated statement of
      financial position .


      prepaid pensions were $ 1033 million at december 31 , 2015 and $ 933 million
      at december 31 , 2014 .


      upon vesting of certain share-based payment arrangements , employees may elect
      to use a portion of the shares to satisfy tax withholding requirements , in
      which case aon makes a payment to the taxing authority on the employee 2019s
      behalf and remits the remaining shares to the employee .


      the company has historically presented amounts due to taxing authorities within
      cash flows from operating activities in the consolidated statements of cash
      flows .


      the amounts are now included in 201cissuance of shares for employee benefit
      plans 201d within cash flows from financing activities .


      the company believes this presentation provides greater clarity into the operating
