      planning design , executive reward strategies , salary survey and benchmarking
      , market share studies and sales force effectiveness , with special expertise
      in the financial services and technology industries .


      2022 strategic human capital delivers advice to complex global organizations
      on talent , change and organizational effectiveness issues , including talent
      strategy and acquisition , executive on-boarding , performance management ,
      leadership assessment and development , communication strategy , workforce training
      and change management .


      outsourcing services : 2022 benefits outsourcing applies our hr expertise primarily
      through defined benefit ( pension ) , defined contribution ( 401 ( k ) ) , and
      health and welfare administrative services .


      our model replaces the resource-intensive processes once required to administer
      benefit plans with more efficient , effective , and less costly solutions .


      2022 human resource business processing outsourcing ( 2018 2018hr bpo 2019 2019
      ) provides market-leading solutions to manage employee data ; administer benefits
      , payroll and other human resources processes ; and record and manage talent
      , workforce and other core hr process transactions as well as other complementary
      services such as absence management , flexible spending , dependent audit and
      participant advocacy .


      beginning in late 2008 , the disruption in the global credit markets and the
