    post_text: 'impact of foreign currency exchange rate fluctuations we conduct business
      in more than 120 countries and sovereignties and , because of this , foreign
      currency exchange rate fluctuations have a significant impact on our business
      .


      foreign currency exchange rate movements may be significant and may distort
      true period-to-period comparisons of changes in revenue or pretax income .


      therefore , to give financial statement users meaningful information about our
      operations , we have provided an illustration of the impact of foreign currency
      exchange rate fluctuations on our financial results .


      the methodology used to calculate this impact isolates the impact of the change
      in currencies between periods by translating the prior year 2019s revenue ,
      expenses , and net income using the current year 2019s foreign currency exchange
      rates .


      translating prior year results at current year foreign currency exchange rates
      , currency fluctuations had a $ 0.08 favorable impact on net income per diluted
      share during the year ended december 31 , 2018 .


      currency fluctuations had a $ 0.12 favorable impact on net income per diluted
      share during the year ended december 31 , 2017 , when 2016 results were translated
      at 2017 rates .


      currency fluctuations had no impact on net income per diluted share during the
      year ended december 31 , 2016 , when 2015 results were translated at 2016 rates
      .


      translating prior year results at current year foreign currency exchange rates
      , currency fluctuations had a $ 0.09 favorable impact on adjusted net income
      per diluted share during the year ended december 31 , 2018 .


      currency fluctuations had a $ 0.08 favorable impact on adjusted net income per
      diluted share during the year ended december 31 , 2017 , when 2016 results were
      translated at 2017 rates .


      currency fluctuations had a $ 0.04 unfavorable impact on adjusted net income
      per diluted share during the year ended december 31 , 2016 , when 2015 results
      were translated at 2016 rates .


      these translations are performed for comparative purposes only and do not impact
      the accounting policies or practices for amounts included in the financial statements
      .


      competition and markets authority the u.k . 2019s competition regulator , the
      competition and markets authority ( the 201ccma 201d ) , conducted a market
      investigation into the supply and acquisition of investment consulting and fiduciary
      management services , including those offered by aon and its competitors in
      the u.k. , to assess whether any feature or combination of features in the target
      market prevents , restricts , or distorts competition .


      the cma issued a final report on december 12 , 2018 .


      the cma will draft a series of orders that will set out the detailed remedies
      , expected in first quarter of 2019 , when they will be subject to further public
      consultation .


      we do not anticipate the remedies to have a significant impact on the company
      2019s consolidated financial position or business .


      financial conduct authority the fca is conducting a market study to assess how
      effectively competition is working in the wholesale insurance broker sector
      in the u.k .


      in which aon , through its subsidiaries , participates .


      the fca has indicated that the purpose of a market study is to assess the extent
      to which the market is working well in the interests of customers and to identify
      features of the market that may impact competition .


      depending on the study 2019s findings , the fca may require remedies in order
      to correct any features found .'
