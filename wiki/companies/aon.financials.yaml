      the maximum contractual term on stock options is generally ten years from the
      date of grant .


      aon uses a lattice-binomial option-pricing model to value stock options .


      lattice-based option valuation models use a range of assumptions over the expected
      term of the options .


      expected volatilities are based on the average of the historical volatility
      of aon 2019s stock price and the implied volatility of traded options and aon
      2019s stock .


      the valuation model stratifies employees between those receiving lpp options
      , special stock plan ( 2018 2018ssp 2019 2019 ) options , and all other option
      grants .


      the company believes that this stratification better represents prospective
      stock option exercise patterns .


      the expected dividend yield assumption is based on the company 2019s historical
      and expected future dividend rate .


      the risk-free rate for periods within the contractual life of the option is
      based on the u.s .


      treasury yield curve in effect at the time of grant .


      the expected life of employee stock options represents the weighted-average
      period stock options are expected to remain outstanding and is a derived output
      of the lattice-binomial model. .'
