      the prolonged economic downturn is adversely impacting our clients 2019 financial
      condition and therefore the levels of business activities in the industries
      and geographies where we operate .


      while we believe that the majority of our practices are well positioned to manage
      through this time , these challenges are reducing demand for some of our services
      and putting .'
