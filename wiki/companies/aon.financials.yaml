    post_text: 'use of estimates the preparation of the accompanying consolidated
      financial statements in conformity with u.s .


      gaap requires management to make estimates and assumptions that affect the reported
      amounts of assets and liabilities , disclosures of contingent assets and liabilities
      at the date of the financial statements , and the reported amounts of reserves
      and expenses .


      these estimates and assumptions are based on management''s best estimates and
      judgments .


      management evaluates its estimates and assumptions on an ongoing basis using
      historical experience and other factors , including the current economic environment
      .


      management believes its estimates to be reasonable given the current facts available
      .


      aon adjusts such estimates and assumptions when facts and circumstances dictate
      .


      illiquid credit markets , volatile equity markets , and foreign currency exchange
      rate movements increase the uncertainty inherent in such estimates and assumptions
      .


      as future events and their effects cannot be determined , among other factors
      , with precision , actual results could differ significantly from these estimates
      .


      changes in estimates resulting from continuing changes in the economic environment
      would , if applicable , be reflected in the financial statements in future periods.
      .'
