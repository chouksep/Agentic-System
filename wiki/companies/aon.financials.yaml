      pension plans we use a market-related valuation of assets approach to determine
      the expected return on assets , which is a component of net periodic benefit
      cost recognized in the consolidated statements of income .


      this approach recognizes 20% ( 20 % ) of any gains or losses in the current
      year''s value of market-related assets , with the remaining 80% ( 80 % ) spread
      over the next four years .


      as this approach recognizes gains or losses over a five-year period , the future
      value of assets and therefore , our net periodic benefit cost will be impacted
      as previously deferred gains or losses are recorded .


