    post_text: 'the demand for property and casualty insurance generally rises as
      the overall level of economic activity increases and generally falls as such
      activity decreases , affecting both the commissions and fees generated by our
      brokerage business .


      the economic activity that impacts property and casualty insurance is described
      as exposure units , and is most closely correlated with employment levels ,
      corporate revenue and asset values .


      during 2014 , pricing was flat on average globally , and we would still consider
      this to be a "soft market." in a soft market , premium rates flatten or decrease
      , along with commission revenues , due to increased competition for market share
      among insurance carriers or increased underwriting capacity .


      changes in premiums have a direct and potentially material impact on the insurance
      brokerage industry , as commission revenues are generally based on a percentage
      of the premiums paid by insureds .


      additionally , continuing through 2014 , we faced difficult conditions as a
      result of continued weakness in the global economy , the repricing of credit
      risk and the deterioration of the financial markets .


      weak economic conditions in many markets around the globe have reduced our customers''
      demand for our retail brokerage and reinsurance brokerage products , which have
      had a negative impact on our operational results .


      risk solutions generated approximately 65% ( 65 % ) of our consolidated total
      revenues in 2014 .


      revenues are generated primarily through fees paid by clients , commissions
      and fees paid by insurance and reinsurance companies , and investment income
      on funds held on behalf of clients .


      our revenues vary from quarter to quarter throughout the year as a result of
      the timing of our clients'' policy renewals , the net effect of new and lost
      business , the timing of services provided to our clients , and the income we
      earn on investments , which is heavily influenced by short-term interest rates
      .


      we operate in a highly competitive industry and compete with many retail insurance
      brokerage and agency firms , as well as with individual brokers , agents , and
      direct writers of insurance coverage .


      specifically , we address the highly specialized .'
