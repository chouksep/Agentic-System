    post_text: 'as of december 31 , 2009 , $ 61 million of unrecognized tax benefits
      would impact the effective tax rate if recognized .


      aon does not expect the unrecognized tax positions to change significantly over
      the next twelve months .


      the company recognizes penalties and interest related to unrecognized income
      tax benefits in its provision for income taxes .


      aon accrued potential penalties of less than $ 1 million during each of 2009
      , 2008 and 2007 .


      aon accrued interest of $ 2 million during 2009 and less than $ 1 million during
      both 2008 and 2007 .


      as of december 31 , 2009 and 2008 , aon has recorded a liability for penalties
      of $ 5 million and $ 4 million , respectively , and for interest of $ 18 million
      and $ 14 million , respectively .


      aon and its subsidiaries file income tax returns in the u.s .


