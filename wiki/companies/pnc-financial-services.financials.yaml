      market risk management 2013 customer-related trading risk we engage in fixed
      income securities , derivatives and foreign exchange transactions to support
      our customers 2019 investing and hedging activities .


      these transactions , related hedges and the credit valuation adjustment ( cva
      ) related to our customer derivatives portfolio are marked-to-market on a daily
      basis and reported as customer-related trading activities .


      we do not engage in proprietary trading of these products .


      we use value-at-risk ( var ) as the primary means to measure and monitor market
      risk in customer-related trading activities .


      we calculate a diversified var at a 95% ( 95 % ) confidence interval .


      var is used to estimate the probability of portfolio losses based on the statistical
      analysis of historical market risk factors .


      a diversified var reflects empirical correlations across different asset classes
      .


      during 2013 , our 95% ( 95 % ) var ranged between $ 1.7 million and $ 5.5 million
      , averaging $ 3.5 million .


      during 2012 , our 95% ( 95 % ) var ranged between $ 1.1 million and $ 5.3 million
      , averaging $ 3.2 million .


      to help ensure the integrity of the models used to calculate var for each portfolio
      and enterprise-wide , we use a process known as backtesting .


      the backtesting process consists of comparing actual observations of gains or
      losses against the var levels that were calculated at the close of the prior
      day .


      this assumes that market exposures remain constant throughout the day and that
      recent historical market variability is a good predictor of future variability
      .


      our customer-related trading activity includes customer revenue and intraday
      hedging which helps to reduce losses , and may reduce the number of instances
      of actual losses exceeding the prior day var measure .


      there was one such instance during 2013 under our diversified var measure where
      actual losses exceeded the prior day var measure .


      in comparison , there were two such instances during 2012 .


      we use a 500 day look back period for backtesting and include customer-related
      revenue .


