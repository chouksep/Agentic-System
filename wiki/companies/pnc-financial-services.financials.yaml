      , delinquency status , improving economic conditions , realization of previously
      estimated losses through charge-offs and overall portfolio growth , combined
      to result in reducing the estimated credit losses within the portfolio .


      as a result , the alll balance declined $ 311 million , or 7% ( 7 % ) , to $
      4.0 billion during the year ended december 31 , 2012 .


      see note 7 allowances for loan and lease losses and unfunded loan commitments
      and letters of credit and note 6 purchased loans in the notes to consolidated
      financial statements in item 8 of this report regarding changes in the alll
      and in the allowance for unfunded loan commitments and letters of credit .


      credit default swaps from a credit risk management perspective , we use credit
      default swaps ( cds ) as a tool to manage risk concentrations in the credit
      portfolio .


      that risk management could come from protection purchased or sold in the form
      of single name or index products .


      when we buy loss protection by purchasing a cds , we pay a fee to the seller
      , or cds counterparty , in return for the right to receive a payment if a specified
      credit event occurs for a particular obligor or reference entity .


      when we sell protection , we receive a cds premium from the buyer in return
      for pnc 2019s obligation to pay the buyer if a specified credit event occurs
      for a particular obligor or reference entity .


      we evaluate the counterparty credit worthiness for all our cds activities .


      counterparty creditworthiness is approved based on a review of credit quality
      in accordance with our traditional credit quality standards and credit policies
      .


      the credit risk of our counterparties is monitored in the normal course of business
      .


      in addition , all counterparty credit lines are subject to collateral thresholds
      and exposures above these thresholds are secured .


      cdss are included in the 201cderivatives not designated as hedging instruments
      under gaap 201d section of table 54 : financial derivatives summary in the financial
      derivatives section of this risk management discussion .


