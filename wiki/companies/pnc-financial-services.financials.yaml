    post_text: 'commitments to extend credit , or net unfunded loan commitments ,
      represent arrangements to lend funds or provide liquidity subject to specified
      contractual conditions .


      these commitments generally have fixed expiration dates , may require payment
      of a fee , and contain termination clauses in the event the customer 2019s credit
      quality deteriorates .


      net outstanding standby letters of credit we issue standby letters of credit
      and share in the risk of standby letters of credit issued by other financial
      institutions , in each case to support obligations of our customers to third
      parties , such as insurance requirements and the facilitation of transactions
      involving capital markets product execution .


      approximately 91% ( 91 % ) and 94% ( 94 % ) of our net outstanding standby letters
      of credit were rated as pass as of december 31 , 2017 and december 31 , 2016
      , respectively , with the remainder rated as below pass .


      an internal credit rating of pass indicates the expected risk of loss is currently
      low , while a rating of below pass indicates a higher degree of risk .


      if the customer fails to meet its financial or performance obligation to the
      third party under the terms of the contract or there is a need to support a
      remarketing program , then upon a draw by a beneficiary , subject to the terms
      of the letter of credit , we would be obligated to make payment to them .


      the standby letters of credit outstanding on december 31 , 2017 had terms ranging
      from less than one year to seven years .


      as of december 31 , 2017 , assets of $ 1.3 billion secured certain specifically
      identified standby letters of credit .


      in addition , a portion of the remaining standby letters of credit issued on
      behalf of specific customers is also secured by collateral or guarantees that
      secure the customers 2019 other obligations to us .


      the carrying amount of the liability for our obligations related to standby
      letters of credit and participations in standby letters of credit was $ .2 billion
      at december 31 , 2017 and is included in other liabilities on our consolidated
      balance sheet. .'
