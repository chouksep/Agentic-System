  - pre_text: 'consolidated income statement review net income for 2009 was $ 2.4
      billion and for 2008 was $ 914 million .


      amounts for 2009 include operating results of national city and the fourth quarter
      impact of a $ 687 million after-tax gain related to blackrock 2019s acquisition
      of bgi .


      increases in income statement comparisons to 2008 , except as noted , are primarily
      due to the operating results of national city .


      our consolidated income statement is presented in item 8 of this report .


      net interest income and net interest margin year ended december 31 dollars in
      millions 2009 2008 .'
