      derivatives designated as hedging instruments under gaap certain derivatives
      used to manage interest rate and foreign exchange risk as part of our asset
      and liability risk management activities are designated as accounting hedges
      under gaap .


      derivatives hedging the risks associated with changes in the fair value of assets
      or liabilities are considered fair value hedges , derivatives hedging the variability
      of expected future cash flows are considered cash flow hedges , and derivatives
