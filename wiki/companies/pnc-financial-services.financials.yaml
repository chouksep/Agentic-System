      generally , when a borrower becomes 60 days past due , we terminate borrowing
      privileges and those privileges are not subsequently reinstated .


      at that point , we continue our collection/recovery processes , which may include
      a loss mitigation loan modification resulting in a loan that is classified as
      a tdr .


      see note 5 asset quality in the notes to consolidated financial statements in
      item 8 of this report for additional information .


      loan modifications and troubled debt restructurings consumer loan modifications
      we modify loans under government and pnc-developed programs based upon our commitment
      to help eligible homeowners and borrowers avoid foreclosure , where appropriate
      .


      initially , a borrower is evaluated for a modification under a government program
      .


      if a borrower does not qualify under a government program , the borrower is
      then evaluated under a pnc program .


      our programs utilize both temporary and permanent modifications and typically
      reduce the interest rate , extend the term and/or defer principal .


      temporary and permanent modifications under programs involving a change to loan
      terms are generally classified as tdrs .


      further , certain payment plans and trial payment arrangements which do not
      include a contractual change to loan terms may be classified as tdrs .


      additional detail on tdrs is discussed below as well as in note 5 asset quality
      in the notes to consolidated financial statements in item 8 of this report .


      a temporary modification , with a term between 3 and 24 months , involves a
      change in original loan terms for a period of time and reverts to a calculated
      exit rate for the remaining term of the loan as of a specific date .


      a permanent modification , with a term greater than 24 months , is a modification
      in which the terms of the original loan are changed .


      permanent modifications primarily include the government-created home affordable
      modification program ( hamp ) or pnc-developed hamp-like modification programs
      .


      for home equity lines of credit , we will enter into a temporary modification
      when the borrower has indicated a temporary hardship and a willingness to bring
      current the delinquent loan balance .


      examples of this situation often include delinquency due to illness or death
      in the family or loss of employment .


      permanent modifications are entered into when it is confirmed that the borrower
      does not possess the income necessary to continue making loan payments at the
      current amount , but our expectation is that payments at lower amounts can be
      made .


      we also monitor the success rates and delinquency status of our loan modification
      programs to assess their effectiveness in serving our customers 2019 needs while
      mitigating credit losses .


      table 42 provides the number of accounts and unpaid principal balance of modified
      consumer real estate related loans and table 43 provides the number of accounts
      and unpaid principal balance of modified loans that were 60 days or more past
      due as of six months , nine months , twelve months and fifteen months after
      the modification date .


