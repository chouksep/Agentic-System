    post_text: '( a ) the impact is the effect of changing the specified assumption
      while holding all other assumptions constant .


      we currently estimate a pretax pension expense of $ 41 million in 2010 compared
      with pretax expense of $ 117 million in 2009 .


      this year-over-year reduction was primarily due to the amortization impact of
      the favorable 2009 investment returns as compared with the expected long-term
      return assumption .


      our pension plan contribution requirements are not particularly sensitive to
      actuarial assumptions .


      investment performance has the most impact on contribution requirements and
      will drive the amount of permitted contributions in future years .


      also , current law , including the provisions of the pension protection act
      of 2006 , sets limits as to both minimum and maximum contributions to the plan
      .


      we expect that the minimum required contributions under the law will be zero
      for 2010 .


      we maintain other defined benefit plans that have a less significant effect
