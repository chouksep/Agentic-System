  - pre_text: '60 the pnc financial services group , inc .


      2013 form 10-k liquidity and capital management liquidity risk has two fundamental
      components .


      the first is potential loss assuming we were unable to meet our funding requirements
      at a reasonable cost .


      the second is the potential inability to operate our businesses because adequate
      contingent liquidity is not available .


      we manage liquidity risk at the consolidated company level ( bank , parent company
      , and nonbank subsidiaries combined ) to help ensure that we can obtain cost-effective
      funding to meet current and future obligations under both normal 201cbusiness
      as usual 201d and stressful circumstances , and to help ensure that we maintain
      an appropriate level of contingent liquidity .


      management monitors liquidity through a series of early warning indicators that
      may indicate a potential market , or pnc-specific , liquidity stress event .


      in addition , management performs a set of liquidity stress tests over multiple
      time horizons with varying levels of severity and maintains a contingency funding
      plan to address a potential liquidity stress event .


      in the most severe liquidity stress simulation , we assume that our liquidity
      position is under pressure , while the market in general is under systemic pressure
      .


      the simulation considers , among other things , the impact of restricted access
      to both secured and unsecured external sources of funding , accelerated run-off
      of customer deposits , valuation pressure on assets and heavy demand to fund
      committed obligations .


      parent company liquidity guidelines are designed to help ensure that sufficient
      liquidity is available to meet our parent company obligations over the succeeding
      24-month period .


      liquidity-related risk limits are established within our enterprise liquidity
      management policy and supporting policies .


      management committees , including the asset and liability committee , and the
      board of directors and its risk committee regularly review compliance with key
      established limits .


      in addition to these liquidity monitoring measures and tools described above
      , we also monitor our liquidity by reference to the liquidity coverage ratio
      ( lcr ) which is further described in the supervision and regulation section
      in item 1 of this report .


      pnc and pnc bank calculate the lcr on a daily basis and as of december 31 ,
      2017 , the lcr for pnc and pnc bank exceeded the fully phased-in requirement
      of we provide additional information regarding regulatory liquidity requirements
      and their potential impact on us in the supervision and regulation section of
      item 1 business and item 1a risk factors of this report .


      sources of liquidity our largest source of liquidity on a consolidated basis
      is the customer deposit base generated by our banking businesses .


      these deposits provide relatively stable and low-cost funding .


      total deposits increased to $ 265.1 billion at december 31 , 2017 from $ 257.2
      billion at december 31 , 2016 , driven by higher consumer and commercial deposits
      .


      consumer deposits reflected in part a shift from money market deposits to relationship-based
      savings products .


      commercial deposits reflected a shift from demand deposits to money market deposits
      primarily due to higher interest rates in 2017 .


      additionally , certain assets determined by us to be liquid and unused borrowing
      capacity from a number of sources are also available to manage our liquidity
      position .


      at december 31 , 2017 , our liquid assets consisted of short- term investments
      ( federal funds sold , resale agreements , trading securities and interest-earning
      deposits with banks ) totaling $ 33.0 billion and securities available for sale
      totaling $ 57.6 billion .


      the level of liquid assets fluctuates over time based on many factors , including
      market conditions , loan and deposit growth and balance sheet management activities
      .


      of our total liquid assets of $ 90.6 billion , we had $ 3.2 billion of securities
      available for sale and trading securities pledged as collateral to secure public
      and trust deposits , repurchase agreements and for other purposes .


      in addition , $ 4.9 billion of securities held to maturity were also pledged
      as collateral for these purposes .


      we also obtain liquidity through various forms of funding , including long-term
      debt ( senior notes , subordinated debt and fhlb advances ) and short-term borrowings
      ( securities sold under repurchase agreements , commercial paper and other short-term
      borrowings ) .


      see note 10 borrowed funds and the funding sources section of the consolidated
      balance sheet review in this report for additional information related to our
      borrowings .


      total senior and subordinated debt , on a consolidated basis , increased due
      to the following activity : table 25 : senior and subordinated debt .'
