      months of performance under the restructured terms and are excluded from nonperforming
      loans .


      loans where borrowers have been discharged from personal liability through chapter
      7 bankruptcy and have not formally reaffirmed their loan obligations to pnc
      and loans to borrowers not currently obligated to make both principal and interest
      payments under the restructured terms are not returned to accrual status .


      table 68 quantifies the number of loans that were classified as tdrs as well
      as the change in the recorded investments as a result of the tdr classification
      during 2014 , 2013 , and 2012 , respectively .


      additionally , the table provides information about the types of tdr concessions
      .


      the principal forgiveness tdr category includes principal forgiveness and accrued
      interest forgiveness .


      these types of tdrs result in a write down of the recorded investment and a
      charge-off if such action has not already taken place .


      the rate reduction tdr category includes reduced interest rate and interest
      deferral .


      the tdrs within this category result in reductions to future interest income
      .


      the other tdr category primarily includes consumer borrowers that have been
      discharged from personal liability through chapter 7 bankruptcy and have not
      formally reaffirmed their loan obligations to pnc , as well as postponement/reduction
      of scheduled amortization and contractual extensions for both consumer and commercial
      borrowers .


      in some cases , there have been multiple concessions granted on one loan .


      this is most common within the commercial loan portfolio .


      when there have been multiple concessions granted in the commercial loan portfolio
      , the principal forgiveness concession was prioritized for purposes of determining
      the inclusion in table 68 .


      for example , if there is principal forgiveness in conjunction with lower interest
      rate and postponement of amortization , the type of concession will be reported
      as principal forgiveness .


      second in priority would be rate reduction .


      for example , if there is an interest rate reduction in conjunction with postponement
      of amortization , the type of concession will be reported as a rate reduction
      .


      in the event that multiple concessions are granted on a consumer loan , concessions
      resulting from discharge from personal liability through chapter 7 bankruptcy
      without formal affirmation of the loan obligations to pnc would be prioritized
      and included in the other type of concession in the table below .


      after that , consumer loan concessions would follow the previously discussed
      priority of concessions for the commercial loan portfolio .


