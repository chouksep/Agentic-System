  - pre_text: 'bank holding companies and banks must have basel i capital ratios of
      at least 6% ( 6 % ) for tier 1 risk-based , 10% ( 10 % ) for total risk- based
      , and 5% ( 5 % ) for leverage .


      the basel ii framework , which was adopted by the basel committee on banking
      supervision in 2004 , seeks to provide more risk-sensitive regulatory capital
      calculations and promote enhanced risk management practices among large , internationally
      active banking organizations .


      the u.s .


      banking agencies initially adopted rules to implement the basel ii capital framework
      in 2004 .


      in july 2013 , the u.s .


      banking agencies adopted final rules ( referred to as the advanced approaches
      ) that modified the basel ii framework effective january 1 , 2014 .


      see item 1 business 2013 supervision and regulation and item 1a risk factors
      in this report .


      prior to fully implementing the advanced approaches established by these rules
      to calculate risk-weighted assets , pnc and pnc bank , n.a .


      must successfully complete a 201cparallel run 201d qualification phase .


      both pnc and pnc bank , n.a .


      entered this parallel run phase under the basel ii capital framework on january
      1 , 2013 .


      this phase must last at least four consecutive quarters , although , consistent
      with the experience of other u.s .


      banks , we currently anticipate a multi-year parallel run period .


      in july 2013 , the u.s .


      banking agencies also adopted final rules that : ( i ) materially modify the
      definition of , and required deductions from , regulatory capital ( referred
      to as the basel iii rule ) ; and ( ii ) revise the framework for the risk-weighting
      of assets under basel i ( referred to as the standardized approach ) .


      the basel iii rule became effective for pnc on january 1 , 2014 , although many
      of its provisions are phased-in over a period of years , with the rules generally
      becoming fully effective on january 1 , 2019 .


      the standardized approach rule becomes effective on january 1 , 2015 .


      tier 1 common capital as defined under the basel iii rule differs materially
      from basel i .


      for example , under basel iii , significant common stock investments in unconsolidated
      financial institutions , mortgage servicing rights and deferred tax assets must
      be deducted from capital to the extent they individually exceed 10% ( 10 % )
      , or in the aggregate exceed 15% ( 15 % ) , of the institution 2019s adjusted
      tier 1 common capital .


      also , basel i regulatory capital excludes other comprehensive income related
      to both available for sale securities and pension and other postretirement plans
      , whereas under basel iii these items are a component of pnc 2019s capital .


      the basel iii final rule also eliminates the tier 1 treatment of trust preferred
      securities for bank holding companies with $ 15 billion or more in assets .


      in the third quarter of 2013 , we concluded our redemptions of the discounted
      trust preferred securities assumed through acquisitions .


      see item 1 business- supervision and regulation and note 14 capital securities
      of subsidiary trusts and perpetual trust securities in the notes to consolidated
      financial statements in item 8 of this report for additional discussion of our
      previous redemptions of trust preferred securities .


      we provide information below regarding pnc 2019s pro forma fully phased-in basel
      iii tier 1 common capital ratio under both the advanced approaches and standardized
      approach frameworks and how it differs from the basel i tier 1 common capital
      ratios shown in table 18 above .


      after pnc exits parallel run , its regulatory basel iii risk-based capital ratios
      will be the lower of the ratios as calculated under the standardized and advanced
      approaches .


