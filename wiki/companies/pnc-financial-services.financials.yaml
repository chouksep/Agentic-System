      stock/share unit awards is initially determined based on prices not less than
      the market value of our common stock on the date of grant .


      the value of certain incentive/performance unit share awards is subsequently
      remeasured based on the achievement of one or more financial and other performance
      goals .


      the personnel and compensation committee ( 201cp&cc 201d ) of the board of directors
      approves the final award payout with respect to certain incentive/performance
      unit share awards .


      these awards have either a three-year or a four-year performance period and
      are payable in either stock or a combination of stock and cash .


      restricted stock/share unit awards have various vesting periods generally ranging
      from 3 years to 5 years .


      beginning in 2013 , we incorporated several enhanced risk- related performance
      changes to certain long-term incentive compensation programs .


      in addition to achieving certain financial performance metrics on both an absolute
      basis and relative to our peers , final payout amounts will be subject to reduction
