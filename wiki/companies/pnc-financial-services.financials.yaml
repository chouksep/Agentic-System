      the total intrinsic value of options exercised during 2014 , 2013 and 2012 was
      $ 90 million , $ 86 million and $ 37 million , respectively .


      cash received from option exercises under all incentive plans for 2014 , 2013
      and 2012 was approximately $ 215 million , $ 208 million and $ 118 million ,
      respectively .


      the tax benefit realized from option exercises under all incentive plans for
      2014 , 2013 and 2012 was approximately $ 33 million , $ 31 million and $ 14
      million , respectively .


      shares of common stock available during the next year for the granting of options
      and other awards under the incentive plans were 17997353 at december 31 , 2014
      .


      total shares of pnc common stock authorized for future issuance under equity
      compensation plans totaled 19017057 shares at december 31 , 2014 , which includes
      shares available for issuance under the incentive plans and the employee stock
      purchase plan ( espp ) as described below .


      during 2014 , we issued approximately 2.4 million shares from treasury stock
      in connection with stock option exercise activity .


      as with past exercise activity , we currently intend to utilize primarily treasury
      stock for any future stock option exercises .


      awards granted to non-employee directors in 2014 , 2013 and 2012 include 21490
      , 27076 and 25620 deferred stock units , respectively , awarded under the outside
      directors deferred stock unit plan .


      a deferred stock unit is a phantom share of our common stock , which is accounted
      for as a liability until such awards are paid to the participants in cash .


      as there are no vesting or service requirements on these awards , total compensation
      expense is recognized in full for these awards on the date of grant .


      incentive/performance unit share awards and restricted stock/share unit awards
