      proceedings in which claims for monetary damages and other relief are asserted
      .


      we do not anticipate , at the present time , that the ultimate aggregate liability
      , if any , arising out of such other legal proceedings will have a material
      adverse effect on our financial position .


      however , we cannot now determine whether or not any claims asserted against
      us or others to whom we may have indemnification obligations , whether in the
