  - pre_text: 'corporate & institutional banking corporate & institutional banking
      earned $ 1.9 billion in 2011 and $ 1.8 billion in 2010 .


      the increase in earnings was primarily due to an improvement in the provision
      for credit losses , which was a benefit in 2011 , partially offset by a reduction
      in the value of commercial mortgage servicing rights and lower net interest
      income .


      we continued to focus on adding new clients , increasing cross sales , and remaining
      committed to strong expense discipline .


      asset management group asset management group earned $ 141 million for 2011
      compared with $ 137 million for 2010 .


      assets under administration were $ 210 billion at december 31 , 2011 and $ 212
      billion at december 31 , 2010 .


      earnings for 2011 reflected a benefit from the provision for credit losses and
      growth in noninterest income , partially offset by higher noninterest expense
      and lower net interest income .


      for 2011 , the business delivered strong sales production , grew high value
      clients and benefitted from significant referrals from other pnc lines of business
      .


      over time and with stabilized market conditions , the successful execution of
      these strategies and the accumulation of our strong sales performance are expected
      to create meaningful growth in assets under management and noninterest income
      .


      residential mortgage banking residential mortgage banking earned $ 87 million
      in 2011 compared with $ 269 million in 2010 .


      the decline in earnings was driven by an increase in noninterest expense associated
      with increased costs for residential mortgage foreclosure- related expenses
      , primarily as a result of ongoing governmental matters , and lower net interest
      income , partially offset by an increase in loan originations and higher loans
      sales revenue .


      blackrock our blackrock business segment earned $ 361 million in 2011 and $
      351 million in 2010 .


      the higher business segment earnings from blackrock for 2011 compared with 2010
      were primarily due to an increase in revenue .


      non-strategic assets portfolio this business segment ( formerly distressed assets
      portfolio ) consists primarily of acquired non-strategic assets that fall outside
      of our core business strategy .


      non-strategic assets portfolio had earnings of $ 200 million in 2011 compared
      with a loss of $ 57 million in 2010 .


      the increase was primarily attributable to a lower provision for credit losses
      partially offset by lower net interest income .


      201cother 201d reported earnings of $ 376 million for 2011 compared with earnings
      of $ 386 million for 2010 .


      the decrease in earnings primarily reflected the noncash charge related to the
      redemption of trust preferred securities in the fourth quarter of 2011 and the
      gain related to the sale of a portion of pnc 2019s blackrock shares in 2010
      partially offset by lower integration costs in 2011 .


      consolidated income statement review our consolidated income statement is presented
      in item 8 of this report .


      net income for 2011 was $ 3.1 billion compared with $ 3.4 billion for 2010 .


      results for 2011 include the impact of $ 324 million of residential mortgage
      foreclosure-related expenses primarily as a result of ongoing governmental matters
      , a $ 198 million noncash charge related to redemption of trust preferred securities
      and $ 42 million for integration costs .


      results for 2010 included the $ 328 million after-tax gain on our sale of gis
      , $ 387 million for integration costs , and $ 71 million of residential mortgage
      foreclosure-related expenses .


      for 2010 , net income attributable to common shareholders was also impacted
      by a noncash reduction of $ 250 million in connection with the redemption of
      tarp preferred stock .


      pnc 2019s results for 2011 were driven by good performance in a challenging
      environment of low interest rates , slow economic growth and new regulations
      .


