      generally , when a borrower becomes 60 days past due , we terminate borrowing
      privileges and those privileges are not subsequently reinstated .


      at that point , we continue our collection/recovery processes , which may include
      loan modification resulting in a loan that is classified as a tdr .


      auto loan portfolio the auto loan portfolio totaled $ 12.4 billion as of december
      31 , 2016 , or 6% ( 6 % ) of our total loan portfolio .


      of that total , $ 10.8 billion resides in the indirect auto portfolio , $ 1.3
      billion in the direct auto portfolio , and $ .3 billion in acquired or securitized
      portfolios , which has been declining as no pools have been recently acquired
      .


      indirect auto loan applications are generated from franchised automobile dealers
      .


      this business is strategically aligned with our core retail business .


      we have elected not to pursue non-prime auto lending as evidenced by an average
      new loan origination fico score during 2016 of 760 for indirect auto loans and
      775 for direct auto loans .


      as of december 31 , 2016 , .4% ( .4 % ) of our auto loan portfolio was nonperforming
      and .5% ( .5 % ) of the portfolio was accruing past due .


      we offer both new and used automobile financing to customers through our various
      channels .


      the portfolio was composed of 57% ( 57 % ) new vehicle loans and 43% ( 43 %
      ) used vehicle loans at december 31 , 2016 .


      the auto loan portfolio 2019s performance is measured monthly , including updated
      collateral values that are obtained monthly and updated fico scores that are
      obtained at least quarterly .


      for internal reporting and risk management , we analyze the portfolio by product
      channel and product type , and regularly evaluate default and delinquency experience
      .


      as part of our overall risk analysis and monitoring , we segment the portfolio
      by loan structure , collateral attributes , and credit metrics which include
      fico score , loan-to-value and term .


      energy related loan portfolio our portfolio of loans outstanding in the oil
      and gas industry totaled $ 2.4 billion as of december 31 , 2016 , or 1% ( 1
      % ) of our total loan portfolio and 2% ( 2 % ) of our total commercial lending
      portfolio .


      this portfolio comprised approximately $ 1.0 billion in the midstream and downstream
      sectors , $ .8 billion to oil services companies and $ .6 billion to upstream
      sectors .


      of the oil services portfolio , approximately $ .2 billion is not asset- based
      or investment grade .


      nonperforming loans in the oil and gas sector as of december 31 , 2016 totaled
      $ 184 million , or 8% ( 8 % ) of total nonperforming assets .


      our portfolio of loans outstanding in the coal industry totaled $ .4 billion
      as of december 31 , 2016 , or less than 1% ( 1 % ) of both our total loan portfolio
      and our total commercial lending portfolio .


      nonperforming loans in the coal industry as of december 31 , 2016 totaled $
      61 million , or 3% ( 3 % ) of total nonperforming assets .


      the pnc financial services group , inc .


