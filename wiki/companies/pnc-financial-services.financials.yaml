      pnc is no longer engaged in the brokered home equity lending business , which
      was acquired with national city .


      management believes our indemnification and repurchase liabilities appropriately
      reflect the estimated probable losses on investor indemnification and repurchase
      claims at december 31 , 2011 and 2010 .


      while management seeks to obtain all relevant information in estimating the
      indemnification and repurchase liability , the estimation process is inherently
      uncertain and imprecise and , accordingly , it is reasonably possible that future
      indemnification and repurchase losses could be more or less than our established
      liability .


      factors that could affect our estimate include the volume of valid claims driven
      by investor strategies and behavior , our ability to successfully negotiate
      claims with investors , housing prices , and other economic conditions .


      at december 31 , 2011 , we estimate that it is reasonably possible that we could
      incur additional losses in excess of our indemnification and repurchase liability
      of up to $ 85 million .


      this estimate of potential additional losses in excess of our liability is based
      on assumed higher investor demands , lower claim rescissions , and lower home
      prices than our current assumptions .


      reinsurance agreements we have two wholly-owned captive insurance subsidiaries
      which provide reinsurance to third-party insurers related to insurance sold
      to our customers .


      these subsidiaries enter into various types of reinsurance agreements with third-party
      insurers where the subsidiary assumes the risk of loss through either an excess
      of loss or quota share agreement up to 100% ( 100 % ) reinsurance .


      in excess of loss agreements , these subsidiaries assume the risk of loss for
      an excess layer of coverage up to specified limits , once a defined first loss
      percentage is met .


      in quota share agreements , the subsidiaries and third-party insurers share
      the responsibility for payment of all claims .


      these subsidiaries provide reinsurance for accidental death & dismemberment
      , credit life , accident & health , lender placed 200 the pnc financial services
      group , inc .


