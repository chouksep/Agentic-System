  - pre_text: 'note 15 financial derivatives we use derivative financial instruments
      ( derivatives ) primarily to help manage exposure to interest rate , market
      and credit risk and reduce the effects that changes in interest rates may have
      on net income , the fair value of assets and liabilities , and cash flows .


      we also enter into derivatives with customers to facilitate their risk management
      activities .


      derivatives represent contracts between parties that usually require little
      or no initial net investment and result in one party delivering cash or another
      type of asset to the other party based on a notional amount and an underlying
      as specified in the contract .


      derivative transactions are often measured in terms of notional amount , but
      this amount is generally not exchanged and it is not recorded on the balance
      sheet .


      the notional amount is the basis to which the underlying is applied to determine
      required payments under the derivative contract .


      the underlying is a referenced interest rate ( commonly libor ) , security price
      , credit spread or other index .


      residential and commercial real estate loan commitments associated with loans
      to be sold also qualify as derivative instruments .


      the following table presents the notional amounts and gross fair values of all
      derivative assets and liabilities held by pnc : table 124 : total gross derivatives
      .'
