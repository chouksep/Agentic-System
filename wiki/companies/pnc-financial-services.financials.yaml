      operational risk management operational risk is the risk of loss resulting from
      inadequate or failed internal processes or systems , human factors , or external
      events .


      this includes losses that may arise as a result of non- compliance with laws
      or regulations , failure to fulfill fiduciary responsibilities , as well as
      litigation or other legal actions .


      operational risk may occur in any of our business activities and manifests itself
      in various ways , including but not limited to : 2022 transaction processing
      errors , 2022 unauthorized transactions and fraud by employees or third parties
      , 2022 material disruption in business activities , 2022 system breaches and
      misuse of sensitive information , 2022 regulatory or governmental actions ,
      fines or penalties , and 2022 significant legal expenses , judgments or settlements
      .


      pnc 2019s operational risk management is inclusive of technology risk management
      , compliance and business continuity risk .


      operational risk management focuses on balancing business needs , regulatory
      expectations and risk management priorities through an adaptive and proactive
      program that is designed to provide a strong governance model , sound and consistent
      risk management processes and transparent operational risk reporting across
      the enterprise .


      the pnc board determines the strategic approach to operational risk via establishment
      of the operational risk appetite and appropriate risk management structure .


      this includes establishment of risk metrics and limits and a reporting structure
      to identify , understand and manage operational risks .


      executive management has responsibility for operational risk management .


      the executive management team is responsible for monitoring significant risks
      , key controls and related issues through management reporting and a governance
      structure of risk committees and sub-committees .


