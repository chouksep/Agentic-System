      , there were 53986 common shareholders of record .


      holders of pnc common stock are entitled to receive dividends when declared
      by our board of directors out of funds legally available for this purpose .


      our board of directors may not pay or set apart dividends on the common stock
      until dividends for all past dividend periods on any series of outstanding preferred
      stock and certain outstanding capital securities issued by the parent company
      have been paid or declared and set apart for payment .


      the board of directors presently intends to continue the policy of paying quarterly
      cash dividends .


      the amount of any future dividends will depend on economic and market conditions
      , our financial condition and operating results , and other factors , including
      contractual restrictions and applicable government regulations and policies
      ( such as those relating to the ability of bank and non-bank subsidiaries to
      pay dividends to the parent company and regulatory capital limitations ) .


      the amount of our dividend is also currently subject to the results of the supervisory
      assessment of capital adequacy and capital planning processes undertaken by
      the federal reserve and our primary bank regulators as part of the comprehensive
      capital analysis and review ( ccar ) process as described in the supervision
      and regulation section in item 1 of this report .


      the federal reserve has the power to prohibit us from paying dividends without
      its approval .


