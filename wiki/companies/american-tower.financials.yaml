  - pre_text: 'american tower corporation and subsidiaries notes to consolidated financial
      statements as of december 31 , 2010 , total unrecognized compensation expense
      related to unvested restricted stock units granted under the 2007 plan was $
      57.5 million and is expected to be recognized over a weighted average period
      of approximately two years .


      employee stock purchase plan 2014the company maintains an employee stock purchase
      plan ( 201cespp 201d ) for all eligible employees .


      under the espp , shares of the company 2019s common stock may be purchased during
      bi-annual offering periods at 85% ( 85 % ) of the lower of the fair market value
      on the first or the last day of each offering period .


      employees may purchase shares having a value not exceeding 15% ( 15 % ) of their
      gross compensation during an offering period and may not purchase more than
      $ 25000 worth of stock in a calendar year ( based on market values at the beginning
      of each offering period ) .


      the offering periods run from june 1 through november 30 and from december 1
      through may 31 of each year .


      during the 2010 , 2009 and 2008 offering periods employees purchased 75354 ,
      77509 and 55764 shares , respectively , at weighted average prices per share
      of $ 34.16 , $ 23.91 and $ 30.08 , respectively .


      the fair value of the espp offerings is estimated on the offering period commencement
      date using a black-scholes pricing model with the expense recognized over the
      expected life , which is the six month offering period over which employees
      accumulate payroll deductions to purchase the company 2019s common stock .


      the weighted average fair value for the espp shares purchased during 2010 ,
      2009 and 2008 was $ 9.43 , $ 6.65 and $ 7.89 , respectively .


      at december 31 , 2010 , 8.7 million shares remain reserved for future issuance
      under the plan .


      key assumptions used to apply this pricing model for the years ended december
      31 , are as follows: .'
