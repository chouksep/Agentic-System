    post_text: 'on february 19 , 2016 , the closing price of our common stock was
      $ 87.32 per share as reported on the nyse .


      as of february 19 , 2016 , we had 423897556 outstanding shares of common stock
      and 159 registered holders .


      dividends as a reit , we must annually distribute to our stockholders an amount
      equal to at least 90% ( 90 % ) of our reit taxable income ( determined before
      the deduction for distributed earnings and excluding any net capital gain )
      .


      generally , we have distributed and expect to continue to distribute all or
      substantially all of our reit taxable income after taking into consideration
      our utilization of net operating losses ( 201cnols 201d ) .


      we have two series of preferred stock outstanding , 5.25% ( 5.25 % ) mandatory
      convertible preferred stock , series a , issued in may 2014 ( the 201cseries
      a preferred stock 201d ) , with a dividend rate of 5.25% ( 5.25 % ) , and the
      5.50% ( 5.50 % ) mandatory convertible preferred stock , series b ( the 201cseries
      b preferred stock 201d ) , issued in march 2015 , with a dividend rate of 5.50%
      ( 5.50 % ) .


      dividends are payable quarterly in arrears , subject to declaration by our board
      of directors .


      the amount , timing and frequency of future distributions will be at the sole
      discretion of our board of directors and will be dependent upon various factors
      , a number of which may be beyond our control , including our financial condition
      and operating cash flows , the amount required to maintain our qualification
      for taxation as a reit and reduce any income and excise taxes that we otherwise
      would be required to pay , limitations on distributions in our existing and
      future debt and preferred equity instruments , our ability to utilize nols to
      offset our distribution requirements , limitations on our ability to fund distributions
      using cash generated through our trss and other factors that our board of directors
      may deem relevant .


      we have distributed an aggregate of approximately $ 2.3 billion to our common
      stockholders , including the dividend paid in january 2016 , primarily subject
      to taxation as ordinary income .


