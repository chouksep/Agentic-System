      equity mandatory convertible preferred stock offering 2014on may 12 , 2014 ,
      the company completed a registered public offering of 6000000 shares of its
      5.25% ( 5.25 % ) mandatory convertible preferred stock , series a , par value
      $ 0.01 per share ( the 201cmandatory convertible preferred stock 201d ) .


      the net proceeds of the offering were $ 582.9 million after deducting commissions
      and estimated expenses .


      the company used the net proceeds from this offering to fund acquisitions ,
      including the acquisition from richland , initially funded by indebtedness incurred
      under the 2013 credit facility .


      unless converted earlier , each share of the mandatory convertible preferred
      stock will automatically convert on may 15 , 2017 , into between 0.9174 and
      1.1468 shares of common stock , depending on the applicable market value of
      the common stock and subject to anti-dilution adjustments .


      subject to certain restrictions , at any time prior to may 15 , 2017 , holders
      of the mandatory convertible preferred stock may elect to convert all or a portion
      of their shares into common stock at the minimum conversion rate then in effect
      .


      dividends on shares of mandatory convertible preferred stock are payable on
      a cumulative basis when , as and if declared by the company 2019s board of directors
      ( or an authorized committee thereof ) at an annual rate of 5.25% ( 5.25 % )
      on the liquidation preference of $ 100.00 per share , on february 15 , may 15
      , august 15 and november 15 of each year , commencing on august 15 , 2014 to
      , and including , may 15 , 2017 .


      the company may pay dividends in cash or , subject to certain limitations ,
      in shares of common stock or any combination of cash and shares of common stock
      .


      the terms of the mandatory convertible preferred stock provide that , unless
      full cumulative dividends have been paid or set aside for payment on all outstanding
      mandatory convertible preferred stock for all prior dividend periods , no dividends
      may be declared or paid on common stock .


