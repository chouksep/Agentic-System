  - pre_text: 'as of december 31 , 2016 , we had total outstanding indebtedness of
      $ 18.7 billion , with a current portion of $ 238.8 million .


      during the year ended december 31 , 2016 , we generated sufficient cash flow
      from operations to fund our capital expenditures and debt service obligations
      , as well as our required distributions .


      we believe the cash generated by operating activities during the year ending
      december 31 , 2017 will be sufficient to fund our required distributions , capital
      expenditures , debt service obligations ( interest and principal repayments
      ) and signed acquisitions .


      as of december 31 , 2016 , we had $ 423.0 million of cash and cash equivalents
      held by our foreign subsidiaries , of which $ 183.9 million was held by our
      joint ventures .


      while certain subsidiaries may pay us interest or principal on intercompany
      debt , it has not been our practice to repatriate earnings from our foreign
      subsidiaries primarily due to our ongoing expansion efforts and related capital
      needs .


      however , in the event that we do repatriate any funds , we may be required
      to accrue and pay taxes .


