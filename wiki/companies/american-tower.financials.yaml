    post_text: '( 1 ) the majority of sites acquired or constructed in 2014 were in
      brazil , india and mexico ; in 2013 were in brazil , colombia , costa rica ,
      india , mexico and south africa ; and in 2012 were in brazil , germany , india
      and uganda .


      rental and management operations expenses .


      direct operating expenses incurred by our domestic and international rental
      and management segments include direct site level expenses and consist primarily
      of ground rent and power and fuel costs , some of which may be passed through
      to our tenants , as well as property taxes , repairs and maintenance .


      these segment direct operating expenses exclude all segment and corporate selling
      , general , administrative and development expenses , which are aggregated into
      one line item entitled selling , general , administrative and development expense
      in our consolidated statements of operations .


      in general , our domestic and international rental and management segments 2019
      selling , general , administrative and development expenses do not significantly
      increase as a result of adding incremental tenants to our legacy sites and typically
      increase only modestly year-over-year .


      as a result , leasing additional space to new tenants on our legacy sites provides
      significant incremental cash flow .


      we may , however , incur additional segment selling , general , administrative
      and development expenses as we increase our presence in geographic areas where
      we have recently launched operations or are focused on expanding our portfolio
      .


      our profit margin growth is therefore positively impacted by the addition of
      new tenants to our legacy sites and can be temporarily diluted by our development
      activities .


      network development services segment revenue growth .


      as we continue to focus on growing our rental and management operations , we
      anticipate that our network development services revenue will continue to represent
      a small percentage of our total revenues .


      non-gaap financial measures included in our analysis of our results of operations
      are discussions regarding earnings before interest , taxes , depreciation ,
      amortization and accretion , as adjusted ( 201cadjusted ebitda 201d ) , funds
      from operations , as defined by the national association of real estate investment
      trusts ( 201cnareit ffo 201d ) and adjusted funds from operations ( 201caffo
      201d ) .


      we define adjusted ebitda as net income before income ( loss ) on discontinued
      operations , net ; income ( loss ) on equity method investments ; income tax
      benefit ( provision ) ; other income ( expense ) ; gain ( loss ) on retirement
      of long-term obligations ; interest expense ; interest income ; other operating
      income ( expense ) ; depreciation , amortization and accretion ; and stock-based
      compensation expense .


      nareit ffo is defined as net income before gains or losses from the sale or
      disposal of real estate , real estate related impairment charges , real estate
      related depreciation , amortization and accretion and dividends declared on
      preferred stock , and including adjustments for ( i ) unconsolidated affiliates
      and ( ii ) noncontrolling interest. .'
