      ( 11 ) includes payments under non-cancellable initial terms , as well as payments
      for certain renewal periods at our option , which we expect to renew because
      failure to renew could result in a loss of the applicable communications sites
      and related revenues from tenant leases .


      ( 12 ) primarily represents our asset retirement obligations and excludes certain
      other non-current liabilities included in our consolidated balance sheet , primarily
      our straight-line rent liability for which cash payments are included in operating
      lease payments and unearned revenue that is not payable in cash .


      ( 13 ) excludes $ 26.6 million of liabilities for unrecognized tax positions
      and $ 24.9 million of accrued income tax related interest and penalties included
      in our consolidated balance sheet as we are uncertain as to when and if the
      amounts may be settled .


      settlement of such amounts could require the use of cash flows generated from
      operations .


      we expect the unrecognized tax benefits to change over the next 12 months if
      certain tax matters ultimately settle with the applicable taxing jurisdiction
      during this timeframe .


      however , based on the status of these items and the amount of uncertainty associated
      with the outcome and timing of audit settlements , we are currently unable to
      estimate the impact of the amount of such changes , if any , to previously recorded
      uncertain tax positions .


      off-balance sheet arrangements .


      we have no material off-balance sheet arrangements as defined in item 303 (
      a ) ( 4 ) ( ii ) of sec regulation s-k .


      interest rate swap agreements .


      we have entered into interest rate swap agreements to manage our exposure to
      variability in interest rates on debt in colombia and south africa .


      all of our interest rate swap agreements have been designated as cash flow hedges
      and have an aggregate notional amount of $ 79.9 million , interest rates ranging
      from 5.74% ( 5.74 % ) to 7.83% ( 7.83 % ) and expiration dates through april
      2021 .


      in february 2014 , we repaid the costa rica loan and subsequently terminated
      the associated interest rate swap agreements .


