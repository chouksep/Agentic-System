    post_text: '( 1 ) the majority of sites acquired or constructed in 2012 were in
      brazil , germany , india and uganda ; in 2011 were in brazil , colombia , ghana
      , india , mexico and south africa ; and in 2010 were in chile , colombia , india
      and peru .


      network development services segment revenue growth .


      as we continue to focus on growing our rental and management operations , we
      anticipate that our network development services revenue will continue to represent
      a relatively small percentage of our total revenues .


      through our network development services segment , we offer tower-related services
      , including site acquisition , zoning and permitting services and structural
      analysis services , which primarily support our site leasing business and the
      addition of new tenants and equipment on our sites , including in connection
      with provider network upgrades .


      rental and management operations expenses .


      direct operating expenses incurred by our domestic and international rental
      and management segments include direct site level expenses and consist primarily
      of ground rent , property taxes , repairs and maintenance , security and power
      and fuel costs , some of which may be passed through to our tenants .


      these segment direct operating expenses exclude all segment and corporate selling
      , general , administrative and development expenses , which are aggregated into
      one line item entitled selling , general , administrative and development expense
      in our consolidated statements of operations .


      in general , our domestic and international rental and management segments selling
      , general , administrative and development expenses do not significantly increase
      as a result of adding incremental tenants to our legacy sites and typically
      increase only modestly year-over-year .


      as a result , leasing additional space to new tenants on our legacy sites provides
      significant incremental cash flow .


      we may incur additional segment selling , general , administrative and development
      expenses as we increase our presence in geographic areas where we have recently
      launched operations or are focused on expanding our portfolio .


      our profit margin growth is therefore positively impacted by the addition of
      new tenants to our legacy sites and can be temporarily diluted by our development
      activities. .'
