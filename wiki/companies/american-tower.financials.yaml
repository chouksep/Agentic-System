  - pre_text: 'american tower corporation and subsidiaries notes to consolidated financial
      statements as of december 31 , 2010 and 2009 , the company had $ 295.4 million
      and $ 295.0 million net , respectively ( $ 300.0 million aggregate principal
      amount ) outstanding under the 7.25% ( 7.25 % ) notes .


      as of december 31 , 2010 and 2009 , the carrying value includes a discount of
      $ 4.6 million and $ 5.0 million , respectively .


      5.0% ( 5.0 % ) convertible notes 2014the 5.0% ( 5.0 % ) convertible notes due
      2010 ( 201c5.0% ( 201c5.0 % ) notes 201d ) matured on february 15 , 2010 , and
      interest was payable semiannually on february 15 and august 15 of each year
      .


      the 5.0% ( 5.0 % ) notes were convertible at any time into shares of the company
      2019s class a common stock ( 201ccommon stock 201d ) at a conversion price of
      $ 51.50 per share , subject to adjustment in certain cases .


      as of december 31 , 2010 and 2009 , the company had none and $ 59.7 million
      outstanding , respectively , under the 5.0% ( 5.0 % ) notes .


      ati 7.25% ( 7.25 % ) senior subordinated notes 2014the ati 7.25% ( 7.25 % )
      notes were issued with a maturity of december 1 , 2011 and interest was payable
      semi-annually in arrears on june 1 and december 1 of each year .


      the ati 7.25% ( 7.25 % ) notes were jointly and severally guaranteed on a senior
      subordinated basis by the company and substantially all of the wholly owned
      domestic restricted subsidiaries of ati and the company , other than spectrasite
      and its subsidiaries .


      the notes ranked junior in right of payment to all existing and future senior
      indebtedness of ati , the sister guarantors ( as defined in the indenture relating
      to the notes ) and their domestic restricted subsidiaries .


      the ati 7.25% ( 7.25 % ) notes were structurally senior in right of payment
      to all other existing and future indebtedness of the company , including the
      company 2019s senior notes , convertible notes and the revolving credit facility
      and term loan .


      during the year ended december 31 , 2010 , ati issued a notice for the redemption
      of the principal amount of its outstanding ati 7.25% ( 7.25 % ) notes .


      in accordance with the redemption provisions and the indenture for the ati 7.25%
      ( 7.25 % ) notes , the notes were redeemed at a price equal to 100.00% ( 100.00
      % ) of the principal amount , plus accrued and unpaid interest up to , but excluding
      , september 23 , 2010 , for an aggregate purchase price of $ 0.3 million .


      as of december 31 , 2010 and 2009 , the company had none and $ 0.3 million ,
      respectively , outstanding under the ati 7.25% ( 7.25 % ) notes .


      capital lease obligations and notes payable 2014the company 2019s capital lease
      obligations and notes payable approximated $ 46.3 million and $ 59.0 million
      as of december 31 , 2010 and 2009 , respectively .


      these obligations bear interest at rates ranging from 2.5% ( 2.5 % ) to 9.3%
      ( 9.3 % ) and mature in periods ranging from less than one year to approximately
      seventy years .


      maturities 2014as of december 31 , 2010 , aggregate carrying value of long-term
      debt , including capital leases , for the next five years and thereafter are
      estimated to be ( in thousands ) : year ending december 31 .'
