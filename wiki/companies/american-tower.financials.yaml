    post_text: '( 1 ) the majority of sites acquired or constructed internationally
      during 2010 and 2009 were in india and our newly launched operations in chile
      , colombia and peru .


      network development services segment revenue growth .


      as we continue to focus on growing our rental and management operations , we
      anticipate that our network development services revenue will continue to represent
      a small percentage of our total revenues .


      through our network development services segment , we offer tower-related services
      , including site acquisition , zoning and permitting services and structural
      analysis services , which primarily support our site leasing business and the
      addition of new tenants and equipment on our sites .


      rental and management operations expenses .


      our rental and management operations expenses include our direct site level
      expenses and consist primarily of ground rent , property taxes , repairs and
      maintenance and utilities .


      these segment level expenses exclude all segment and corporate level selling
      , general , administrative and development expenses , which are aggregated into
      one line item entitled selling , general , administrative and development expense
      .


      in general , our rental and management segment level selling , general and administrative
      expenses do not significantly increase as a result of adding incremental tenants
      to our legacy sites and typically increase only modestly year-over-year .


      as a result , leasing additional space to new tenants on our legacy sites provides
      significant incremental cash flow .


      in geographic areas where we have recently launched operations or are focused
      on materially expanding our site footprint , we may incur additional segment
      level selling , general and administrative expenses as we increase our presence
      in these areas .


      our profit margin growth is therefore positively impacted by the addition of
      new tenants to our legacy sites and can be temporarily diluted by our development
      activities .


      reit election .


      as we review our tax strategy and assess the utilization of our federal and
      state nols , we are actively considering an election to a reit for u.s .


      federal and , where applicable , state income tax purposes .


      we may make the determination to elect reit status for the taxable year beginning
      january 1 , 2012 , as early as the second half of 2011 , subject to the approval
      of our board of directors , although there is no certainty as to the timing
      of a reit election or whether we will make a reit election at all. .'
