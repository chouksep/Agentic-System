  - pre_text: '2022 international .


      in general , our international markets are less advanced with respect to the
      current technologies deployed for wireless services .


      as a result , demand for our communications sites is driven by continued voice
      network investments , new market entrants and initial 3g data network deployments
      .


      for example , in india , nationwide voice networks continue to be deployed as
      wireless service providers are beginning their initial investments in 3g data
      networks , as a result of recent spectrum auctions .


      in mexico and brazil , where nationwide voice networks have been deployed ,
      some incumbent wireless service providers continue to invest in their 3g data
      networks , and recent spectrum auctions have enabled other incumbent wireless
      service providers and new market entrants to begin their initial investments
      in 3g data networks .


      in markets such as chile and peru , recent spectrum auctions have attracted
      new market entrants , who are expected to begin their investment in deploying
      nationwide voice and 3g data networks .


      we believe demand for our tower sites will continue in our international markets
      as wireless service providers seek to remain competitive by increasing the coverage
      of their networks while also investing in next generation data networks .


      rental and management operations new site revenue growth .


      during the year ended december 31 , 2010 , we grew our portfolio of communications
      sites through acquisitions and construction activities , including the acquisition
      and construction of approximately 7800 sites .


      we continue to evaluate opportunities to acquire larger communications site
      portfolios , both domestically and internationally , that we believe we can
      effectively integrate into our existing portfolio. .'
