      direct operating expenses incurred by our property segments include direct site
      level expenses and consist primarily of ground rent and power and fuel costs
      , some or all of which may be passed through to our tenants , as well as property
      taxes , repairs and maintenance .


      these segment direct operating expenses exclude all segment and corporate selling
      , general , administrative and development expenses , which are aggregated into
      one line item entitled selling , general , administrative and development expense
      in our consolidated statements of operations .


      in general , our property segments 2019 selling , general , administrative and
      development expenses do not significantly increase as a result of adding incremental
      tenants to our legacy sites and typically increase only modestly year-over-year
      .


      as a result , leasing additional space to new tenants on our legacy sites provides
      significant incremental cash flow .


