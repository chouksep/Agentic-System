  - pre_text: 'continue to be deployed as wireless service providers are beginning
      their investments in 3g data networks .


      similarly , in ghana and uganda , wireless service providers continue to build
      out their voice and data networks in order to satisfy increasing demand for
      wireless services .


      in south africa , where voice networks are in a more advanced stage of development
      , carriers are beginning to deploy 3g data networks across spectrum acquired
      in recent spectrum auctions .


      in mexico and brazil , where nationwide voice networks have also been deployed
      , some incumbent wireless service providers continue to invest in their 3g data
      networks , and recent spectrum auctions have enabled other incumbent wireless
      service providers to begin their initial investments in 3g data networks .


      in markets such as chile , peru and colombia , recent or anticipated spectrum
      auctions are expected to drive investment in nationwide voice and 3g data networks
      .


      in germany , our most mature international wireless market , demand is currently
      being driven by a government-mandated rural fourth generation network build-out
      , as well as other tenant initiatives to deploy next generation wireless services
      .


      we believe incremental demand for our tower sites will continue in our international
      markets as wireless service providers seek to remain competitive by increasing
      the coverage of their networks while also investing in next generation data
      networks .


      rental and management operations new site revenue growth .


      during the year ended december 31 , 2012 , we grew our portfolio of communications
      real estate through acquisitions and construction activities , including the
      acquisition and construction of approximately 8810 sites .


      in a majority of our international markets , the acquisition or construction
      of new sites results in increased pass-through revenues and expenses .


      we continue to evaluate opportunities to acquire larger communications real
      estate portfolios , both domestically and internationally , to determine whether
      they meet our risk adjusted hurdle rates and whether we believe we can effectively
      integrate them into our existing portfolio. .'
