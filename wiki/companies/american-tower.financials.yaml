      accounting standards updates 2014in april 2014 , the financial accounting standards
      board ( the 201cfasb 201d ) issued additional guidance on reporting discontinued
      operations .


      under this guidance , only disposals representing a strategic shift in operations
      would be presented as discontinued operations .


      this guidance requires expanded disclosure that provides information about the
      assets , liabilities , income and expenses of discontinued operations .


      additionally , the guidance requires additional disclosure for a disposal of
      a significant part of an entity that does not qualify for discontinued operations
      reporting .


      this guidance is effective for reporting periods beginning on or after december
      15 , 2014 , with early adoption permitted for disposals or classifications of
      assets as held-for-sale that have not been reported in financial statements
      previously issued or available for issuance .


      the company chose to early adopt this guidance during the year ended december
      31 , 2014 and the adoption did not have a material effect on the company 2019s
      financial statements .


      in may 2014 , the fasb issued new revenue recognition guidance , which requires
      an entity to recognize revenue in an amount that reflects the consideration
      to which the entity expects to be entitled in exchange for the transfer of promised
      goods or services to customers .


      the standard will replace most existing revenue recognition guidance in gaap
      and will become effective on january 1 , 2017 .


      the standard permits the use of either the retrospective or cumulative effect
      transition method , and leases are not included in the scope of this standard
      .


      the company is evaluating the impact this standard may have on its financial
      statements .


