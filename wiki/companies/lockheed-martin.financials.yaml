  - pre_text: 'as a result of the transaction , we recognized a net gain of approximately
      $ 1.3 billion , including $ 1.2 billion recognized in 2016 .


      the net gain represents the $ 2.5 billion fair value of the shares of lockheed
      martin common stock exchanged and retired as part of the exchange offer , plus
      the $ 1.8 billion one-time special cash payment , less the net book value of
      the is&gs business of about $ 3.0 billion at august 16 , 2016 and other adjustments
      of about $ 100 million .


      in 2017 , we recognized an additional gain of $ 73 million , which reflects
      certain post-closing adjustments , including certain tax adjustments and the
      final determination of net working capital .


      we classified the operating results of our former is&gs business as discontinued
      operations in our consolidated financial statements in accordance with u.s .


      gaap , as the divestiture of this business represented a strategic shift that
      had a major effect on our operations and financial results .


      however , the cash flows generated by the is&gs business have not been reclassified
      in our consolidated statements of cash flows as we retained this cash as part
      of the transaction .


      the operating results , prior to the august 16 , 2016 divestiture date , of
      the is&gs business that have been reflected within net earnings from discontinued
      operations for the year ended december 31 , 2016 are as follows ( in millions
      ) : .'
