  - pre_text: 'valuation techniques 2013 cash equivalents are mostly comprised of
      short-term money-market instruments and are valued at cost , which approximates
      fair value .


      u.s .


      equity securities and international equity securities categorized as level 1
      are traded on active national and international exchanges and are valued at
      their closing prices on the last trading day of the year .


      for u.s .


      equity securities and international equity securities not traded on an active
      exchange , or if the closing price is not available , the trustee obtains indicative
      quotes from a pricing vendor , broker , or investment manager .


      these securities are categorized as level 2 if the custodian obtains corroborated
      quotes from a pricing vendor or categorized as level 3 if the custodian obtains
      uncorroborated quotes from a broker or investment manager .


      commingled equity funds are investment vehicles valued using the net asset value
      ( nav ) provided by the fund managers .


      the nav is the total value of the fund divided by the number of shares outstanding
      .


      commingled equity funds are categorized as level 1 if traded at their nav on
      a nationally recognized securities exchange or categorized as level 2 if the
      nav is corroborated by observable market data ( e.g. , purchases or sales activity
      ) and we are able to redeem our investment in the near-term .


      fixed income investments categorized as level 2 are valued by the trustee using
      pricing models that use verifiable observable market data ( e.g. , interest
      rates and yield curves observable at commonly quoted intervals and credit spreads
      ) , bids provided by brokers or dealers , or quoted prices of securities with
      similar characteristics .


      fixed income investments are categorized at level 3 when valuations using observable
      inputs are unavailable .


      the trustee obtains pricing based on indicative quotes or bid evaluations from
      vendors , brokers , or the investment manager .


      private equity funds , real estate funds , and hedge funds are valued using
      the nav based on valuation models of underlying securities which generally include
      significant unobservable inputs that cannot be corroborated using verifiable
      observable market data .


      valuations for private equity funds and real estate funds are determined by
      the general partners .


      depending on the nature of the assets , the general partners may use various
      valuation methodologies , including the income and market approaches in their
      models .


      the market approach consists of analyzing market transactions for comparable
      assets while the income approach uses earnings or the net present value of estimated
      future cash flows adjusted for liquidity and other risk factors .


      hedge funds are valued by independent administrators using various pricing sources
      and models based on the nature of the securities .


      private equity funds , real estate funds , and hedge funds are generally categorized
      as level 3 as we cannot fully redeem our investment in the near-term .


      commodities are traded on an active commodity exchange and are valued at their
      closing prices on the last trading day of the year .


      contributions and expected benefit payments we generally determine funding requirements
      for our defined benefit pension plans in a manner consistent with cas and internal
      revenue code rules .


      in 2013 , we made contributions of $ 2.25 billion related to our qualified defined
      benefit pension plans .


      we currently plan to make contributions of approximately $ 1.0 billion related
      to the qualified defined benefit pension plans in 2014 .


      in 2013 , we made contributions of $ 98 million to our retiree medical and life
      insurance plans .


      we do not expect to make contributions related to the retiree medical and life
      insurance plans in 2014 as a result of our 2013 contributions .


