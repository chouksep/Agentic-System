      census , and jtrs ) .


      the decrease in backlog during 2011 compared to 2010 mainly was due to declining
      activities on the jtrs program and several other smaller programs .


      trends we expect is&gs 2019 net sales to decline in 2013 in the mid single digit
      percentage range as compared to 2012 primarily due to the continued downturn
