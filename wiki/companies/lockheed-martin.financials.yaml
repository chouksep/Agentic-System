      of approximately $ 75 million primarily from various services programs and approximately
      $ 20 million from tactical missile programs ( primarily mlrs and jassm ) .


      mfc 2019s operating profit for 2011 increased $ 96 million , or 10% ( 10 % )
      , compared to 2010 .


