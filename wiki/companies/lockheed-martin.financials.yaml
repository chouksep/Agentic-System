      ranging from 5.50% ( 5.50 % ) to 8.50% ( 8.50 % ) maturing in 2023 to 2040 (
      the old notes ) .


      in connection with the exchange , we paid a premium of $ 393 million , of which
      $ 225 million was paid in cash and $ 168 million was in the form of new notes
      .


      this premium , in addition to $ 194 million in remaining unamortized discounts
      related to the old notes , will be amortized as additional interest expense
      over the term of the new notes using the effective interest method .


      we may , at our option , redeem some or all of the new notes at any time by
      paying the principal amount of notes being redeemed plus a make-whole premium
      and accrued and unpaid interest .


      interest on the new notes is payable on june 15 and december 15 of each year
      , beginning on june 15 , 2013 .


      the new notes are unsecured senior obligations and rank equally in right of
      payment with all of our existing and future unsecured and unsubordinated indebtedness
      .


