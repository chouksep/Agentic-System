    post_text: 'rsus are valued based on the fair value of our common stock on the
      date of grant .


      employees who are granted rsus receive the right to receive shares of stock
      after completion of the vesting period , however , the shares are not issued
      , and the employees cannot sell or transfer shares prior to vesting and have
      no voting rights until the rsus vest , generally three years from the date of
      the award .


      employees who are granted rsus receive dividend-equivalent cash payments only
      upon vesting .


      for these rsu awards , the grant-date fair value is equal to the closing market
      price of our common stock on the date of grant less a discount to reflect the
      delay in payment of dividend-equivalent cash payments .


      we recognize the grant-date fair value of rsus , less estimated forfeitures
      , as compensation expense ratably over the requisite service period , which
      beginning with the rsus granted in 2013 is shorter than the vesting period if
      the employee is retirement eligible on the date of grant or will become retirement
      eligible before the end of the vesting period .


      stock options we generally recognize compensation cost for stock options ratably
      over the three-year vesting period .


      at december 31 , 2013 and 2012 , there were 10.2 million ( weighted average
      exercise price of $ 83.65 ) and 20.6 million ( weighted average exercise price
      of $ 83.15 ) stock options outstanding .


      stock options outstanding at december 31 , 2013 have a weighted average remaining
      contractual life of approximately five years and an aggregate intrinsic value
      of $ 663 million , and we expect nearly all of these stock options to vest .


      of the stock options outstanding , 7.7 million ( weighted average exercise price
      of $ 84.37 ) have vested as of december 31 , 2013 and those stock options have
