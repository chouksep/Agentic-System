    post_text: 'we compute basic and diluted earnings per common share by dividing
      net earnings by the respective weighted average number of common shares outstanding
      for the periods presented .


      our calculation of diluted earnings per common share also includes the dilutive
      effects for the assumed vesting of outstanding restricted stock units and exercise
      of outstanding stock options based on the treasury stock method .


      there were no anti-dilutive equity awards for the years ended december 31 ,
      2016 , 2015 and 2014 .


      note 3 2013 acquisitions and divestitures acquisitions acquisition of sikorsky
      aircraft corporation on november 6 , 2015 , we completed the acquisition of
      sikorsky aircraft corporation and certain affiliated companies ( collectively
      201csikorsky 201d ) from united technologies corporation ( utc ) and certain
      of utc 2019s subsidiaries .


      the purchase price of the acquisition was $ 9.0 billion , net of cash acquired
      .


      as a result of the acquisition , sikorsky became a wholly- owned subsidiary
      of ours .


      sikorsky is a global company primarily engaged in the research , design , development
      , manufacture and support of military and commercial helicopters .


      sikorsky 2019s products include military helicopters such as the black hawk
      , seahawk , ch-53k , h-92 ; and commercial helicopters such as the s-76 and
      s-92 .


      the acquisition enables us to extend our core business into the military and
      commercial rotary wing markets , allowing us to strengthen our position in the
      aerospace and defense industry .


      further , this acquisition will expand our presence in commercial and international
      markets .


      sikorsky has been aligned under our rms business segment .


      to fund the $ 9.0 billion acquisition price , we utilized $ 6.0 billion of proceeds
      borrowed under a temporary 364-day revolving credit facility ( the 364-day facility
      ) , $ 2.0 billion of cash on hand and $ 1.0 billion from the issuance of commercial
      paper .


      in the fourth quarter of 2015 , we repaid all outstanding borrowings under the
      364-day facility with the proceeds from the issuance of $ 7.0 billion of fixed
      interest-rate long-term notes in a public offering ( the november 2015 notes
      ) .


      in the fourth quarter of 2015 , we also repaid the $ 1.0 billion in commercial
      paper borrowings ( see 201cnote 10 2013 debt 201d ) . .'
