      million due to the absence of the dris program that supported the 2010 u.s .


      census and a decline in activities on the jtrs program .


      this decrease partially was offset by increased net sales on numerous programs
      .


      is&gs 2019 operating profit for 2011 increased $ 60 million , or 7% ( 7 % )
      , compared to 2010 .


