      the decrease was primarily attributable to lower net sales of about $ 475 million
      due to the wind-down or completion of certain programs , driven by reductions
      in direct warfighter support ( including jieddo ) ; and approximately $ 320
      million due to decreased volume in technical services programs reflecting market
      pressures .


      the decreases were offset by higher net sales of about $ 330 million due to
      the start-up of new programs , growth in recently awarded programs and integration
      of recently acquired companies .


      is&gs 2019 operating profit decreased $ 26 million , or 5% ( 5 % ) , in 2014
