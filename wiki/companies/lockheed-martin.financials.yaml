      recent accounting pronouncements 2013 in may 2014 , the fasb issued a new standard
      that will change the way we recognize revenue and significantly expand the disclosure
      requirements for revenue arrangements .


      on july 9 , 2015 , the fasb approved a one-year deferral of the effective date
      of the standard to 2018 for public companies , with an option that would permit
      companies to adopt the standard in 2017 .


      early adoption prior to 2017 is not permitted .


      the new standard may be adopted either retrospectively or on a modified retrospective
      basis whereby the new standard would be applied to new contracts and existing
      contracts with remaining performance obligations as of the effective date ,
      with a cumulative catch-up adjustment recorded to beginning retained earnings
      at the effective date for existing contracts with remaining performance obligations
      .


      in addition , the fasb is contemplating making additional changes to certain
      elements of the new standard .


      we are currently evaluating the methods of adoption allowed by the new standard
      and the effect the standard is expected to have on our consolidated financial
      statements and related disclosures .


      as the new standard will supersede substantially all existing revenue guidance
      affecting us under gaap , it could impact revenue and cost recognition on thousands
      of contracts across all our business segments , in addition to our business
      processes and our information technology systems .


      as a result , our evaluation of the effect of the new standard will extend over
      future periods .


      in september 2015 , the fasb issued a new standard that simplifies the accounting
      for adjustments made to preliminary amounts recognized in a business combination
      by eliminating the requirement to retrospectively account for those adjustments
      .


      instead , adjustments will be recognized in the period in which the adjustments
      are determined , including the effect on earnings of any amounts that would
      have been recorded in previous periods if the accounting had been completed
      at the acquisition date .


      we adopted the standard on january 1 , 2016 and will prospectively apply the
      standard to business combination adjustments identified after the date of adoption
      .


      in november 2015 , the fasb issued a new standard that simplifies the presentation
      of deferred income taxes and requires that deferred tax assets and liabilities
      , as well as any related valuation allowance , be classified as noncurrent in
      our consolidated balance sheets .


      the standard is effective january 1 , 2017 , with early adoption permitted .


      the standard may be applied either prospectively from the date of adoption or
      retrospectively to all prior periods presented .


      we are currently evaluating when we will adopt the standard and the method of
      adoption .


