filings:
- id: lmt-10k-2010
  form: 10-K
  filed: '2011-02-25'
  period_covered: 2010-FY
  source_url: https://www.sec.gov/Archives/edgar/data/936468/000119312511045739/d10k.htm
  tables:
  - pre_text: 'the aeronautics segment generally includes fewer programs that have
      much larger sales and operating results than programs included in the other
      segments .


      due to the large number of comparatively smaller programs in the remaining segments
      , the discussion of the results of operations of those business segments focuses
      on lines of business within the segment rather than on specific programs .


      the following tables of financial information and related discussion of the
      results of operations of our business segments are consistent with the presentation
      of segment information in note 5 to the financial statements .


      we have a number of programs that are classified by the u.s .


      government and cannot be specifically described .


      the operating results of these classified programs are included in our consolidated
      and business segment results , and are subjected to the same oversight and internal
      controls as our other programs .


      aeronautics our aeronautics business segment is engaged in the research , design
      , development , manufacture , integration , sustainment , support , and upgrade
      of advanced military aircraft , including combat and air mobility aircraft ,
      unmanned air vehicles , and related technologies .


      key combat aircraft programs include the f-35 lightning ii , f-16 fighting falcon
