      ( 2 ) the shares represent annual incentive bonuses and long-term incentive
      performance ( ltip ) payments earned and voluntarily deferred by employees .


      the deferred amounts are payable under the deferred management incentive compensation
      plan ( dmicp ) .


      deferred amounts are credited as phantom stock units at the closing price of
      our stock on the date the deferral is effective .


      amounts equal to our dividend are credited as stock units at the time we pay
      a dividend .


      following termination of employment , a number of shares of stock equal to the
      number of stock units credited to the employee 2019s dmicp account are distributed
      to the employee .


      there is no discount or value transfer on the stock distributed .


      distributions may be made from newly issued shares or shares purchased on the
      open market .


