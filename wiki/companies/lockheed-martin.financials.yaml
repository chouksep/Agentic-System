    post_text: '2012 compared to 2011 is&gs 2019 net sales for 2012 decreased $ 535
      million , or 6% ( 6 % ) , compared to 2011 .


      the decrease was attributable to lower net sales of approximately $ 485 million
      due to the substantial completion of various programs during 2011 ( primarily
      jtrs ; odin ; and u.k .


      census ) ; and about $ 255 million due to lower volume on numerous other programs
      ( primarily hanford ; warfighter information network-tactical ( win-t ) ; command
      , control , battle management and communications ( c2bmc ) ; and transportation
      worker identification credential ( twic ) ) .


      partially offsetting the decreases were higher net sales of approximately $
      140 million from qtc , which was acquired early in the fourth quarter of 2011
      ; and about $ 65 million from increased activity on numerous other programs
      , primarily federal cyber security programs and persistent threat detection
      system ( ptds ) operational support .


      is&gs 2019 operating profit for 2012 decreased $ 66 million , or 8% ( 8 % )
      , compared to 2011 .


      the decrease was attributable to lower operating profit of approximately $ 50
      million due to the favorable impact of the odin contract completion in 2011
      ; about $ 25 million due to an increase in reserves for performance issues related
      to an international airborne surveillance system in 2012 ; and approximately
      $ 20 million due to lower volume on certain programs ( primarily c2bmc and win-t
      ) .


      partially offsetting the decreases was an increase in operating profit due to
      higher risk retirements of approximately $ 15 million from the twic program
      ; and about $ 10 million due to increased activity on numerous other programs
      , primarily federal cyber security programs and ptds operational support .


      operating profit for the jtrs program was comparable as a decrease in volume
      was offset by a decrease in reserves .


      adjustments not related to volume , including net profit booking rate adjustments
      and other matters described above , were approximately $ 20 million higher for
      2012 compared to 2011. .'
