  - pre_text: 'note 12 2013 stock-based compensation during 2013 , 2012 , and 2011
      , we recorded non-cash stock-based compensation expense totaling $ 189 million
      , $ 167 million , and $ 157 million , which is included as a component of other
      unallocated costs on our statements of earnings .


      the net impact to earnings for the respective years was $ 122 million , $ 108
      million , and $ 101 million .


      as of december 31 , 2013 , we had $ 132 million of unrecognized compensation
      cost related to nonvested awards , which is expected to be recognized over a
      weighted average period of 1.5 years .


      we received cash from the exercise of stock options totaling $ 827 million ,
      $ 440 million , and $ 116 million during 2013 , 2012 , and 2011 .


      in addition , our income tax liabilities for 2013 , 2012 , and 2011 were reduced
      by $ 158 million , $ 96 million , and $ 56 million due to recognized tax benefits
      on stock-based compensation arrangements .


      stock-based compensation plans under plans approved by our stockholders , we
      are authorized to grant key employees stock-based incentive awards , including
      options to purchase common stock , stock appreciation rights , restricted stock
      units ( rsus ) , performance stock units ( psus ) , or other stock units .


      the exercise price of options to purchase common stock may not be less than
      the fair market value of our stock on the date of grant .


      no award of stock options may become fully vested prior to the third anniversary
      of the grant , and no portion of a stock option grant may become vested in less
      than one year .


      the minimum vesting period for restricted stock or stock units payable in stock
      is three years .


      award agreements may provide for shorter or pro-rated vesting periods or vesting
      following termination of employment in the case of death , disability , divestiture
      , retirement , change of control , or layoff .


      the maximum term of a stock option or any other award is 10 years .


      at december 31 , 2013 , inclusive of the shares reserved for outstanding stock
      options , rsus and psus , we had 20.4 million shares reserved for issuance under
      the plans .


      at december 31 , 2013 , 4.7 million of the shares reserved for issuance remained
      available for grant under our stock-based compensation plans .


      we issue new shares upon the exercise of stock options or when restrictions
      on rsus and psus have been satisfied .


      the following table summarizes activity related to nonvested rsus during 2013
      : number of rsus ( in thousands ) weighted average grant-date fair value per
