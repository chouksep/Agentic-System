      the new accounting standard did not impact any periods prior to january 1 ,
      2016 , as we applied the changes in the asu on a prospective basis .


      in september 2015 , the fasb issued asu no .


      2015-16 , business combinations ( topic 805 ) , which simplifies the accounting
      for adjustments made to preliminary amounts recognized in a business combination
      by eliminating the requirement to retrospectively account for those adjustments
      .


      instead , adjustments will be recognized in the period in which the adjustments
      are determined , including the effect on earnings of any amounts that would
      have been recorded in previous periods if the accounting had been completed
      at the acquisition date .


      we adopted the asu on january 1 , 2016 and are prospectively applying the asu
      to business combination adjustments identified after the date of adoption .


      in november 2015 , the fasb issued asu no .


      2015-17 , income taxes ( topic 740 ) , which simplifies the presentation of
      deferred income taxes and requires that deferred tax assets and liabilities
      , as well as any related valuation allowance , be classified as noncurrent in
      our consolidated balance sheets .


      we applied the provisions of the asu retrospectively and reclassified approximately
      $ 1.6 billion from current to noncurrent assets and approximately $ 140 million
      from current to noncurrent liabilities in our consolidated balance sheet as
      of december 31 , 2015 .


