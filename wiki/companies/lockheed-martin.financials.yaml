      stock-based compensation 2013 compensation cost related to all share-based payments
      including stock options and restricted stock units is measured at the grant
      date based on the estimated fair value of the award .


      we generally recognize the compensation cost ratably over a three-year vesting
      period .


      income taxes 2013 we periodically assess our tax filing exposures related to
      periods that are open to examination .


      based on the latest available information , we evaluate our tax positions to
      determine whether the position will more likely than not be sustained upon examination
      by the internal revenue service ( irs ) .


      if we cannot reach a more-likely-than-not determination , no benefit is recorded
      .


      if we determine that the tax position is more likely than not to be sustained
      , we record the largest amount of benefit that is more likely than not to be
      realized when the tax position is settled .


      we record interest and penalties related to income taxes as a component of income
      tax expense on our statements of earnings .


      interest and penalties are not material .


