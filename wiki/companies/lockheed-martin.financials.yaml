      for air and missile defense programs ( primarily pac-3 and thaad ) as a result
      of increased volume and retirement of risks ; and approximately $ 25 million
      for various services programs .


      adjustments not related to volume , including net profit rate adjustments described
      above , were approximately $ 35 million higher in 2011 compared to 2010 .


