  - pre_text: 'backlog backlog increased in 2015 compared to 2014 primarily due to
      higher orders on f-35 and c-130 programs .


      backlog decreased slightly in 2014 compared to 2013 primarily due to lower orders
      on f-16 and f-22 programs .


      trends we expect aeronautics 2019 2016 net sales to increase in the mid-single
      digit percentage range as compared to 2015 due to increased volume on the f-35
      and c-130 programs , partially offset by decreased volume on the f-16 program
      .


      operating profit is also expected to increase in the low single-digit percentage
