      $ 1.5 billion revolving credit facility which was scheduled to expire in august
      2016 .


      the new credit facility expires august 2019 and we may request and the banks
      may grant , at their discretion , an increase to the new credit facility of
      up to an additional $ 500 million .


      the credit facility also includes a sublimit of up to $ 300 million available
      for the issuance of letters of credit .


      there were no borrowings outstanding under the new facility through december
      31 , 2014 .


      borrowings under the new credit facility would be unsecured and bear interest
      at rates based , at our option , on a eurodollar rate or a base rate , as defined
      in the new credit facility .


      each bank 2019s obligation to make loans under the credit facility is subject
      to , among other things , our compliance with various representations , warranties
      and covenants , including covenants limiting our ability and certain of our
      subsidiaries 2019 ability to encumber assets and a covenant not to exceed a
      maximum leverage ratio , as defined in the credit facility .


