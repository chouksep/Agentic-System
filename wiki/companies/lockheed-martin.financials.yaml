      175 million from ship and aviation system programs , which reflects higher volume
      and risk retirements on certain programs ( primarily vls ; ptds ; mh-60 ; and
      lcs ) and reserves of about $ 55 million for contract cost matters on ship and
      aviation system programs recorded in the fourth quarter of 2011 ( including
      the terminated presidential helicopter program ) .


      partially offsetting the increase was lower operating profit of approximately
      $ 40 million from undersea systems programs due to reduced profit booking rates
      on certain programs and lower volume on an international combat system program
      and towed array systems ; and about $ 40 million due to lower volume on various
      other programs .


      adjustments not related to volume , including net profit booking rate adjustments
      and other matters described above , were approximately $ 150 million higher
      for 2012 compared to 2011. .'
