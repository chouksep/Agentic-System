      activities , are leased to third parties .


      in the area of manufacturing , most of the operations are of a job-order nature
      , rather than an assembly line process , and productive equipment has multiple
      uses for multiple products .


      management believes that all of our major physical facilities are in good condition
      and are adequate for their intended use .


      item 3 .


      legal proceedings we are a party to or have property subject to litigation and
      other proceedings , including matters arising under provisions relating to the
      protection of the environment .


      we believe the probability is remote that the outcome of these matters will
      have a material adverse effect on the corporation as a whole , notwithstanding
      that the unfavorable resolution of any matter may have a material effect on
      our net earnings in any particular quarter .


      we cannot predict the outcome of legal proceedings with certainty .


      these matters include the proceedings summarized in note 14 2013 legal proceedings
      , commitments , and contingencies beginning on page 78 of this form 10-k .


      from time-to-time , agencies of the u.s .


      government investigate whether our operations are being conducted in accordance
      with applicable regulatory requirements .


      u.s .


      government investigations of us , whether relating to government contracts or
      conducted for other reasons , could result in administrative , civil , or criminal
      liabilities , including repayments , fines , or penalties being imposed upon
      us , or could lead to suspension or debarment from future u.s .


      government contracting .


      u.s .


      government investigations often take years to complete and many result in no
      adverse action against us .


      we are subject to federal and state requirements for protection of the environment
      , including those for discharge of hazardous materials and remediation of contaminated
      sites .


      as a result , we are a party to or have our property subject to various lawsuits
      or proceedings involving environmental protection matters .


      due in part to their complexity and pervasiveness , such requirements have resulted
      in us being involved with related legal proceedings , claims , and remediation
      obligations .


      the extent of our financial exposure cannot in all cases be reasonably estimated
