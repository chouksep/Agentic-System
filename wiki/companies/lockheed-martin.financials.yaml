  - pre_text: 'operating profit for the segment decreased by 1% ( 1 % ) in 2010 compared
      to 2009 .


      for the year , operating profit declines in defense more than offset an increase
      in civil , while operating profit at intelligence essentially was unchanged
      .


      the $ 27 million decrease in operating profit at defense primarily was attributable
      to a decrease in the level of favorable performance adjustments on mission and
      combat systems activities in 2010 .


      the $ 19 million increase in civil principally was due to higher volume on enterprise
      civilian services .


      operating profit for the segment decreased by 3% ( 3 % ) in 2009 compared to
      2008 .


      operating profit declines in civil and intelligence partially were offset by
      growth in defense .


      the decrease of $ 29 million in civil 2019s operating profit primarily was attributable
      to a reduction in the level of favorable performance adjustments on enterprise
      civilian services programs in 2009 compared to 2008 .


      the decrease in operating profit of $ 27 million at intelligence mainly was
      due to a reduction in the level of favorable performance adjustments on security
      solution activities in 2009 compared to 2008 .


      the increase in defense 2019s operating profit of $ 29 million mainly was due
      to volume and improved performance in mission and combat systems .


      the decrease in backlog during 2010 compared to 2009 mainly was due to higher
      sales volume on enterprise civilian service programs at civil , including volume
      associated with the dris 2010 program , and mission and combat system programs
      at defense .


      backlog decreased in 2009 compared to 2008 due to u.s .


      government 2019s exercise of the termination for convenience clause on the tsat
      mission operations system ( tmos ) contract at defense , which resulted in a
      $ 1.6 billion reduction in orders .


      this decline more than offset increased orders on enterprise civilian services
      programs at civil .


      we expect is&gs will experience a low single digit percentage decrease in sales
      for 2011 as compared to 2010 .


      this decline primarily is due to completion of most of the work associated with
      the dris 2010 program .


      operating profit in 2011 is expected to decline in relationship to the decline
      in sales volume , while operating margins are expected to be comparable between
      the years .


      space systems our space systems business segment is engaged in the design ,
      research and development , engineering , and production of satellites , strategic
      and defensive missile systems , and space transportation systems , including
      activities related to the planned replacement of the space shuttle .


      government satellite programs include the advanced extremely high frequency
      ( aehf ) system , the mobile user objective system ( muos ) , the global positioning
      satellite iii ( gps iii ) system , the space-based infrared system ( sbirs )
      , and the geostationary operational environmental satellite r-series ( goes-r
      ) .


      strategic and missile defense programs include the targets and countermeasures
      program and the fleet ballistic missile program .


      space transportation includes the nasa orion program and , through ownership
      interests in two joint ventures , expendable launch services ( united launch
      alliance , or ula ) and space shuttle processing activities for the u.s .


      government ( united space alliance , or usa ) .


      the space shuttle is expected to complete its final flight mission in 2011 and
      our involvement with its launch and processing activities will end at that time
      .


