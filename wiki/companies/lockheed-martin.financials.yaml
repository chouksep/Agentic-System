    post_text: 'the operating results of the is&gs business reported as discontinued
      operations are different than the results previously reported for the is&gs
      business segment .


      results reported within net earnings from discontinued operations only include
      costs that were directly attributable to the is&gs business and exclude certain
      corporate overhead costs that were previously allocated to the is&gs business
      .


      as a result , we reclassified $ 82 million in 2016 of corporate overhead costs
      from the is&gs business to other unallocated , net on our consolidated statement
      of earnings .


      additionally , we retained all assets and obligations related to the pension
      benefits earned by former is&gs business salaried employees through the date
      of divestiture .


      therefore , the non-service portion of net pension costs ( e.g. , interest cost
      , actuarial gains and losses and expected return on plan assets ) for these
      plans have been reclassified from the operating results of the is&gs business
      segment and reported as a reduction to the fas/cas pension adjustment .


      these net pension costs were $ 54 million for the year ended december 31 , 2016
      .


      the service portion of net pension costs related to is&gs business 2019s salaried
      employees that transferred to leidos were included in the operating results
      of the is&gs business classified as discontinued operations because such costs
      are no longer incurred by us .


      significant severance charges related to the is&gs business were historically
      recorded at the lockheed martin corporate office .


      these charges have been reclassified into the operating results of the is&gs
      business , classified as discontinued operations , and excluded from the operating
      results of our continuing operations .


      the amount of severance charges reclassified were $ 19 million in 2016 .


      financial information related to cash flows generated by the is&gs business
      , such as depreciation and amortization , capital expenditures , and other non-cash
      items , included in our consolidated statement of cash flows for the years ended
      december 31 , 2016 were not significant. .'
