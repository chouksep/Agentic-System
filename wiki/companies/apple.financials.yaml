  - pre_text: 'table of contents research and development expense ( 201cr&d 201d )
      r&d expense increased 34% ( 34 % ) or $ 449 million to $ 1.8 billion in 2010
      compared to 2009 .


      this increase was due primarily to an increase in headcount and related expenses
      in the current year to support expanded r&d activities .


      also contributing to this increase in r&d expense in 2010 was the capitalization
      in 2009 of software development costs of $ 71 million related to mac os x snow
      leopard .


      although total r&d expense increased 34% ( 34 % ) during 2010 , it declined
      as a percentage of net sales given the 52% ( 52 % ) year-over-year increase
      in net sales in 2010 .


      the company continues to believe that focused investments in r&d are critical
      to its future growth and competitive position in the marketplace and are directly
      related to timely development of new and enhanced products that are central
      to the company 2019s core business strategy .


      as such , the company expects to make further investments in r&d to remain competitive
      .


      r&d expense increased 20% ( 20 % ) or $ 224 million to $ 1.3 billion in 2009
      compared to 2008 .


      this increase was due primarily to an increase in headcount in 2009 to support
      expanded r&d activities and higher stock-based compensation expenses .


      additionally , $ 71 million of software development costs were capitalized related
      to mac os x snow leopard and excluded from r&d expense during 2009 , compared
      to $ 11 million of software development costs capitalized during 2008 .


      although total r&d expense increased 20% ( 20 % ) during 2009 , it remained
      relatively flat as a percentage of net sales given the 14% ( 14 % ) increase
      in revenue in 2009 .


      selling , general and administrative expense ( 201csg&a 201d ) sg&a expense
      increased $ 1.4 billion or 33% ( 33 % ) to $ 5.5 billion in 2010 compared to
      2009 .


      this increase was due primarily to the company 2019s continued expansion of
      its retail segment , higher spending on marketing and advertising programs ,
      increased stock-based compensation expenses and variable costs associated with
      the overall growth of the company 2019s net sales .


      sg&a expenses increased $ 388 million or 10% ( 10 % ) to $ 4.1 billion in 2009
      compared to 2008 .


      this increase was due primarily to the company 2019s continued expansion of
      its retail segment in both domestic and international markets , higher stock-based
      compensation expense and higher spending on marketing and advertising .


      other income and expense other income and expense for the three years ended
      september 25 , 2010 , are as follows ( in millions ) : total other income and
      expense decreased $ 171 million or 52% ( 52 % ) to $ 155 million during 2010
      compared to $ 326 million and $ 620 million in 2009 and 2008 , respectively
      .


      the overall decrease in other income and expense is attributable to the significant
      declines in interest rates on a year- over-year basis , partially offset by
      the company 2019s higher cash , cash equivalents and marketable securities balances
      .


      the weighted average interest rate earned by the company on its cash , cash
      equivalents and marketable securities was 0.75% ( 0.75 % ) , 1.43% ( 1.43 %
      ) and 3.44% ( 3.44 % ) during 2010 , 2009 and 2008 , respectively .


      additionally the company incurred higher premium expenses on its foreign exchange
      option contracts , which further reduced the total other income and expense
      .


      during 2010 , 2009 and 2008 , the company had no debt outstanding and accordingly
      did not incur any related interest expense .


      provision for income taxes the company 2019s effective tax rates were 24% (
      24 % ) , 32% ( 32 % ) and 32% ( 32 % ) for 2010 , 2009 and 2008 , respectively
      .


      the company 2019s effective rates for these periods differ from the statutory
      federal income tax rate of 35% ( 35 % ) due .'
