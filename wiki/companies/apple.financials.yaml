    post_text: 'other commitments the company utilizes several outsourcing partners
      to manufacture sub-assemblies for the company 2019s products and to perform
      final assembly and testing of finished products .


      these outsourcing partners acquire components and build product based on demand
      information supplied by the company , which typically covers periods up to 150
      days .


      the company also obtains individual components for its products from a wide
      variety of individual suppliers .


      consistent with industry practice , the company acquires components through
      a combination of purchase orders , supplier contracts and open orders based
      on projected demand information .


      where appropriate , the purchases are applied to inventory component prepayments
      that are outstanding with the respective supplier .


      as of september 26 , 2015 , the company had outstanding off-balance sheet third-party
      manufacturing commitments and component purchase commitments of $ 29.5 billion
      .


