      contingencies the company is subject to various legal proceedings and claims
      that have arisen in the ordinary course of business and that have not been fully
      adjudicated .


      in the opinion of management , there was not at least a reasonable possibility
      the company may have incurred a material loss , or a material loss in excess
      of a recorded accrual , with respect to loss contingencies .


      however , the outcome of litigation is inherently uncertain .


      therefore , although management considers the likelihood of such an outcome
      to be remote , if one or more of these legal matters were resolved against the
      company in a reporting period for amounts in excess of management 2019s expectations
      , the company 2019s consolidated financial statements for that reporting period
      could be materially adversely affected .


      apple inc .


      v .


      samsung electronics co. , ltd , et al .


      on august 24 , 2012 , a jury returned a verdict awarding the company $ 1.05
      billion in its lawsuit against samsung electronics co. , ltd and affiliated
      parties in the united states district court , northern district of california
      , san jose division .


      on march 1 , 2013 , the district court upheld $ 599 million of the jury 2019s
      award and ordered a new trial as to the remainder .


      because the award is subject to entry of final judgment , partial re-trial and
      appeal , the company has not recognized the award in its results of operations
      .


      virnetx , inc .


      v .


      apple inc .


      et al .


      on august 11 , 2010 , virnetx , inc .


      filed an action against the company alleging that certain of its products infringed
      on four patents relating to network communications technology .


      on november 6 , 2012 , a jury returned a verdict against the company , and awarded
      damages of $ 368 million .


      the company is challenging the verdict , believes it has valid defenses and
      has not recorded a loss accrual at this time. .'
