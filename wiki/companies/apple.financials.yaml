      other comprehensive income refers to revenue , expenses , and gains and losses
      that under gaap are recorded as an element of shareholders 2019 equity but are
      excluded from net income .


      the company 2019s other comprehensive income consists of foreign currency translation
      adjustments from those subsidiaries not using the u.s .


      dollar as their functional currency , net deferred gains and losses on certain
