    post_text: 'environmental costs the company 2019s water and wastewater operations
      are subject to u.s .


      federal , state , local and foreign requirements relating to environmental protection
      , and as such , the company periodically becomes subject to environmental claims
      in the normal course of business .


      environmental expenditures that relate to current operations or provide a future
      benefit are expensed or capitalized as appropriate .


      remediation costs that relate to an existing condition caused by past operations
      are accrued , on an undiscounted basis , when it is probable that these costs
      will be incurred and can be reasonably estimated .


      remediation costs accrued amounted to $ 1 and $ 2 as of december 31 , 2015 and
      2014 , respectively .


      the accrual relates entirely to a conservation agreement entered into by a subsidiary
      of the company with the national oceanic and atmospheric administration ( 201cnoaa
      201d ) requiring the company to , among other provisions , implement certain
      measures to protect the steelhead trout and its habitat in the carmel river
      watershed in the state of california .


      the company has agreed to pay $ 1 annually from 2010 to 2016 .


      the company 2019s inception-to-date costs related to the noaa agreement were
      recorded in regulatory assets in the accompanying consolidated balance sheets
      as of december 31 , 2015 and 2014 and are expected to be fully recovered from
      customers in future rates .


      derivative financial instruments the company uses derivative financial instruments
      for purposes of hedging exposures to fluctuations in interest rates .


      these derivative contracts are entered into for periods consistent with the
      related underlying exposures and do not constitute positions independent of
      those exposures .


      the company does not enter into derivative contracts for speculative purposes
      and does not use leveraged instruments .


      all derivatives are recognized on the balance sheet at fair value .


      on the date the derivative contract is entered into , the company may designate
      the derivative as a hedge of the fair value of a recognized asset or liability
      ( fair-value hedge ) or a hedge of a forecasted transaction or of the variability
      of cash flows to be received or paid related to a recognized asset or liability
      ( cash-flow hedge ) .


      changes in the fair value of a fair-value hedge , along with the gain or loss
      on the underlying hedged item , are recorded in current-period earnings .


      the effective portion of gains and losses on cash-flow hedges are recorded in
      other comprehensive income , until earnings are affected by the variability
      of cash flows .


      any ineffective portion of designated hedges is recognized in current-period
      earnings .


      cash flows from derivative contracts are included in net cash provided by operating
      activities in the accompanying consolidated statements of cash flows. .'
