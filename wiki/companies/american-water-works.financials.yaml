  - pre_text: 'part i item 1 .


      business our company founded in 1886 , american water works company , inc. ,
      ( the 201ccompany , 201d 201camerican water 201d or 201caww 201d ) is a delaware
      holding company .


      american water is the most geographically diversified , as well as the largest
      publicly-traded , united states water and wastewater utility company , as measured
      by both operating revenues and population served .


      as a holding company , we conduct substantially all of our business operations
      through our subsidiaries .


      our approximately 6400 employees provide an estimated 15 million people with
      drinking water , wastewater and/or other water-related services in 47 states
      and one canadian province .


      operating segments we report our results of operations in two operating segments
      : the regulated businesses and the market- based operations .


      additional information with respect to our operating segment results is included
      in the section entitled 201citem 7 2014management 2019s discussion and analysis
      of financial condition and results of operations , 201d and note 18 of the consolidated
      financial statements .


      regulated businesses our primary business involves the ownership of subsidiaries
      that provide water and wastewater utility services to residential , commercial
      , industrial and other customers , including sale for resale and public authority
      customers .


      we report the results of this business in our regulated businesses segment .


      our subsidiaries that provide these services are generally subject to economic
      regulation by certain state commissions or other entities engaged in economic
      regulation , hereafter referred to as public utility commissions , or 201cpucs
      , 201d of the states in which we operate .


      the federal and state governments also regulate environmental , health and safety
      , and water quality matters .


      our regulated businesses segment operating revenues were $ 2674.3 million for
      2014 , $ 2539.9 for 2013 , $ 2564.4 million for 2012 , accounting for 88.8%
      ( 88.8 % ) , 90.1% ( 90.1 % ) and 89.9% ( 89.9 % ) , respectively , of total
      operating revenues for the same periods .


      the following table sets forth our regulated businesses operating revenues ,
      number of customers and an estimate of population served as of december 31 ,
      2014 : operating revenues ( in millions ) % (  % ) of total number of customers
      % (  % ) of total estimated population served ( in millions ) % (  % ) of total
