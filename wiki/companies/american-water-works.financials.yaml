    post_text: 'included in 2013 is a discrete tax benefit totaling $ 2979 associated
      with an entity re-organization within the company 2019s market-based operations
      segment that allowed for the utilization of state net operating loss carryforwards
      and the release of an associated valuation allowance .


      note 13 : employee benefits pension and other postretirement benefits the company
      maintains noncontributory defined benefit pension plans covering eligible employees
      of its regulated utility and shared services operations .


      benefits under the plans are based on the employee 2019s years of service and
      compensation .


      the pension plans have been closed for all employees .


      the pension plans were closed for most employees hired on or after january 1
      , 2006 .


      union employees hired on or after january 1 , 2001 had their accrued benefit
      frozen and will be able to receive this benefit as a lump sum upon termination
      or retirement .


      union employees hired on or after january 1 , 2001 and non-union employees hired
      on or after january 1 , 2006 are provided with a 5.25% ( 5.25 % ) of base pay
      defined contribution plan .


      the company does not participate in a multiemployer plan .


      the company 2019s pension funding practice is to contribute at least the greater
      of the minimum amount required by the employee retirement income security act
      of 1974 or the normal cost .


      further , the company will consider additional contributions if needed to avoid
      201cat risk 201d status and benefit restrictions under the pension protection
      act of 2006 .


      the company may also consider increased contributions , based on other financial
      requirements and the plans 2019 funded position .


      pension plan assets are invested in a number of actively managed and commingled
      funds including equity and bond funds , fixed income securities , guaranteed
      interest contracts with insurance companies , real estate funds and real estate
      investment trusts ( 201creits 201d ) .


      pension expense in excess of the amount contributed to the pension plans is
      deferred by certain regulated subsidiaries pending future recovery in rates
      charged for utility services as contributions are made to the plans .


      ( see note 6 ) the company also has unfunded noncontributory supplemental non-qualified
      pension plans that provide additional retirement benefits to certain employees.
      .'
    id: awk-2014-table-0
  - pre_text: 'the discount rate assumption was determined for the pension and postretirement
      benefit plans independently .


      at year-end 2011 , the company began using an approach that approximates the
      process of settlement of obligations tailored to the plans 2019 expected cash
      flows by matching the plans 2019 cash flows to the coupons and expected maturity
      values of individually selected bonds .


      the yield curve was developed for a universe containing the majority of u.s.-issued
      aa-graded corporate bonds , all of which were non callable ( or callable with
      make-whole provisions ) .


      historically , for each plan , the discount rate was developed as the level
      equivalent rate that would produce the same present value as that using spot
      rates aligned with the projected benefit payments .


      the expected long-term rate of return on plan assets is based on historical
      and projected rates of return , prior to administrative and investment management
      fees , for current and planned asset classes in the plans 2019 investment portfolios
      .


      assumed projected rates of return for each of the plans 2019 projected asset
      classes were selected after analyzing historical experience and future expectations
      of the returns and volatility of the various asset classes .


      based on the target asset allocation for each asset class , the overall expected
      rate of return for the portfolio was developed , adjusted for historical and
      expected experience of active portfolio management results compared to the benchmark
      returns and for the effect of expenses paid from plan assets .


      the company 2019s pension expense increases as the expected return on assets
      decreases .


      in the determination of year end 2014 projected benefit plan obligations , the
      company adopted a new table based on the society of actuaries rp 2014 mortality
      table including a generational bb-2d projection scale .


      the adoption resulted in a significant increase to pension and other postretirement
      benefit plans 2019 projected benefit obligations .


      assumed health care cost trend rates have a significant effect on the amounts
      reported for the other postretirement benefit plans .


      the health care cost trend rate is based on historical rates and expected market
      conditions .


      a one-percentage-point change in assumed health care cost trend rates would
      have the following effects : one-percentage-point increase one-percentage-point
      decrease effect on total of service and interest cost components .


