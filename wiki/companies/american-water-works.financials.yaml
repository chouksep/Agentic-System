  - pre_text: 'in 2017 , cash flows provided by operations increased $ 160 million
      , primarily due to an increase in net income after non-cash adjustments , including
      the impact of the enactment of the tcja , and an increase in cash flows from
      working capital .


      the main factors contributing to the net income increase are described in the
      201cconsolidated results of operations 201d section and include higher operating
      revenues , partially offset by higher income taxes due to a $ 125 million re-measurement
      charge resulting from the impact of the change in the federal tax rate on the
      company 2019s deferred income taxes from the enactment of the tcja .


      the increase in non-cash activities was mainly attributable to the increase
      in deferred income taxes , as mentioned above , and an increase in depreciation
      and amortization due to additional utility plant placed in service .


      the change in working capital was principally due to ( i ) the timing of accounts
      payable and accrued liabilities , including the accrual recorded during 2016
      for the binding global agreement in principle to settle claims associated with
      the freedom industries chemical spill in west virginia , ( ii ) a decrease in
      unbilled revenues as a result of our military services group achieving significant
      capital project milestones during 2016 , and ( iii ) a change in other current
      assets and liabilities , including the decrease in other current assets associated
      with the termination of our four forward starting swap agreements and timing
      of payments clearing our cash accounts .


