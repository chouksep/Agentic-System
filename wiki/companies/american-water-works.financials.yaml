  - pre_text: 'income taxes american water and its subsidiaries participate in a consolidated
      federal income tax return for u.s .


      tax purposes .


      members of the consolidated group are charged with the amount of federal income
      tax expense determined as if they filed separate returns .


      certain income and expense items are accounted for in different time periods
      for financial reporting than for income tax reporting purposes .


      the company provides deferred income taxes on the difference between the tax
      basis of assets and liabilities and the amounts at which they are carried in
      the financial statements .


      these deferred income taxes are based on the enacted tax rates expected to be
      in effect when these temporary differences are projected to reverse .


      in addition , the regulated utility subsidiaries recognize regulatory assets
      and liabilities for the effect on revenues expected to be realized as the tax
      effects of temporary differences , previously flowed through to customers ,
      reverse .


      investment tax credits have been deferred by the regulated utility subsidiaries
      and are being amortized to income over the average estimated service lives of
      the related assets .


      the company recognizes accrued interest and penalties related to tax positions
      as a component of income tax expense and accounts for sales tax collected from
      customers and remitted to taxing authorities on a net basis .


      see note 13 2014income taxes .


      allowance for funds used during construction afudc is a non-cash credit to income
      with a corresponding charge to utility plant that represents the cost of borrowed
      funds or a return on equity funds devoted to plant under construction .


      the regulated utility subsidiaries record afudc to the extent permitted by the
      pucs .


      the portion of afudc attributable to borrowed funds is shown as a reduction
      of interest , net in the accompanying consolidated statements of operations
      .


      any portion of afudc attributable to equity funds would be included in other
      income ( expenses ) in the accompanying consolidated statements of operations
      .


