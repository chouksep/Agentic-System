      as a component of income tax expense and accounts for sales tax collected from
      customers and remitted to taxing authorities on a net basis .


      see note 14 2014income taxes for additional information .


      allowance for funds used during construction afudc is a non-cash credit to income
      with a corresponding charge to utility plant that represents the cost of borrowed
      funds or a return on equity funds devoted to plant under construction .


      the regulated utility subsidiaries record afudc to the extent permitted by the
      pucs .


      the portion of afudc attributable to borrowed funds is shown as a reduction
