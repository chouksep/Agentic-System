      the increase in 2014 current period tax positions related primarily to the company
      2019s change in tax accounting method filed in 2008 for repair and maintenance
      costs on its utility plant .


      the company does not anticipate material changes to its unrecognized tax benefits
      within the next year .


      if the company sustains all of its positions at december 31 , 2014 and 2013
      , an unrecognized tax benefit of $ 9444 and $ 7439 , respectively , excluding
      interest and penalties , would impact the company 2019s effective tax rate .


      the following table summarizes the changes in the company 2019s valuation allowance:
