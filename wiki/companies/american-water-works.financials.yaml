      a targeted level of variable-rate debt as a percentage of total debt .


      the company also employs derivative financial instruments in the form of variable-to-fixed
      interest rate swaps , classified as economic hedges , in order to fix the interest
      cost on some of its variable-rate debt .


      the company uses a calculation of future cash inflows and estimated future outflows
      , which are discounted , to determine the current fair value .


      additional inputs to the present value calculation include the contract terms
      , counterparty credit risk , interest rates and market volatility .


      other investments 2014other investments primarily represent money market funds
      used for active employee benefits .


      the company includes other investments in other current assets .


