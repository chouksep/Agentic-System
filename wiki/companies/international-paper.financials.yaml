    post_text: 'if the company were to prevail on the unrecognized tax benefits recorded
      , substantially all of the balances at december 31 , 2018 , 2017 and 2016 would
      benefit the effective tax rate .


      the company accrues interest on unrecognized tax benefits as a component of
      interest expense .


      penalties , if incurred , are recognized as a component of income tax expense
      .


      the company had approximately $ 21 million and $ 17 million accrued for the
      payment of estimated interest and penalties associated with unrecognized tax
      benefits at december 31 , 2018 and 2017 , respectively .


      the major jurisdictions where the company files income tax returns are the united
      states , brazil , france , poland and russia .


      generally , tax years 2006 through 2017 remain open and subject to examination
      by the relevant tax authorities .


      the company frequently faces challenges regarding the amount of taxes due .


      these challenges include positions taken by the company related to the timing
      , nature , and amount of deductions and the allocation of income among various
      tax jurisdictions .


      pending audit settlements and the expiration of statute of limitations could
      reduce the uncertain tax positions by $ 30 million during the next twelve months
      .


      the brazilian federal revenue service has challenged the deductibility of goodwill
      amortization generated in a 2007 acquisition by international paper do brasil
      ltda. , a wholly-owned subsidiary of the company .


      the company received assessments for the tax years 2007-2015 totaling approximately
      $ 150 million in tax , and $ 380 million in interest and penalties as of december
      31 , 2018 ( adjusted for variation in currency exchange rates ) .


      after a previous favorable ruling challenging the basis for these assessments
      , we received an unfavorable decision in october 2018 from the brazilian administrative
      council of tax appeals .


      the company intends to further appeal the matter in the brazilian federal courts
      in 2019 ; however , this tax litigation matter may take many years to resolve
      .


      the company believes that it has appropriately evaluated the transaction underlying
      these assessments , and has concluded based on brazilian tax law , that its
      tax position would be sustained .


      the company intends to vigorously defend its position against the current assessments
      and any similar assessments that may be issued for tax years subsequent to 2015
      .


      international paper uses the flow-through method to account for investment tax
      credits earned on eligible open-loop biomass facilities and combined heat and
      power system expenditures .


      under this method , the investment tax credits are recognized as a reduction
      to income tax expense in the year they are earned rather than a reduction in
      the asset basis .


      the company recorded a tax benefit of $ 6 million during 2018 and recorded a
      tax benefit of $ 68 million during 2017 related to investment tax credits earned
      in tax years 2013-2017. .'
