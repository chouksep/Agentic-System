      cellulosic bio-fuel tax credit in a memorandum dated june 28 , 2010 , the irs
      concluded that black liquor would qualify for the cellulosic bio-fuel tax credit
      of $ 1.01 per gallon pro- duced in 2009 .


      on october 15 , 2010 , the irs ruled that companies may qualify in the same
      year for the $ 0.50 per gallon alternative fuel mixture credit and the $ 1.01
      cellulosic bio-fuel tax credit for 2009 , but not for the same gallons of fuel
      produced and con- sumed .


      to the extent a taxpayer changes its position and uses the $ 1.01 credit , it
      must re-pay the refunds they received as alternative fuel mixture credits attributable
      to the gallons converted to the cellulosic bio-fuel credit .


      the repayment of this refund must include interest .


      one important difference between the two credits is that the $ 1.01 credit must
      be credited against a company 2019s federal tax liability , and the credit may
      be carried forward through 2015 .


      in contrast , the $ 0.50 credit is refundable in cash .


      also , the cellulosic bio- fuel credit is required to be included in federal
      tax- able income .


      the company filed an application with the irs on november 18 , 2010 , to receive
      the required registra- tion code to become a registered cellulosic bio-fuel
      producer .


      the company received its registration code on february 28 , 2011 .


      the company has evaluated the optimal use of the two credits with respect to
      gallons produced in 2009 .


      considerations include uncertainty around future federal taxable income , the
      taxability of the alter- native fuel mixture credit , future liquidity and uses
      of cash such as , but not limited to , acquisitions , debt repayments and voluntary
      pension contributions versus repayment of alternative fuel mixture credits with
      interest .


      at the present time , the company does not intend to convert any gallons under
      the alter- native fuel mixture credit to gallons under the cellulosic bio-fuel
      credit .


      on july 19 , 2011 the com- pany filed an amended 2009 tax return claiming alternative
      fuel mixture tax credits as non-taxable income .


      if that amended position is not upheld , the company will re-evaluate its position
      with regard to alternative fuel mixture gallons produced in 2009 .


      during 2009 , the company produced 64 million gal- lons of black liquor that
      were not eligible for the alternative fuel mixture credit .


      the company claimed these gallons for the cellulosic bio-fuel credit by amending
      the company 2019s 2009 tax return .


      the impact of this amendment was included in the company 2019s 2010 fourth quarter
      income tax provision ( benefit ) , resulting in a $ 40 million net credit to
      tax expense .


      temple-inland , inc .


      also recognized an income tax benefit of $ 83 million in 2010 related to cellulosic
      bio-fuel credits .


      as is the case with other tax credits , taxpayer claims are subject to possible
      future review by the irs which has the authority to propose adjustments to the
      amounts claimed , or credits received .


