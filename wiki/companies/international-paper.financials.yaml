      based on an analysis of the entities discussed above under guidance that considers
      the potential magnitude of the variability in the structures and which party
      has a controlling financial interest , international paper determined that it
      is not the primary beneficiary of the entities , and therefore , should not
      consolidate its investments in these entities .


      it was also determined that the source of variability in the structure is the
      value of the timber notes , the assets most significantly impacting the structure
      2019s economic performance .


      the credit quality of the timber notes is supported by irrevocable letters of
      credit obtained by third-party buyers which are 100% ( 100 % ) cash collateralized
      .


      international paper analyzed which party has control over the economic performance
      of each entity , and concluded international paper does not have control over
      significant decisions surrounding the timber notes and letters of credit and
      therefore is not the primary beneficiary .


      the company 2019s maximum exposure to loss equals the value of the timber notes
      ; however , an analysis performed by the company concluded the likelihood of
      this exposure is remote .


      international paper also held variable interests in two financing entities that
      were used to monetize long-term notes received from the sale of forestlands
      in 2001 and 2002 .


      international paper transferred notes ( the monetized notes , with an original
      maturity of 10 years from inception ) and cash of approximately $ 1.0 billion
      to these entities in exchange for preferred interests , and accounted for the
      transfers as a sale of the notes with no associated gain or loss .


      in the same period , the entities acquired approximately $ 1.0 billion of international
      paper debt obligations for cash .


      international paper has no obligation to make any further capital contributions
      to these entities and did not provide any financial support that was not previously
      contractually required during the years ended december 31 , 2013 , 2012 or 2011
      .


      the 2001 monetized notes of $ 499 million matured on march 16 , 2011 .


      following their maturity , international paper purchased the class a preferred
      interest in the 2001 financing entities from an external third-party for $ 21
      million .


      as a result of the purchase , effective march 16 , 2011 , international paper
      owned 100% ( 100 % ) of the 2001 financing entities .


      based on an analysis performed by the company after the purchase , under guidance
      that considers the potential magnitude of the variability in the structure and
      which party has a controlling financial interest , international paper determined
      that it was the primary beneficiary of the 2001 financing entities and thus
      consolidated the entities effective march 16 , 2011 .


      effective april 30 , 2011 , international paper liquidated its interest in the
      2001 financing entities .


      activity between the company and the 2001 financing entities during 2011 was
      immaterial. .'
