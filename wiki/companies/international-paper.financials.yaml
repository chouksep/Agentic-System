      of the unamortized net actuarial loss , after remeasurement , resulting in a
      $ 439 million non-cash charge to the company''s earnings in the second quarter
      of 2016 .


      additional payments of $ 8 million and $ 9 million were made during the third
      and fourth quarters , respectively , due to mandatory cash payouts and a small
      lump sum payout , and the pension plan was subsequently remeasured at september
      30 , 2016 and december 31 , 2016 .


      as a result of settlement accounting , the company recognized non-cash settlement
      charges of $ 3 million in both the third and fourth quarters of 2016. .'
