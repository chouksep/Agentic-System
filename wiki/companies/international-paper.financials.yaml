    post_text: '( a ) includes $ 2.3 billion relating to fiber supply agreements entered
      into at the time of the company 2019s 2006 transformation plan forestland sales
      and in conjunction with the 2008 acquisition of weyerhaeuser company 2019s containerboard
      , packaging and recycling business .


      rent expense was $ 154 million , $ 168 million and $ 185 million for 2014 ,
      2013 and 2012 , respectively .


      guarantees in connection with sales of businesses , property , equipment , forestlands
      and other assets , international paper commonly makes representations and warranties
      relating to such businesses or assets , and may agree to indemnify buyers with
      respect to tax and environmental liabilities , breaches of representations and
      warranties , and other matters .


      where liabilities for such matters are determined to be probable and subject
      to reasonable estimation , accrued liabilities are recorded at the time of sale
      as a cost of the transaction .


      environmental proceedings cercla and state actions international paper has been
      named as a potentially responsible party in environmental remediation actions
      under various federal and state laws , including the comprehensive environmental
      response , compensation and liability act ( cercla ) .


      many of these proceedings involve the cleanup of hazardous substances at large
      commercial landfills that received waste from many different sources .


      while joint and several liability is authorized under cercla and equivalent
      state laws , as a practical matter , liability for cercla cleanups is typically
      allocated among the many potential responsible parties .


      remedial costs are recorded in the consolidated financial statements when they
      become probable and reasonably estimable .


      international paper has estimated the probable liability associated with these
      matters to be approximately $ 95 million in the aggregate as of december 31
      , 2014 .


      cass lake : one of the matters referenced above is a closed wood treating facility
      located in cass lake , minnesota .


      during 2009 , in connection with an environmental site remediation action under
      cercla , international paper submitted to the epa a remediation feasibility
      study .


      in june 2011 , the epa selected and published a proposed soil remedy at the
      site with an estimated cost of $ 46 million .


      the overall remediation reserve for the site is currently $ 50 million to address
      the selection of an alternative for the soil remediation component of the overall
      site remedy .


      in october 2011 , the epa released a public statement indicating that the final
      soil remedy decision would be delayed .


      in the unlikely event that the epa changes its proposed soil remedy and approves
      instead a more expensive clean- up alternative , the remediation costs could
      be material , and significantly higher than amounts currently recorded .


      in october 2012 , the natural resource trustees for this site provided notice
      to international paper and other potentially responsible parties of their intent
      to perform a natural resource damage assessment .


      it is premature to predict the outcome of the assessment or to estimate a loss
      or range of loss , if any , which may be incurred .


      other remediation costs in addition to the above matters , other remediation
      costs typically associated with the cleanup of hazardous substances at the company
      2019s current , closed or formerly-owned facilities , and recorded as liabilities
      in the balance sheet , totaled approximately $ 41 million as of december 31
      , 2014 .


      other than as described above , completion of required remedial actions is not
      expected to have a material effect on our consolidated financial statements
      .


      legal proceedings environmental kalamazoo river : the company is a potentially
      responsible party with respect to the allied paper , inc./ portage creek/kalamazoo
      river superfund site ( kalamazoo river superfund site ) in michigan .


      the epa asserts that the site is contaminated primarily by pcbs as a result
      of discharges from various paper mills located along the kalamazoo river , including
      a paper mill formerly owned by st .


      regis paper company ( st .


      regis ) .


      the company is a successor in interest to st .


      regis .


      although the company has not received any orders from the epa , in december
      2014 , the epa sent the company a letter demanding payment of $ 19 million to
      reimburse the epa for costs associated with a time critical removal action of
      pcb contaminated sediments from a portion of the site .


      the company 2019s cercla liability has not been finally determined with respect
      to this or any other portion of the site and we have declined to reimburse the
      epa at this time .


      as noted below , the company is involved in allocation/ apportionment litigation
      with regard to the site .


      accordingly , it is premature to estimate a loss or range of loss with respect
      to this site .


      the company was named as a defendant by georgia- pacific consumer products lp
      , fort james corporation and georgia pacific llc in a contribution and cost
      recovery action for alleged pollution at the site .


      the suit .'
    id: ip-2014-table-0
  - pre_text: 'on the credit rating of the company and a $ 200 million term loan with
      an interest rate of libor plus a margin of 175 basis points , both with maturity
      dates in 2017 .


      the proceeds from these borrowings were used , along with available cash , to
      fund the acquisition of temple- inland .


      during 2012 , international paper fully repaid the $ 1.2 billion term loan .


      international paper utilizes interest rate swaps to change the mix of fixed
      and variable rate debt and manage interest expense .


      at december 31 , 2012 , international paper had interest rate swaps with a total
      notional amount of $ 150 million and maturities in 2013 ( see note 14 derivatives
      and hedging activities on pages 70 through 74 of item 8 .


      financial statements and supplementary data ) .


      during 2012 , existing swaps and the amortization of deferred gains on previously
      terminated swaps decreased the weighted average cost of debt from 6.8% ( 6.8
      % ) to an effective rate of 6.6% ( 6.6 % ) .


      the inclusion of the offsetting interest income from short- term investments
      reduced this effective rate to 6.2% ( 6.2 % ) .


      other financing activities during 2012 included the issuance of approximately
      1.9 million shares of treasury stock , net of restricted stock withholding ,
      and 1.0 million shares of common stock for various incentive plans , including
      stock options exercises that generated approximately $ 108 million of cash .


      payment of restricted stock withholding taxes totaled $ 35 million .


      off-balance sheet variable interest entities information concerning off-balance
      sheet variable interest entities is set forth in note 12 variable interest entities
      and preferred securities of subsidiaries on pages 67 through 69 of item 8 .


      financial statements and supplementary data for discussion .


      liquidity and capital resources outlook for 2015 capital expenditures and long-term
      debt international paper expects to be able to meet projected capital expenditures
      , service existing debt and meet working capital and dividend requirements during
      2015 through current cash balances and cash from operations .


      additionally , the company has existing credit facilities totaling $ 2.0 billion
      of which nothing has been used .


      the company was in compliance with all its debt covenants at december 31 , 2014
      .


      the company 2019s financial covenants require the maintenance of a minimum net
      worth of $ 9 billion and a total debt-to- capital ratio of less than 60% ( 60
      % ) .


      net worth is defined as the sum of common stock , paid-in capital and retained
      earnings , less treasury stock plus any cumulative goodwill impairment charges
      .


      the calculation also excludes accumulated other comprehensive income/ loss and
      nonrecourse financial liabilities of special purpose entities .


      the total debt-to-capital ratio is defined as total debt divided by the sum
      of total debt plus net worth .


      at december 31 , 2014 , international paper 2019s net worth was $ 14.0 billion
      , and the total-debt- to-capital ratio was 40% ( 40 % ) .


      the company will continue to rely upon debt and capital markets for the majority
      of any necessary long-term funding not provided by operating cash flows .


      funding decisions will be guided by our capital structure planning objectives
      .


      the primary goals of the company 2019s capital structure planning are to maximize
      financial flexibility and preserve liquidity while reducing interest expense
      .


      the majority of international paper 2019s debt is accessed through global public
      capital markets where we have a wide base of investors .


      maintaining an investment grade credit rating is an important element of international
      paper 2019s financing strategy .


      at december 31 , 2014 , the company held long-term credit ratings of bbb ( stable
      outlook ) and baa2 ( stable outlook ) by s&p and moody 2019s , respectively
      .


