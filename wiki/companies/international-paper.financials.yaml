      international paper has announced a voluntary , limited-time opportunity for
      former employees who are participants in the retirement plan of international
      paper company ( the pension plan ) to request early payment of their entire
      pension plan benefit in the form of a single lump sum payment .


      eligible participants who wish to receive the lump sum payment must make an
