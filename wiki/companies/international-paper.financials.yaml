      kwidzyn mill will have additional costs associated with the rebuild of a coated
      board machine .


      asian consumer packaging net sales were $ 1.1 billion in 2013 compared with
      $ 830 million in 2012 and $ 855 million in 2011 .


      operating profits in 2013 were a loss of $ 2 million compared with gains of
      $ 4 million in 2012 and $ 35 million in 2011 .


      sales volumes increased in 2013 compared with 2012 , reflecting the ramp-up
      of a new coated paperboard machine installed in 2012 .


      however , average sales price realizations were significantly lower , reflecting
      competitive pressure on sales prices which squeezed margins and created an unfavorable
      product mix .


      lower input costs were offset by higher freight costs .


      in 2012 , start-up costs for the new coated paperboard machine adversely impacted
      operating profits .


      in the first quarter of 2014 , sales volumes are expected to increase slightly
