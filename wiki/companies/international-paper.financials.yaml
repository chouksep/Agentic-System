      and $ 93 million in 2011 .


      sales volumes in 2013 decreased from 2012 in both the european and russian markets
      .


      average sales price realizations were significantly higher in the russian market
      , but were lower in europe .


      input costs were flat year-over-year .


      planned maintenance downtime costs were higher in 2013 than in 2012 .


