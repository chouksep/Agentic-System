      company concluded the likelihood of this exposure was remote .


      during the third quarter of 2015 , we initiated a series of actions in order
      to extend the 2006 monetization structure and maintain the long-term nature
      of the $ 1.4 billion deferred tax liability .


      first , international paper acquired the class a interests in the investor entities
      from a third party for $ 198 million in cash .


      as a result , international paper became the owner of all of the class a and
      class b interests in the entities and became the primary beneficiary of the
      entities .


      the assets and liabilities of the entities , primarily consisting of the timber
      notes and third party bank loans , were recorded at fair value as of the acquisition
      date of the class a interests .


      subsequent to purchasing the class a interests in the investor entities , international
      paper restructured the entities , which resulted in the formation of wholly-
      owned , bankruptcy-remote special purpose entities ( the 2015 financing entities
      ) .


      as part of the restructuring , the timber notes held by the borrower entities
      , subject to the third party bank loans , were contributed to the 2015 financing
      entities along with approximately $ 150 million in international paper debt
      obligations , approximately $ 600 million in cash and approximately $ 130 million
      in demand loans from international paper , and certain entities were liquidated
      .


      as a result of these transactions , international paper began consolidating
      the 2015 financing entities during the third quarter of 2015 .


      also , during the third quarter of 2015 , the 2015 financing entities used $
      630 million in cash to pay down a portion of the third party bank loans and
      refinanced approximately $ 4.2 billion of those loans on nonrecourse terms (
      the 2015 refinance loans ) .


      during the fourth quarter of 2015 , international paper extended the maturity
      date on the timber notes for an additional five years .


      the timber notes are shown in financial assets of special purpose entities on
      the accompanying consolidated balance sheet and mature in august 2021 unless
      extended for an additional five years .


      these notes are supported by approximately $ 4.8 billion of irrevocable letters
      of credit .


      in addition , the company extinguished the 2015 refinance loans scheduled to
      mature in may 2016 and entered into new nonrecourse third party bank loans totaling
      approximately $ 4.2 billion ( the extension loans ) .


      provisions of loan agreements related to approximately $ 1.1 billion of the
      extension loans require the bank issuing letters of credit supporting the timber
      notes pledged as collateral to maintain a credit rating at or above a specified
      threshold .


      in the event the credit rating of the letter of credit bank is downgraded below
      the specified threshold , the letters of credit must be replaced within 60 days
      with letters of credit from a qualifying financial institution .


      the extension loans are shown in nonrecourse financial liabilities of special
      purpose entities on the accompanying consolidated balance sheet and mature in
      the fourth quarter of 2020 .


      the extinguishment of the 2015 refinance loans of approximately $ 4.2 billion
      and the issuance of the extension loans of approximately $ 4.2 billion are shown
      as part of reductions of debt and issuances of debt , respectively , in the
      financing activities of the consolidated statement of cash flows .


      the extension loans are nonrecourse to the company , and are secured by approximately
