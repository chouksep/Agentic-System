      in december 2008 , the worker , retiree and employer recovery act of 2008 (
      wera ) was passed by the u.s .


      congress which provided for pension funding relief and technical corrections
      .


      funding contributions depend on the funding method selected by the company ,
      and the timing of its implementation , as well as on actual demographic data
      and the targeted funding level .


      the company continually reassesses the amount and timing of any discretionary
      contributions and elected to make contributions totaling $ 750 million for both
      years ended december 31 , 2016 and 2015 .


      at this time , we do not expect to have any required contributions to our plans
      in 2017 , although the company may elect to make future voluntary contributions
      .


      the timing and amount of future contributions , which could be material , will
      depend on a number of factors , including the actual earnings and changes in
      values of plan assets and changes in interest rates .


      international paper announced a voluntary , limited-time opportunity for former
      employees who are participants in the retirement plan of international paper
      company ( the pension plan ) to request early payment of their entire pension
      plan benefit in the form of a single lump sum payment .


      the amount of total payments under this program was approximately $ 1.2 billion
      , and were made from plan trust assets on june 30 , 2016 .


      based on the level of payments made , settlement accounting rules applied and
      resulted in a plan remeasurement as of the june 30 , 2016 payment date .


      as a result of settlement accounting , the company recognized a pro-rata portion
      of the unamortized net actuarial loss , after remeasurement , resulting in a
      $ 439 million non-cash charge to the company''s earnings in the second quarter
      of 2016 .


      additional payments of $ 8 million and $ 9 million were made during the third
      and fourth quarters , respectively , due to mandatory cash payouts and a small
      lump sum payout , and the pension plan was subsequently remeasured at september
      30 , 2016 and december 31 , 2016 .


      as a result of settlement accounting , the company recognized non-cash settlement
      charges of $ 3 million in both the third and fourth quarters of 2016. .'
