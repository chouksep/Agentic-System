  - pre_text: 'deferred tax assets and liabilities are recorded in the accompanying
      consolidated balance sheet under the captions deferred income tax assets , deferred
      charges and other assets , other accrued liabilities and deferred income taxes
      .


      the decrease in 2009 in deferred tax assets principally relates to the tax impact
      of changes in recorded qualified pension liabilities , minimum tax credit utilization
      and an increase in the valuation allowance .


      the decrease in deferred income tax liabilities principally relates to less
      tax depreciation taken on the company 2019s assets purchased in 2009 .


      the valuation allowance for deferred tax assets as of december 31 , 2008 was
      $ 72 million .


      the net change in the total valuation allowance for the year ended december
      31 , 2009 , was an increase of $ 274 million .


      the increase of $ 274 million consists primarily of : ( 1 ) $ 211 million related
      to the company 2019s french operations , including a valuation allowance of
      $ 55 million against net deferred tax assets from current year operations and
      $ 156 million recorded in the second quarter of 2009 for the establishment of
      a valuation allowance against previously recorded deferred tax assets , ( 2
      ) $ 10 million for net deferred tax assets arising from the company 2019s united
      king- dom current year operations , and ( 3 ) $ 47 million related to a reduction
      of previously recorded u.s .


      state deferred tax assets , including $ 15 million recorded in the fourth quarter
      of 2009 for louisiana recycling credits .


      the effect on the company 2019s effec- tive tax rate of the aforementioned $
      211 million and $ 10 million is included in the line item 201ctax rate and permanent
      differences on non-u.s .


      earnings . 201d international paper adopted the provisions of new guidance under
