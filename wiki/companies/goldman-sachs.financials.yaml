  - pre_text: 'management 2019s discussion and analysis liquidity risk management
      liquidity is of critical importance to financial institutions .


      most of the recent failures of financial institutions have occurred in large
      part due to insufficient liquidity .


      accordingly , the firm has in place a comprehensive and conservative set of
      liquidity and funding policies to address both firm-specific and broader industry
      or market liquidity events .


      our principal objective is to be able to fund the firm and to enable our core
      businesses to continue to serve clients and generate revenues , even under adverse
      circumstances .


      we manage liquidity risk according to the following principles : excess liquidity
      .


      we maintain substantial excess liquidity to meet a broad range of potential
      cash outflows and collateral needs in a stressed environment .


      asset-liability management .


      we assess anticipated holding periods for our assets and their expected liquidity
      in a stressed environment .


      we manage the maturities and diversity of our funding across markets , products
      and counterparties , and seek to maintain liabilities of appropriate tenor relative
      to our asset base .


      contingency funding plan .


      we maintain a contingency funding plan to provide a framework for analyzing
      and responding to a liquidity crisis situation or periods of market stress .


      this framework sets forth the plan of action to fund normal business activity
      in emergency and stress situations .


      these principles are discussed in more detail below .


      excess liquidity our most important liquidity policy is to pre-fund our estimated
      potential cash and collateral needs during a liquidity crisis and hold this
      excess liquidity in the form of unencumbered , highly liquid securities and
      cash .


      we believe that the securities held in our global core excess would be readily
      convertible to cash in a matter of days , through liquidation , by entering
      into repurchase agreements or from maturities of reverse repurchase agreements
      , and that this cash would allow us to meet immediate obligations without needing
      to sell other assets or depend on additional funding from credit-sensitive markets
      .


      as of december 2012 and december 2011 , the fair value of the securities and
      certain overnight cash deposits included in our gce totaled $ 174.62 billion
      and $ 171.58 billion , respectively .


      based on the results of our internal liquidity risk model , discussed below
      , as well as our consideration of other factors including , but not limited
      to , a qualitative assessment of the condition of the financial markets and
      the firm , we believe our liquidity position as of december 2012 was appropriate
      .


      the table below presents the fair value of the securities and certain overnight
      cash deposits that are included in our gce .


