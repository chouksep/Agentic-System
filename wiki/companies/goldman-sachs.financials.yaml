      2815 2989 credit derivatives the firm enters into a broad array of credit derivatives
      in locations around the world to facilitate client transactions and to manage
      the credit risk associated with market- making and investing and lending activities
      .


      credit derivatives are actively managed based on the firm 2019s net risk position
      .


      credit derivatives are individually negotiated contracts and can have various
      settlement and payment conventions .


      credit events include failure to pay , bankruptcy , acceleration of indebtedness
      , restructuring , repudiation and dissolution of the reference entity .


      credit default swaps .


      single-name credit default swaps protect the buyer against the loss of principal
      on one or more bonds , loans or mortgages ( reference obligations ) in the event
      the issuer ( reference entity ) of the reference obligations suffers a credit
      event .


      the buyer of protection pays an initial or periodic premium to the seller and
      receives protection for the period of the contract .


      if there is no credit event , as defined in the contract , the seller of protection
      makes no payments to the buyer of protection .


      however , if a credit event occurs , the seller of protection is required to
      make a payment to the buyer of protection , which is calculated in accordance
      with the terms of the contract .


      credit indices , baskets and tranches .


      credit derivatives may reference a basket of single-name credit default swaps
      or a broad-based index .


      if a credit event occurs in one of the underlying reference obligations , the
      protection seller pays the protection buyer .


      the payment is typically a pro-rata portion of the transaction 2019s total notional
      amount based on the underlying defaulted reference obligation .


      in certain transactions , the credit risk of a basket or index is separated
      into various portions ( tranches ) , each having different levels of subordination
      .


      the most junior tranches cover initial defaults and once losses exceed the notional
      amount of these junior tranches , any excess loss is covered by the next most
      senior tranche in the capital structure .


      total return swaps .


      a total return swap transfers the risks relating to economic performance of
      a reference obligation from the protection buyer to the protection seller .


      typically , the protection buyer receives from the protection seller a floating
      rate of interest and protection against any reduction in fair value of the reference
      obligation , and in return the protection seller receives the cash flows associated
      with the reference obligation , plus any increase in the fair value of the reference
      obligation .


      132 goldman sachs 2014 annual report .'
