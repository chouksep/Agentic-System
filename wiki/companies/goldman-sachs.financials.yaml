  - pre_text: 'management 2019s discussion and analysis net revenues in equities were
      $ 8.21 billion for 2012 , essentially unchanged compared with 2011 .


      net revenues in securities services were significantly higher compared with
      2011 , reflecting a gain of $ 494 million on the sale of our hedge fund administration
      business .


      in addition , equities client execution net revenues were higher than 2011 ,
      primarily reflecting significantly higher results in cash products , principally
      due to increased levels of client activity .


      these increases were offset by lower commissions and fees , reflecting declines
      in the united states , europe and asia .


      our average daily volumes during 2012 were lower in each of these regions compared
      with 2011 , consistent with listed cash equity market volumes .


      during 2012 , equities operated in an environment generally characterized by
      an increase in global equity prices and lower volatility levels .


      the net loss attributable to the impact of changes in our own credit spreads
      on borrowings for which the fair value option was elected was $ 714 million
      ( $ 433 million and $ 281 million related to fixed income , currency and commodities
      client execution and equities client execution , respectively ) for 2012 , compared
      with a net gain of $ 596 million ( $ 399 million and $ 197 million related to
      fixed income , currency and commodities client execution and equities client
      execution , respectively ) for 2011 .


      during 2012 , institutional client services operated in an environment generally
      characterized by continued broad market concerns and uncertainties , although
      positive developments helped to improve market conditions .


      these developments included certain central bank actions to ease monetary policy
      and address funding risks for european financial institutions .


      in addition , the u.s .


      economy posted stable to improving economic data , including favorable developments
      in unemployment and housing .


      these improvements resulted in tighter credit spreads , higher global equity
      prices and lower levels of volatility .


      however , concerns about the outlook for the global economy and continued political
      uncertainty , particularly the political debate in the united states surrounding
      the fiscal cliff , generally resulted in client risk aversion and lower activity
      levels .


      also , uncertainty over financial regulatory reform persisted .


      operating expenses were $ 12.48 billion for 2012 , 3% ( 3 % ) lower than 2011
      , primarily due to lower brokerage , clearing , exchange and distribution fees
      , and lower impairment charges , partially offset by higher net provisions for
      litigation and regulatory proceedings .


