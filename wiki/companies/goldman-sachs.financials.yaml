  - pre_text: 'notes to consolidated financial statements note 9 .


      collateralized agreements and financings collateralized agreements are securities
      purchased under agreements to resell ( resale agreements or reverse repurchase
      agreements ) and securities borrowed .


      collateralized financings are securities sold under agreements to repurchase
      ( repurchase agreements ) , securities loaned and other secured financings .


      the firm enters into these transactions in order to , among other things , facilitate
      client activities , invest excess cash , acquire securities to cover short positions
      and finance certain firm activities .


      collateralized agreements and financings are presented on a net-by-counterparty
      basis when a legal right of setoff exists .


      interest on collateralized agreements and collateralized financings is recognized
      over the life of the transaction and included in 201cinterest income 201d and
      201cinterest expense , 201d respectively .


      see note 23 for further information about interest income and interest expense
      .


      the table below presents the carrying value of resale and repurchase agreements
      and securities borrowed and loaned transactions. .'
