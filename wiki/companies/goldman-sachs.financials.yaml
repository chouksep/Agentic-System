  - pre_text: 'the goldman sachs group , inc .


      and subsidiaries management 2019s discussion and analysis scenario analyses
      .


      we conduct various scenario analyses including as part of the comprehensive
      capital analysis and review ( ccar ) and dodd-frank act stress tests ( dfast
      ) , as well as our resolution and recovery planning .


      see 201cequity capital management and regulatory capital 2014 equity capital
      management 201d below for further information .


      these scenarios cover short-term and long- term time horizons using various
      macroeconomic and firm- specific assumptions , based on a range of economic
      scenarios .


      we use these analyses to assist us in developing our longer-term balance sheet
      management strategy , including the level and composition of assets , funding
      and equity capital .


      additionally , these analyses help us develop approaches for maintaining appropriate
      funding , liquidity and capital across a variety of situations , including a
      severely stressed environment .


      balance sheet allocation in addition to preparing our consolidated statements
      of financial condition in accordance with u.s .


      gaap , we prepare a balance sheet that generally allocates assets to our businesses
      , which is a non-gaap presentation and may not be comparable to similar non-gaap
      presentations used by other companies .


      we believe that presenting our assets on this basis is meaningful because it
      is consistent with the way management views and manages risks associated with
      the firm 2019s assets and better enables investors to assess the liquidity of
      the firm 2019s assets .


      the table below presents our balance sheet allocation. .'
