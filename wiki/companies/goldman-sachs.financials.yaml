      ( smfg ) provides the firm with credit loss protection on certain approved loan
      commitments ( primarily investment-grade commercial lending commitments ) .


      the notional amount of such loan commitments was $ 27.51 billion and $ 29.24
      billion as of december 2014 and december 2013 , respectively .


      the credit loss protection on loan commitments provided by smfg is generally
      limited to 95% ( 95 % ) of the first loss the firm realizes on such commitments
      , up to a maximum of approximately $ 950 million .


      in addition , subject to the satisfaction of certain conditions , upon the firm
      2019s request , smfg will provide protection for 70% ( 70 % ) of additional
      losses on such commitments , up to a maximum of $ 1.13 billion , of which $
      768 million and $ 870 million of protection had been provided as of december
      2014 and december 2013 , respectively .


      the firm also uses other financial instruments to mitigate credit risks related
      to certain commitments not covered by smfg .


      these instruments primarily include credit default swaps that reference the
      same or similar underlying instrument or entity , or credit default swaps that
      reference a market index .


      warehouse financing .


      the firm provides financing to clients who warehouse financial assets .


      these arrangements are secured by the warehoused assets , primarily consisting
      of corporate loans and commercial mortgage loans .


      contingent and forward starting resale and securities borrowing agreements/forward
      starting repurchase and secured lending agreements the firm enters into resale
      and securities borrowing agreements and repurchase and secured lending agreements
      that settle at a future date , generally within three business days .


      the firm also enters into commitments to provide contingent financing to its
      clients and counterparties through resale agreements .


      the firm 2019s funding of these commitments depends on the satisfaction of all
      contractual conditions to the resale agreement and these commitments can expire
      unused .


      letters of credit the firm has commitments under letters of credit issued by
      various banks which the firm provides to counterparties in lieu of securities
      or cash to satisfy various collateral and margin deposit requirements .


