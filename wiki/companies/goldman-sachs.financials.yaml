      2030 other adjustments primarily include the overfunded portion of our defined
      benefit pension plan obligation , net of associated deferred tax liabilities
      , and disallowed deferred tax assets , credit valuation adjustments on derivative
      liabilities and debt valuation adjustments , as well as other required credit
      risk-based deductions .


      supplementary leverage ratio the revised capital framework introduces a new
      supplementary leverage ratio for advanced approach banking organizations .


      under amendments to the revised capital framework , the u.s .


      federal bank regulatory agencies approved a final rule that implements the supplementary
      leverage ratio aligned with the definition of leverage established by the basel
      committee .


      the supplementary leverage ratio compares tier 1 capital to a measure of leverage
      exposure , defined as the sum of our quarterly average assets less certain deductions
      plus certain off-balance-sheet exposures , including a measure of derivatives
      exposures and commitments .


      the revised capital framework requires a minimum supplementary leverage ratio
      of 5.0% ( 5.0 % ) ( comprised of the minimum requirement of 3.0% ( 3.0 % ) and
      a 2.0% ( 2.0 % ) buffer ) for u.s .


      banks deemed to be g-sibs , effective on january 1 , 2018 .


      certain disclosures regarding the supplementary leverage ratio are required
      beginning in the first quarter of 2015 .


      as of december 2014 , our estimated supplementary leverage ratio was 5.0% (
      5.0 % ) , including tier 1 capital on a fully phased-in basis of $ 73.17 billion
      ( cet1 of $ 64.26 billion plus perpetual non-cumulative preferred stock of $
      9.20 billion less other adjustments of $ 290 million ) divided by total leverage
      exposure of $ 1.45 trillion ( total quarterly average assets of $ 873 billion
      plus adjustments of $ 579 billion , primarily comprised of off-balance-sheet
      exposure related to derivatives and commitments ) .


      we believe that the estimated supplementary leverage ratio is meaningful because
