    post_text: '1 .


      these funds primarily invest in a broad range of industries worldwide in a variety
      of situations , including leveraged buyouts , recapitalizations and growth investments
      .


      2 .


      these funds generally invest in loans and other fixed income instruments and
      are focused on providing private high-yield capital for mid- to large-sized
      leveraged and management buyout transactions , recapitalizations , financings
      , refinancings , acquisitions and restructurings for private equity firms ,
      private family companies and corporate issuers .


