      regulation and capital adequacy the federal reserve board is the primary regulator
      of group inc. , a bank holding company under the bank holding company act of
      1956 ( bhc act ) and a financial holding company under amendments to the bhc
      act effected by the u.s .


      gramm-leach-bliley act of 1999 .


      as a bank holding company , the firm is subject to consolidated regulatory capital
      requirements that are computed in accordance with the federal reserve board
      2019s risk-based capital requirements ( which are based on the 2018basel 1 2019
      capital accord of the basel committee ) .


      these capital requirements are expressed as capital ratios that compare measures
      of capital to risk-weighted assets ( rwas ) .


      the firm 2019s u.s .


      bank depository institution subsidiaries , including gs bank usa , are subject
      to similar capital requirements .


      under the federal reserve board 2019s capital adequacy requirements and the
      regulatory framework for prompt corrective action that is applicable to gs bank
      usa , the firm and its u.s .


      bank depository institution subsidiaries must meet specific capital requirements
      that involve quantitative measures of assets , liabilities and certain off-
      balance-sheet items as calculated under regulatory reporting practices .


      the firm and its u.s .


      bank depository institution subsidiaries 2019 capital amounts , as well as gs
      bank usa 2019s prompt corrective action classification , are also subject to
      qualitative judgments by the regulators about components , risk weightings and
      other factors .


      many of the firm 2019s subsidiaries , including gs&co .


      and the firm 2019s other broker-dealer subsidiaries , are subject to separate
      regulation and capital requirements as described below .


      group inc .


      federal reserve board regulations require bank holding companies to maintain
      a minimum tier 1 capital ratio of 4% ( 4 % ) and a minimum total capital ratio
      of 8% ( 8 % ) .


      the required minimum tier 1 capital ratio and total capital ratio in order to
      be considered a 201cwell-capitalized 201d bank holding company under the federal
      reserve board guidelines are 6% ( 6 % ) and 10% ( 10 % ) , respectively .


      bank holding companies may be expected to maintain ratios well above the minimum
      levels , depending on their particular condition , risk profile and growth plans
      .


      the minimum tier 1 leverage ratio is 3% ( 3 % ) for bank holding companies that
      have received the highest supervisory rating under federal reserve board guidelines
      or that have implemented the federal reserve board 2019s risk-based capital
      measure for market risk .


      other bank holding companies must have a minimum tier 1 leverage ratio of 4%
      ( 4 % ) .


      the table below presents information regarding group inc . 2019s regulatory
      capital ratios. .'
