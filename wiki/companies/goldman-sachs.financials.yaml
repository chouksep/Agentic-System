      effective january 1 , 2018 , tax legislation reduced the u.s .


      corporate tax rate to 21 percent , eliminated tax deductions for certain expenses
      and enacted two new taxes , base erosion and anti-abuse tax ( beat ) and global
      intangible low taxed income ( gilti ) .


      beat is an alternative minimum tax that applies to banks that pay more than
      2 percent of total deductible expenses to certain foreign subsidiaries .


      gilti is a 10.5 percent tax , before allowable credits for foreign taxes paid
      , on the annual earnings and profits of certain foreign subsidiaries .


      based on our current understanding of these rules , the impact of beat and gilti
      is not expected to be material to our effective income tax rate .


