  - pre_text: 'notes to consolidated financial statements note 10 .


      securitization activities the firm securitizes residential and commercial mortgages
      , corporate bonds , loans and other types of financial assets by selling these
      assets to securitization vehicles ( e.g. , trusts , corporate entities and limited
      liability companies ) or through a resecuritization .


      the firm acts as underwriter of the beneficial interests that are sold to investors
      .


      the firm 2019s residential mortgage securitizations are substantially all in
      connection with government agency securitizations .


      beneficial interests issued by securitization entities are debt or equity securities
      that give the investors rights to receive all or portions of specified cash
      inflows to a securitization vehicle and include senior and subordinated interests
      in principal , interest and/or other cash inflows .


      the proceeds from the sale of beneficial interests are used to pay the transferor
      for the financial assets sold to the securitization vehicle or to purchase securities
      which serve as collateral .


      the firm accounts for a securitization as a sale when it has relinquished control
      over the transferred assets .


      prior to securitization , the firm accounts for assets pending transfer at fair
      value and therefore does not typically recognize significant gains or losses
      upon the transfer of assets .


      net revenues from underwriting activities are recognized in connection with
      the sales of the underlying beneficial interests to investors .


      for transfers of assets that are not accounted for as sales , the assets remain
      in 201cfinancial instruments owned , at fair value 201d and the transfer is
      accounted for as a collateralized financing , with the related interest expense
      recognized over the life of the transaction .


      see notes 9 and 23 for further information about collateralized financings and
      interest expense , respectively .


      the firm generally receives cash in exchange for the transferred assets but
      may also have continuing involvement with transferred assets , including ownership
      of beneficial interests in securitized financial assets , primarily in the form
      of senior or subordinated securities .


      the firm may also purchase senior or subordinated securities issued by securitization
      vehicles ( which are typically vies ) in connection with secondary market-making
      activities .


      the primary risks included in beneficial interests and other interests from
      the firm 2019s continuing involvement with securitization vehicles are the performance
      of the underlying collateral , the position of the firm 2019s investment in
      the capital structure of the securitization vehicle and the market yield for
      the security .


      these interests are accounted for at fair value and are included in 201cfinancial
      instruments owned , at fair value 201d and are generally classified in level
      2 of the fair value hierarchy .


      see notes 5 through 8 for further information about fair value measurements
      .


      the table below presents the amount of financial assets securitized and the
      cash flows received on retained interests in securitization entities in which
      the firm had continuing involvement. .'
