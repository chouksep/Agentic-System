      $ 8.26 billion for 2011 , 2% ( 2 % ) higher than 2010 .


      during 2011 , average volatility levels increased and equity prices in europe
      and asia declined significantly , particularly during the third quarter .


      the increase in net revenues reflected higher commissions and fees , primarily
      due to higher market volumes , particularly during the third quarter of 2011
      .


      in addition , net revenues in securities services increased compared with 2010
      , reflecting the impact of higher average customer balances .


      equities client execution net revenues were lower than 2010 , primarily reflecting
      significantly lower net revenues in shares .


      the net gain attributable to the impact of changes in our own credit spreads
      on borrowings for which the fair value option was elected was $ 596 million
      ( $ 399 million and $ 197 million related to fixed income , currency and commodities
      client execution and equities client execution , respectively ) for 2011 , compared
      with a net gain of $ 198 million ( $ 188 million and $ 10 million related to
      fixed income , currency and commodities client execution and equities client
      execution , respectively ) for 2010 .


      institutional client services operated in an environment generally characterized
      by increased concerns regarding the weakened state of global economies , including
      heightened european sovereign debt risk , and its impact on the european banking
      system and global financial institutions .


      these conditions also impacted expectations for economic prospects in the united
      states and were reflected in equity and debt markets more broadly .


      in addition , the downgrade in credit ratings of the u.s .


      government and federal agencies and many financial institutions during the second
      half of 2011 contributed to further uncertainty in the markets .


      these concerns , as well as other broad market concerns , such as uncertainty
      over financial regulatory reform , continued to have a negative impact on our
      net revenues during 2011 .


      operating expenses were $ 12.84 billion for 2011 , 14% ( 14 % ) lower than 2010
      , due to decreased compensation and benefits expenses , primarily resulting
      from lower net revenues , lower net provisions for litigation and regulatory
      proceedings ( 2010 included $ 550 million related to a settlement with the sec
      ) , the impact of the u.k .


      bank payroll tax during 2010 , as well as an impairment of our nyse dmm rights
      of $ 305 million during 2010 .


      these decreases were partially offset by higher brokerage , clearing , exchange
