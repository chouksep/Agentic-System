      loaned were at fair value , respectively .


      resale and repurchase agreements a resale agreement is a transaction in which
      the firm purchases financial instruments from a seller , typically in exchange
      for cash , and simultaneously enters into an agreement to resell the same or
      substantially the same financial instruments to the seller at a stated price
      plus accrued interest at a future date .


      a repurchase agreement is a transaction in which the firm sells financial instruments
      to a buyer , typically in exchange for cash , and simultaneously enters into
      an agreement to repurchase the same or substantially the same financial instruments
      from the buyer at a stated price plus accrued interest at a future date .


      the financial instruments purchased or sold in resale and repurchase agreements
      typically include u.s .


      government and federal agency , and investment-grade sovereign obligations .


      the firm receives financial instruments purchased under resale agreements ,
      makes delivery of financial instruments sold under repurchase agreements , monitors
      the market value of these financial instruments on a daily basis , and delivers
      or obtains additional collateral due to changes in the market value of the financial
      instruments , as appropriate .


      for resale agreements , the firm typically requires delivery of collateral with
      a fair value approximately equal to the carrying value of the relevant assets
      in the consolidated statements of financial condition .


      even though repurchase and resale agreements involve the legal transfer of ownership
      of financial instruments , they are accounted for as financing arrangements
      because they require the financial instruments to be repurchased or resold at
      the maturity of the agreement .


      however , 201crepos to maturity 201d are accounted for as sales .


      a repo to maturity is a transaction in which the firm transfers a security under
      an agreement to repurchase the security where the maturity date of the repurchase
      agreement matches the maturity date of the underlying security .


      therefore , the firm effectively no longer has a repurchase obligation and has
      relinquished control over the underlying security and , accordingly , accounts
      for the transaction as a sale .


      the firm had no repos to maturity outstanding as of december 2012 or december
      2011 .


