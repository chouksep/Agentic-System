    post_text: 'rwas under the federal reserve board 2019s risk-based capital requirements
      are calculated based on the amount of market risk and credit risk .


      rwas for market risk are determined by reference to the firm 2019s value-at-risk
      ( var ) model , supplemented by other measures to capture risks not reflected
      in the firm 2019s var model .


      credit risk for on- balance sheet assets is based on the balance sheet value
      .


      for off-balance sheet exposures , including otc derivatives and commitments
      , a credit equivalent amount is calculated based on the notional amount of each
      trade .


      all such assets and exposures are then assigned a risk weight depending on ,
      among other things , whether the counterparty is a sovereign , bank or a qualifying
      securities firm or other entity ( or if collateral is held , depending on the
      nature of the collateral ) .


      tier 1 leverage ratio is defined as tier 1 capital under basel 1 divided by
      average adjusted total assets ( which includes adjustments for disallowed goodwill
      and intangible assets , and the carrying value of equity investments in non-financial
      companies that are subject to deductions from tier 1 capital ) .


