    post_text: 'operating environment .


      following a challenging first quarter of 2016 , market conditions continued
      to improve with higher asset prices resulting in full year appreciation in our
      client assets in both equity and fixed income assets .


      also , our assets under supervision increased during 2016 from net inflows ,
      primarily in fixed income assets , and liquidity products .


      the mix of our average assets under supervision shifted slightly compared with
      2015 from long- term assets under supervision to liquidity products .


      management fees have been impacted by many factors , including inflows to advisory
      services and outflows from actively-managed mutual funds .


      in the future , if asset prices decline , or investors continue the trend of
      favoring assets that typically generate lower fees or investors withdraw their
      assets , net revenues in investment management would likely be negatively impacted
      .


      during 2015 , investment management operated in an environment generally characterized
      by strong client net inflows , which more than offset the declines in equity
      and fixed income asset prices , which resulted in depreciation in the value
      of client assets , particularly in the third quarter of 2015 .


      the mix of average assets under supervision shifted slightly from long-term
      assets under supervision to liquidity products compared with 2014 .


      2016 versus 2015 .


