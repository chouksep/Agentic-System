  - pre_text: 'the goldman sachs group , inc .


      and subsidiaries notes to consolidated financial statements commercial lending
      .


      the firm 2019s commercial lending commitments are extended to investment-grade
      and non-investment-grade corporate borrowers .


      commitments to investment-grade corporate borrowers are principally used for
      operating liquidity and general corporate purposes .


      the firm also extends lending commitments in connection with contingent acquisition
      financing and other types of corporate lending , as well as commercial real
      estate financing .


      commitments that are extended for contingent acquisition financing are often
      intended to be short-term in nature , as borrowers often seek to replace them
      with other funding sources .


      sumitomo mitsui financial group , inc .


      ( smfg ) provides the firm with credit loss protection on certain approved loan
      commitments ( primarily investment-grade commercial lending commitments ) .


      the notional amount of such loan commitments was $ 25.70 billion and $ 26.88
      billion as of december 2017 and december 2016 , respectively .


      the credit loss protection on loan commitments provided by smfg is generally
      limited to 95% ( 95 % ) of the first loss the firm realizes on such commitments
      , up to a maximum of approximately $ 950 million .


      in addition , subject to the satisfaction of certain conditions , upon the firm
      2019s request , smfg will provide protection for 70% ( 70 % ) of additional
      losses on such commitments , up to a maximum of $ 1.13 billion , of which $
      550 million and $ 768 million of protection had been provided as of december
      2017 and december 2016 , respectively .


      the firm also uses other financial instruments to mitigate credit risks related
      to certain commitments not covered by smfg .


      these instruments primarily include credit default swaps that reference the
      same or similar underlying instrument or entity , or credit default swaps that
      reference a market index .


      warehouse financing .


      the firm provides financing to clients who warehouse financial assets .


      these arrangements are secured by the warehoused assets , primarily consisting
      of retail and corporate loans .


      contingent and forward starting collateralized agreements / forward starting
      collateralized financings contingent and forward starting collateralized agreements
      includes resale and securities borrowing agreements , and forward starting collateralized
      financings includes repurchase and secured lending agreements that settle at
      a future date , generally within three business days .


      the firm also enters into commitments to provide contingent financing to its
      clients and counterparties through resale agreements .


      the firm 2019s funding of these commitments depends on the satisfaction of all
      contractual conditions to the resale agreement and these commitments can expire
      unused .


      letters of credit the firm has commitments under letters of credit issued by
      various banks which the firm provides to counterparties in lieu of securities
      or cash to satisfy various collateral and margin deposit requirements .


      investment commitments investment commitments includes commitments to invest
      in private equity , real estate and other assets directly and through funds
      that the firm raises and manages .


      investment commitments included $ 2.09 billion and $ 2.10 billion as of december
      2017 and december 2016 , respectively , related to commitments to invest in
      funds managed by the firm .


      if these commitments are called , they would be funded at market value on the
      date of investment .


      leases the firm has contractual obligations under long-term noncancelable lease
      agreements for office space expiring on various dates through 2069 .


      certain agreements are subject to periodic escalation provisions for increases
      in real estate taxes and other charges .


      the table below presents future minimum rental payments , net of minimum sublease
      rentals .


