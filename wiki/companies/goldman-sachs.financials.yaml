  - pre_text: 'notes to consolidated financial statements investments in funds that
      calculate net asset value per share cash instruments at fair value include investments
      in funds that are valued based on the net asset value per share ( nav ) of the
      investment fund .


      the firm uses nav as its measure of fair value for fund investments when ( i
      ) the fund investment does not have a readily determinable fair value and (
      ii ) the nav of the investment fund is calculated in a manner consistent with
      the measurement principles of investment company accounting , including measurement
      of the underlying investments at fair value .


      the firm 2019s investments in funds that calculate nav primarily consist of
      investments in firm-sponsored funds where the firm co-invests with third-party
      investors .


      the private equity , credit and real estate funds are primarily closed-end funds
      in which the firm 2019s investments are not eligible for redemption .


      distributions will be received from these funds as the underlying assets are
      liquidated and it is estimated that substantially all of the underlying assets
      of existing funds will be liquidated over the next seven years .


      the firm continues to manage its existing funds taking into account the transition
      periods under the volcker rule of the u.s .


      dodd-frank wall street reform and consumer protection act ( dodd-frank act )
      , although the rules have not yet been finalized .


      the firm 2019s investments in hedge funds are generally redeemable on a quarterly
      basis with 91 days 2019 notice , subject to a maximum redemption level of 25%
      ( 25 % ) of the firm 2019s initial investments at any quarter-end .


      the firm currently plans to comply with the volcker rule by redeeming certain
      of its interests in hedge funds .


      the firm redeemed approximately $ 1.06 billion of these interests in hedge funds
      during the year ended december 2012 .


      the table below presents the fair value of the firm 2019s investments in , and
      unfunded commitments to , funds that calculate nav. .'
