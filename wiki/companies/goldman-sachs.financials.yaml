      2015 , due to expense savings initiatives .


      provision for taxes the effective income tax rate for 2017 was 61.5% ( 61.5
      % ) , up from 28.2% ( 28.2 % ) for 2016 .


      the increase compared with 2016 reflected the estimated impact of tax legislation
      , which was enacted on december 22 , 2017 and , among other things , lowers
      u.s .


      corporate income tax rates as of january 1 , 2018 , implements a territorial
      tax system and imposes a repatriation tax on deemed repatriated earnings of
      foreign subsidiaries .


      the estimated impact of tax legislation was an increase in income tax expense
      of $ 4.40 billion , of which $ 3.32 billion was due to the repatriation tax
      and $ 1.08 billion was due to the effects of the implementation of the territorial
      tax system and the remeasurement of u.s .


      deferred tax assets at lower enacted corporate tax rates .


      the impact of tax legislation may differ from this estimate , possibly materially
      , due to , among other things , ( i ) refinement of our calculations based on
      updated information , ( ii ) changes in interpretations and assumptions , (
      iii ) guidance that may be issued and ( iv ) actions we may take as a result
      of tax legislation .


      excluding the estimated impact of tax legislation , the effective income tax
      rate for 2017 was 22.0% ( 22.0 % ) , down from 28.2% ( 28.2 % ) for 2016 .


      this decrease was primarily due to tax benefits on the settlement of employee
      share-based awards in accordance with asu no .


      2016-09 .


      the impact of these settlements in 2017 was a reduction to our provision for
      taxes of $ 719 million and a reduction in our effective income tax rate of 6.4
      percentage points .


      see note 3 to the consolidated financial statements for further information
      about this asu .


