      variable interest entities a variable interest in a vie is an investment ( e.g.
      , debt or equity ) or other interest ( e.g. , derivatives or loans and lending
      commitments ) that will absorb portions of the vie 2019s expected losses and/or
      receive portions of the vie 2019s expected residual returns .


      the firm 2019s variable interests in vies include senior and subordinated debt
      ; loans and lending commitments ; limited and general partnership interests
      ; preferred and common equity ; derivatives that may include foreign currency
      , equity and/or credit risk ; guarantees ; and certain of the fees the firm
      receives from investment funds .


      certain interest rate , foreign currency and credit derivatives the firm enters
      into with vies are not variable interests because they create , rather than
      absorb , risk .


      vies generally finance the purchase of assets by issuing debt and equity securities
