      operating environment .


      during 2017 , generally higher asset prices and tighter credit spreads were
      supportive of industry-wide underwriting activities , investment management
      performance and other principal transactions .


      however , low levels of volatility in equity , fixed income , currency and commodity
      markets continued to negatively affect our market-making activities , particularly
      in fixed income , currency and commodity products .


      the price of natural gas decreased significantly during 2017 , while the price
      of oil increased compared with the end of 2016 .


      if the trend of low volatility continues over the long term and market-making
      activity levels remain low , or if investment banking activity levels , asset
      prices or assets under supervision decline , net revenues would likely be negatively
      impacted .


      see 201csegment operating results 201d below for further information about the
      operating environment and material trends and uncertainties that may impact
      our results of operations .


      the first half of 2016 included challenging trends in the operating environment
      for our business activities including concerns and uncertainties about global
      economic growth , central bank activity and the political uncertainty and economic
      implications surrounding the potential exit of the u.k .


      from the e.u .


      during the second half of 2016 , the operating environment improved , as global
      equity markets steadily increased and investment grade and high-yield credit
      spreads tightened .


      these trends provided a more favorable backdrop for our business activities
      .


      2017 versus 2016 net revenues in the consolidated statements of earnings were
      $ 32.07 billion for 2017 , 5% ( 5 % ) higher than 2016 , due to significantly
      higher other principal transactions revenues , and higher investment banking
      revenues , investment management revenues and net interest income .


      these increases were partially offset by significantly lower market making revenues
      and lower commissions and fees .


      non-interest revenues .


      investment banking revenues in the consolidated statements of earnings were
      $ 7.37 billion for 2017 , 18% ( 18 % ) higher than 2016 .


      revenues in financial advisory were higher compared with 2016 , reflecting an
      increase in completed mergers and acquisitions transactions .


      revenues in underwriting were significantly higher compared with 2016 , due
      to significantly higher revenues in both debt underwriting , primarily reflecting
      an increase in industry-wide leveraged finance activity , and equity underwriting
      , reflecting an increase in industry-wide secondary offerings .


