      to previously reported amounts to conform to the current presentation : 2030
      regulatory-related fees that are paid to exchanges are now reported in brokerage
      , clearing , exchange and distribution fees .


      previously such amounts were reported in other expenses .


      2030 headcount consists of our employees , and excludes consultants and temporary
      staff previously reported as part of total staff .


      as a result , expenses related to these consultants and temporary staff are
      now reported in professional fees .


      previously such amounts were reported in compensation and benefits expenses
      .


      2018 versus 2017 .


      operating expenses in the consolidated statements of earnings were $ 23.46 billion
      for 2018 , 12% ( 12 % ) higher than 2017 .


      our efficiency ratio ( total operating expenses divided by total net revenues
      ) for 2018 was 64.1% ( 64.1 % ) , compared with 64.0% ( 64.0 % ) for 2017 .


      the increase in operating expenses compared with 2017 was primarily due to higher
      compensation and benefits expenses , reflecting improved operating performance
      , and significantly higher net provisions for litigation and regulatory proceedings
      .


      brokerage , clearing , exchange and distribution fees were also higher , reflecting
      an increase in activity levels , and technology expenses increased , reflecting
      higher expenses related to computing services .


      in addition , expenses related to consolidated investments and our digital lending
      and deposit platform increased , with the increases primarily in depreciation
      and amortization expenses , market development expenses and other expenses .


      the increase compared with 2017 also included $ 297 million related to the recently
      adopted revenue recognition standard .


      see note 3 to the consolidated financial statements for further information
      about asu no .


      2014-09 , 201crevenue from contracts with customers ( topic 606 ) . 201d net
      provisions for litigation and regulatory proceedings for 2018 were $ 844 million
      compared with $ 188 million for 2017 .


      2018 included a $ 132 million charitable contribution to goldman sachs gives
      , our donor-advised fund .


      compensation was reduced to fund this charitable contribution to goldman sachs
      gives .


      we ask our participating managing directors to make recommendations regarding
      potential charitable recipients for this contribution .


      as of december 2018 , headcount increased 9% ( 9 % ) compared with december
      2017 , reflecting an increase in technology professionals and investments in
      new business initiatives .


      2017 versus 2016 .


      operating expenses in the consolidated statements of earnings were $ 20.94 billion
      for 2017 , 3% ( 3 % ) higher than 2016 .


      our efficiency ratio for 2017 was 64.0% ( 64.0 % ) compared with 65.9% ( 65.9
      % ) for 2016 .


      the increase in operating expenses compared with 2016 was primarily driven by
      slightly higher compensation and benefits expenses and our investments to fund
      growth .


      higher expenses related to consolidated investments and our digital lending
      and deposit platform were primarily included in depreciation and amortization
      expenses , market development expenses and other expenses .


      in addition , technology expenses increased , reflecting higher expenses related
      to cloud-based services and software depreciation , and professional fees increased
      , primarily related to consulting costs .


      these increases were partially offset by lower net provisions for litigation
      and regulatory proceedings , and lower occupancy expenses ( primarily related
      to exit costs in 2016 ) .


